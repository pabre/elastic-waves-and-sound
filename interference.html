<style>
/* TEACHER-DEMO v3 — 교사용 시연 도구 기준안

  --hi: #e2553f;
  --lo: #2c6fd4;
  --heat: #f0a20f;
  --nodal: #6a3fd6;
  --anti: #17955a;
  --stage: #dfe5ea;
  --wall: #eef1f3;
  --floor-a: #d8dcd5;
  --floor-b: #d1d6ce;
  --grout: #bcc2b9;

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1116; --surface: #161c23; --surface-2: #1d252e; --ink: #e6ebf0; --muted: #98a4b0; --line: #2b3540;
    --accent: #3fc0b5; --accent-ink: #0d1116; --on-strong: #ffffff; --s1: #3fc6c4; --s2: #f5a04c;
    --hi: #ff7461; --lo: #5d9cff; --heat: #ffbb33; --nodal: #b08cff; --anti: #4fd389;
    --stage: #12171d; --wall: #1a2028; --floor-a: #262c33; --floor-b: #22282f; --grout: #191e24;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1116; --surface: #161c23; --surface-2: #1d252e; --ink: #e6ebf0; --muted: #98a4b0; --line: #2b3540;
  --accent: #3fc0b5; --accent-ink: #0d1116; --on-strong: #ffffff; --s1: #3fc6c4; --s2: #f5a04c;
  --hi: #ff7461; --lo: #5d9cff; --heat: #ffbb33; --nodal: #b08cff; --anti: #4fd389;
  --stage: #12171d; --wall: #1a2028; --floor-a: #262c33; --floor-b: #22282f; --grout: #191e24;

}

/* 상단 바 */
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }

.presets { display: flex; flex-wrap: wrap; gap: 5px; flex: 1 1 520px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px 4px 4px; cursor: pointer; font-size: 13.5px; font-weight: 500; white-space: nowrap; transition: background .15s, border-color .15s; }

.lbl.dist { font: 600 14px var(--mono); }

/* 조작 독 */
.dock { display: flex; flex-wrap: wrap; gap: 8px; }
.dg { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 7px 12px; display: flex; align-items: center; gap: 10px; min-width: 0; }

.tgs { display: flex; flex-wrap: wrap; gap: 4px; }
.tg { border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }
.tg[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.tg .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.pbtn { border: 0; border-radius: 9px; padding: 7px 14px; font-weight: 700; cursor: pointer; background: var(--accent); color: var(--accent-ink); white-space: nowrap; }
.pbtn.alt { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
.pbtn[aria-pressed="true"].snd { background: var(--hi); color: var(--on-strong); }

@media (max-width: 720px) {
  h1 { font-size: 18px; }

  .caption { font-size: 15px; }
  .graph-card { display: none; }
  .stage { height: clamp(380px, 62vh, 700px); }
  .playbar .seg, .timenote { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const V = 340, FD = 0.5, BG = 35, EAR = 1.0;          // 음속 m/s, 화면 속 진동수 Hz, 배경 소음 dB, 소리 평면 높이 m
const PW = 9.0, PD = 5.85, PZ0 = -0.65;                 // 소리 평면 크기와 시작 위치 (스피커 뒤쪽도 조금 보이게)
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

const BASE = { f: 680, d: 1.0, ph2: 0, on1: true, on2: true, mode: 0, front: false, nodal: false, anti: false, paths: false, graph: false };
const S = { ...BASE, run: !reduce, speed: reduce ? 0.3 : 1, sound: false, cap: true, top: false, mic: { x: 0, z: 1.0 }, preset: 0 };
let theta = 0;
const MZ = 1.0;                                          // 교과서: 두 스피커 가운데에서 수직으로 약 1 m
let micTw = null;                                        // 장면이 바뀔 때 마이크가 미끄러지듯 옮겨 감

/* ---------- 물리 ---------- */
const lam = () => V / S.f;
const srcs = () => [{ x: -S.d / 2, z: 0, ph: 0, on: S.on1 }, { x: S.d / 2, z: 0, ph: S.ph2, on: S.on2 }];
const amp = r => 1 / Math.max(r, 0.18);                 // 1 m에서 1, 거리에 반비례
function at(x, z) {
  const k = 2 * Math.PI / lam(), ss = srcs();
  const r = ss.map(s => Math.hypot(x - s.x, z - s.z));
  const a = ss.map((s, i) => s.on ? amp(r[i]) : 0);
  const ph = ss.map((s, i) => k * r[i] + s.ph);
  const re = a[0] * Math.cos(ph[0]) + a[1] * Math.cos(ph[1]);
  const im = a[0] * Math.sin(ph[0]) + a[1] * Math.sin(ph[1]);
  const mag = Math.hypot(re, im);
  const sig = mag > 1e-9 ? 70 + 20 * Math.log10(mag) : -Infinity;          // 스피커 하나, 1 m에서 70 dB
  const dB = 10 * Math.log10(Math.pow(10, sig / 10) + Math.pow(10, BG / 10));
  let dl = (ph[0] - ph[1]) % (2 * Math.PI); if (dl < 0) dl += 2 * Math.PI; if (dl > Math.PI) dl = 2 * Math.PI - dl;
  return { r, a, ph, mag, dB, dr: Math.abs(r[0] - r[1]), deg: dl * 180 / Math.PI };
}
function solveX(dr0, z) {                               // r1 − r2 = dr0 인 x (x에 대해 증가)
  const f = x => Math.hypot(x + S.d / 2, z) - Math.hypot(x - S.d / 2, z);
  let lo = -3, hi = 3; if (f(lo) > dr0 || f(hi) < dr0) return null;
  for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; if (f(m) < dr0) lo = m; else hi = m; }
  return (lo + hi) / 2;
}

/* ---------- 수업 장면 ---------- */
// mic: [x, z] 위치, 'quiet' 반 파장 지점, null 그대로 둠 · micLock: 마이크를 옮기면 설명이 맞지 않게 되는 장면
const PRESETS = [
  { label: '스피커 하나', cap: '스피커 하나: 멀어질수록 작아질 뿐, 조용한 곳은 없다', s: { on2: false, graph: true }, mic: [0, MZ], top: false },
  { label: '두 스피커', cap: '두 소리가 겹친다 · 가운데는 경로차 0 → 보강 간섭', s: { graph: true }, mic: [0, MZ], top: false },
  { label: '조용한 곳', cap: '옆으로 옮겨 경로차 = 반 파장 → 거의 들리지 않는다 (상쇄 간섭)', s: { paths: true, graph: true }, mic: 'quiet', micLock: true, top: false },
  { label: '마루·골', cap: '마루(실선)끼리 만나면 보강 · 마루와 골(점선)이 만나면 상쇄', s: { front: true, nodal: true, anti: true, paths: true }, mic: 'quiet', top: true },
  { label: '간섭 무늬', cap: '조용한 선(상쇄)과 큰 소리 선(보강)이 번갈아 나타난다', s: { mode: 1, nodal: true, anti: true }, mic: null, top: true },
  { label: '진동수 2배', cap: '진동수 2배 → 파장 절반 → 무늬가 촘촘해진다', s: { f: 1360, mode: 1, nodal: true }, mic: null, top: true },
  { label: '간격 넓게', cap: '스피커 사이가 멀수록 무늬가 촘촘해진다', s: { d: 1.6, mode: 1, nodal: true }, mic: null, top: true },
  { label: '반대 위상', cap: '한쪽을 반대 위상으로 → 가운데도 조용해진다 (소음 제거의 원리)', s: { ph2: Math.PI, paths: true, nodal: true, graph: true }, mic: [0, MZ], top: false }
];

/* ---------- 테마 ---------- */
const T = {};
function readTheme() {
  const cs = getComputedStyle(document.documentElement);
  for (const k of ['surface', 'surface-2', 'ink', 'muted', 'line', 'accent', 's1', 's2', 'hi', 'lo', 'heat', 'nodal', 'anti', 'stage', 'wall', 'floor-a', 'floor-b', 'grout']) T[k] = cs.getPropertyValue('--' + k).trim();
  T.font = getComputedStyle(document.body).fontFamily; T.mono = cs.getPropertyValue('--mono').trim();
}
readTheme();

/* ---------- 2D 그래프 ---------- */
const graph = $('#graph'), gctx = graph.getContext('2d');
function drawGraph() {
  const r = graph.getBoundingClientRect(); if (!r.width) return;

let lastRO = '';
function updateReadout(e) {
  const L = lam(), both = S.on1 && S.on2;
  const vals = [`${S.f} Hz`, `${Math.round(L * 100)} cm`, S.on1 ? `${Math.round(e.r[0] * 100)} cm` : '—', S.on2 ? `${Math.round(e.r[1] * 100)} cm` : '—',
    both ? `${Math.round(e.dr * 100)} cm` : '—', both ? `= λ/2 × ${(e.dr / (L / 2)).toFixed(1)}` : '', String(Math.round(e.dB))];
  const key = vals.join('|') + e.deg.toFixed(0);
  if (key === lastRO) return; lastRO = key;
  ['#roF', '#roL', '#roR1', '#roR2', '#roDr', '#roRatio', '#roDb'].forEach((id, i) => { $(id).textContent = vals[i]; });
  const st = $('#roState'); const s = !both ? '' : e.deg <= 25 ? 'plus' : e.deg >= 155 ? 'minus' : '';
  st.dataset.s = s; st.textContent = s === 'plus' ? '보강' : s === 'minus' ? '상쇄' : ''; st.hidden = !s;
  $('#roBar').style.width = `${Math.max(0, Math.min(100, (e.dB - 30) / 50 * 100))}%`;
  $('#lMic').textContent = `${Math.round(e.dB)} dB`;
}

/* ---------- 소리: 소리 발생기 앱의 순수한 음 (마이크가 듣는 크기 그대로) ---------- */
const AU = { ctx: null, osc: null, gain: null, master: null };
function toggleSound() {
  if (!AU.ctx) {
    try {
      AU.ctx = new (window.AudioContext || window.webkitAudioContext)();
      AU.osc = AU.ctx.createOscillator(); AU.gain = AU.ctx.createGain(); AU.osc.type = 'sine'; AU.gain.gain.value = 0; AU.osc.frequency.value = S.f;
      const comp = AU.ctx.createDynamicsCompressor(); comp.threshold.value = -12; comp.knee.value = 6; comp.ratio.value = 6; comp.attack.value = 0.005; comp.release.value = 0.2;
      AU.master = AU.ctx.createGain(); AU.master.gain.value = 0.9;
      AU.osc.connect(AU.gain); AU.gain.connect(comp); comp.connect(AU.master); AU.master.connect(AU.ctx.destination); AU.osc.start();
    } catch (err) { AU.ctx = null; return; }
  }
  S.sound = !S.sound; if (S.sound && AU.ctx.state !== 'running') AU.ctx.resume(); sync();
}
function updateAudio(e) {
  if (!AU.ctx) return; const t = AU.ctx.currentTime;
  AU.osc.frequency.setTargetAtTime(S.f, t, 0.02);
  AU.gain.gain.setTargetAtTime(S.sound ? Math.min(0.35, 0.25 * Math.pow(10, (e.dB - 76) / 20)) : 0, t, S.sound ? 0.05 : 0.04);
}

/* ---------- 이벤트 ---------- */
$('#presets').innerHTML = PRESETS.map((p, i) => `<button class="chip" data-p="${i}" title="${i + 1}"><b>${i + 1}</b>${p.label}</button>`).join('');
$('#presets').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (b) applyPreset(+b.dataset.p); });
$('#f').addEventListener('input', e => { stopPreset(); setS({ f: +e.target.value }); });
$('#d').addEventListener('input', e => { stopPreset(); setS({ d: +e.target.value }); });
document.querySelectorAll('[data-tg]').forEach(b => b.addEventListener('click', () => { const k = b.dataset.tg; if (k === 'on1' || k === 'on2') stopPreset(); setS({ [k]: !S[k] }); }));
document.querySelectorAll('[data-seg]').forEach(sg => sg.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; const k = sg.dataset.seg, v = +b.dataset.v;
  if (k === 'ph2') { stopPreset(); setS({ ph2: v ? Math.PI : 0 }); } else setS({ [k]: v });
}));
$('#playBtn').addEventListener('click', () => setS({ run: !S.run }));
$('#sndBtn').addEventListener('click', toggleSound);
$('#viewBtn').addEventListener('click', () => { S.top = !S.top; if (R3) R3.goView(S.top, false); sync(); });
$('#capBtn').addEventListener('click', () => setS({ cap: !S.cap }));
$('#fsBtn').addEventListener('click', () => {
  try {
    if (document.fullscreenElement) { const p = document.exitFullscreen(); if (p && p.catch) p.catch(() => {}); }
    else { const el = $('#app'), fn = el.requestFullscreen || el.webkitRequestFullscreen; if (fn) { const p = fn.call(el); if (p && p.catch) p.catch(() => {}); } }
  } catch (err) {}
});
document.addEventListener('fullscreenchange', () => { $('#fsBtn').textContent = document.fullscreenElement ? '전체 화면 끝' : '전체 화면'; });
document.addEventListener('keydown', e => {
  // 슬라이더를 만진 뒤에도 단축키가 듣도록 range는 막지 않는다 (글자 입력 칸만 제외)
  if (e.target.matches?.('input:not([type="range"]), textarea, select') || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (e.key === ' ') { e.preventDefault(); setS({ run: !S.run }); }
  else if (/^[1-9]$/.test(e.key) && +e.key <= PRESETS.length) applyPreset(+e.key - 1);
  else if (k === 't') $('#viewBtn').click();
  else if (k === 'f') $('#fsBtn').click();
  else if (k === 'c') $('#capBtn').click();
  else if (k === 's') toggleSound();
});
const reTheme = () => { readTheme(); if (R3) R3.applyTheme(); dirtyGraph = true; lastRO = ''; };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', reTheme);
new MutationObserver(reTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
new ResizeObserver(() => { if (R3) R3.resize(); dirtyGraph = true; }).observe(stage);

/* ---------- 시작 ---------- */
if (R3) { R3.resize(); R3.buildCables(); R3.gen.paint(S.f); }
applyPreset(1);
if (R3) R3.goView(S.top, true);
document.fonts?.ready.then(() => { if (R3) R3.gen.paint(S.f); });
let last = performance.now(), tick = 0;
function loop(now) {
  const raw = Math.min(0.5, (now - last) / 1000), dt = Math.min(0.05, raw); last = now;
  if (S.run) theta += 2 * Math.PI * FD * S.speed * dt;
  if (micTw) {
    micTw.t = Math.min(1, micTw.t + raw / 0.9); const u = micTw.t < 0.5 ? 4 * micTw.t ** 3 : 1 - (-2 * micTw.t + 2) ** 3 / 2;
    S.mic = { x: micTw.from.x + (micTw.to.x - micTw.from.x) * u, z: micTw.from.z + (micTw.to.z - micTw.from.z) * u };
    dirtyGraph = true; if (micTw.t >= 1) micTw = null;
  }
  const e = at(S.mic.x, S.mic.z);
  if (R3) R3.frame(e, raw);
  if ((tick = (tick + 1) % 3) === 0 || micTw) updateReadout(e);
  if (dirtyGraph && S.graph) { drawGraph(); dirtyGraph = false; }
  updateAudio(e);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
