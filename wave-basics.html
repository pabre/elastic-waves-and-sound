<style>
/* TEACHER-DEMO v3 — 교사용 시연 도구

  --grout: #8a6a46;

    --accent: #3fc0b5; --accent-ink: #0d1116; --s1: #3fc6c4; --s2: #f5a04c; --hi: #ff7461; --lo: #5d9cff; --minus: #b08cff;
    --stage: #12171d; --wall: #1a2028; --floor-a: #3b3229; --floor-b: #342c24; --grout: #231d17;
    --paper: #b9bdb5; --paper-line: #8aa89c; --paper-bold: #5d8a79; --skirting: #2b3138;
    --steel: #a3acb5; --paint: #2a3138; --wood: #8a6642; --ribbon: #ff4f57; --tape: #d6b955; --tape-ink: #2a2108; --phone: #0b0e11;

}

  --stage: #12171d; --wall: #1a2028; --floor-a: #3b3229; --floor-b: #342c24; --grout: #231d17;
  --paper: #b9bdb5; --paper-line: #8aa89c; --paper-bold: #5d8a79; --skirting: #2b3138;

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
'use strict';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = s => document.querySelector(s);
const TAU = 2 * Math.PI;

/* ---------- 용수철 (m 단위, x축을 따라 바닥의 모눈종이 위에 놓임) ---------- */
// 금속 슬링키: 200감기, 감기 사이 3 cm(전체 6 m, 화면에는 앞 3 m 정도), 지름 6.8 cm, 납작한 철사(폭 5.2 mm, 두께 2.2 mm)
const N = 200, SP = 0.03, RR = 0.034, BW = 0.0026, BT = 0.0011, PAPER_Y = 0.0008, Y0 = RR + BT + PAPER_Y;
const SEG = 18, RAD = 6, NS = N * SEG + 1;                                  // 감기 하나를 18조각, 철사 단면 6각
const XP = 1.5, IP = Math.round(XP / SP);                                   // 리본을 맨 고리 (150 cm)
const SPEEDS = [0.6, 0.9, 1.2], MEDN = ['부드러운 용수철', '보통 용수철', '단단한 용수철'];   // 매질에 따른 파동의 속력 (m/s)
const XMAX = 3.0;                                                            // 그래프로 보여 줄 구간 0~300 cm
const TAPE_Z = -0.27, HANDLE_X = -0.06;

/* ---------- 상태 ---------- */
const BASE = { dir: 'T', f: 1, mode: 'auto', med: 1, trail: false, arrows: false, dense: false, ruler: false, graph: false };
const S = { ...BASE, run: !reduce, speed: reduce ? 0.25 : 1, cap: true, top: false, preset: 0, shaking: false, sound: false, rulerA: 1.0, rulerB: 1.45, t: 0, t0: 0, pulseT: -1, freezeAt: 0 };

/* ---------- 손이 만든 진동의 기록 → 파동 ---------- */
// x 위치의 변위 s(x, t) = u(t − x/v)  (u: 손잡이 변위의 기록, v: 파동의 속력). 끝에서의 반사는 무시.
const DT = 1 / 240, NB = 8192, buf = new Float32Array(NB);
let bStart = 0, bEnd = -1, phase = 0, stopping = false, handPos = 0, handTarget = 0, dragHand = false, cycles = 0, beatN = 0;
const beats = [];                                                            // 이번 프레임에 손이 끝에 닿은 시각 (메트로놈 박자)
const vel = () => SPEEDS[S.med];
const lam = () => vel() / S.f;
// 횡파: 빨리 흔들수록 손이 작게 움직임 (기울기 ≤ 1), 종파: 고리가 서로 겹치지 않도록 (변형률 ≤ 0.5)
const ampNow = () => S.dir === 'T' ? Math.min(0.10, 0.16 * lam()) : Math.min(0.07, 0.5 * vel() / (TAU * S.f));
function resetWave() { bStart = bEnd + 1; phase = 0; stopping = false; S.pulseT = -1; trailK = 0; }
function srcValue(tau) {
  if (S.mode === 'hand') {                                  // 손으로 끌기: 포인터를 부드럽게 따라감
    handPos += (handTarget - handPos) * (1 - Math.exp(-DT / (dragHand ? 0.035 : 0.12)));
    return handPos;
  }
  if (S.mode === 'pulse') {                                 // 반 파장 펄스 (마루 하나)
    if (S.pulseT < 0) return 0;
    const d = tau - S.pulseT, dur = 1 / (2 * S.f);
    return d >= 0 && d <= dur ? ampNow() * Math.sin(Math.PI * d / dur) : 0;
  }
  if (!S.shaking && !stopping) return 0;
  const prev = phase; phase += TAU * S.f * DT;
  if (Math.floor((phase - Math.PI / 2) / TAU) > Math.floor((prev - Math.PI / 2) / TAU)) beats.push(tau);   // 손이 끝에 닿는 순간 = 박자
  if (Math.floor(phase / TAU) > Math.floor(prev / TAU)) { cycles++; if (stopping) { stopping = false; phase = 0; return 0; } }
  return ampNow() * Math.sin(phase);
}
function writeUntil(t) {
  const iEnd = Math.floor(t / DT);
  if (bEnd < 0) { bEnd = iEnd - 1; bStart = iEnd; }
  for (let i = bEnd + 1; i <= iEnd; i++) buf[((i % NB) + NB) % NB] = srcValue(i * DT);
  bEnd = iEnd; if (bEnd - bStart >= NB - 2) bStart = bEnd - NB + 2;
}
function u(tau) {
  const fi = tau / DT; if (fi < bStart) return 0; if (fi >= bEnd) return buf[((bEnd % NB) + NB) % NB];
  const i = Math.floor(fi), fr = fi - i;
  return buf[((i % NB) + NB) % NB] * (1 - fr) + buf[(((i + 1) % NB) + NB) % NB] * fr;
}
const disp = (x, t = S.t) => u(t - x / vel());

/* ---------- 테마 ---------- */
const T = {};
const TOK = ['surface', 'surface-2', 'ink', 'muted', 'line', 'accent', 's1', 's2', 'hi', 'lo', 'minus', 'stage', 'wall', 'floor-a', 'floor-b', 'grout', 'paper', 'paper-line', 'paper-bold', 'skirting', 'steel', 'paint', 'wood', 'ribbon', 'tape', 'tape-ink', 'phone'];
function readTheme() {
  const cs = getComputedStyle(document.documentElement);
  for (const k of TOK) T[k] = cs.getPropertyValue('--' + k).trim();
  T.font = getComputedStyle(document.body).fontFamily; T.mono = cs.getPropertyValue('--mono').trim();
  const c = T.wall.replace('#', ''), n = parseInt(c.length === 3 ? c.split('').map(h => h + h).join('') : c, 16);
  T.dark = ((n >> 16 & 255) + (n >> 8 & 255) + (n & 255)) / 3 < 110;
}

/* ---------- 3D ---------- */
const V3 = { ok: false, userMoved: false, cam: { t: 1 } };

  { label: '펄스의 속력', cap: '빠르게 흔들어도 느리게 흔들어도 펄스의 속력은 같다', s: { mode: 'pulse', f: 1, ruler: true }, top: false, pulse: true }
];
function applyPreset(i) {
  const p = PRESETS[i]; S.preset = i;
  Object.assign(S, BASE, p.s, { shaking: false, rulerTo: null });
  resetWave();
  if (p.shake) { S.shaking = true; S.t0 = S.t; cycles = 0; beatN = 0; }
  if (p.pulse) sendPulse();
  S.run = true; S.top = !!p.top;
  S.freezeAt = p.rulerFit && !reduce ? 2.5 : 0;            // 파동이 2.5 m까지 퍼지면 영상을 멈추고 자를 마루에 맞춤
  if (p.rulerFit) { S.rulerA = 0.45; S.rulerB = 0.45 + lam(); }
  else { S.rulerA = 1.0; S.rulerB = 1.6; }
  goView(false); sync();
}
const setTxt = (el, s) => { if (el.textContent !== s) el.textContent = s; };
function sync() {
  $('#presets').querySelectorAll('.chip').forEach((b, i) => b.setAttribute('aria-pressed', String(i === S.preset)));
  document.querySelectorAll('[data-tg]').forEach(b => b.setAttribute('aria-pressed', String(!!S[b.dataset.tg])));
  document.querySelectorAll('[data-seg]').forEach(sg => sg.querySelectorAll('button').forEach(b => {
    const k = sg.dataset.seg, v = b.dataset.v;
    b.setAttribute('aria-pressed', String(String(S[k]) === v));
  }));
  setTxt($('#playBtn'), S.run ? '❚❚' : '▶');
  $('#viewBtn').setAttribute('aria-pressed', String(S.top)); setTxt($('#viewBtn'), S.top ? '비스듬히 보기' : '스마트폰 촬영');
  $('#capBtn').setAttribute('aria-pressed', String(S.cap));
  const cap = S.preset >= 0 ? PRESETS[S.preset].cap : '';
  setTxt($('#caption'), cap); $('#caption').hidden = !S.cap || !cap;
  $('#graphCard').hidden = !S.graph;
  setTxt($('#graphNote'), S.dir === 'L' ? '종파: 세로축 = 앞뒤 변위' : '세로축 = 좌우 변위');
  $('#recBadge').hidden = !S.top;
  $('#sndBtn').setAttribute('aria-pressed', String(S.sound));
  const sb = $('#shakeBtn'); sb.hidden = S.mode === 'hand';
  setTxt(sb, S.mode === 'pulse' ? '펄스 보내기' : S.shaking ? '멈추기' : '흔들기');
  setTxt($('#timenote'), !S.run ? '일시정지 — 영상 멈춤' : S.speed === 1 ? '실제 빠르기' : S.speed === 0.5 ? '실제보다 2배 느림' : '실제보다 4배 느림');
}
let lastRO = '';
function updateReadout() {
  const v = vel(), L = lam(), rows = [];
  const hand = S.mode === 'hand';
  rows.push(`<div class="ro"><span>${MEDN[S.med]}</span><b>${S.dir === 'T' ? '횡파' : '종파'}</b></div>`);
  rows.push(`<div class="ro s2"><span>진동수 f</span><b>${hand ? '—' : S.f + ' Hz'}</b></div>`);
  rows.push(`<div class="ro ro-opt"><span>주기 T = 1/f</span><b>${hand ? '—' : (1 / S.f).toFixed(2) + ' s'}</b></div>`);
  rows.push(`<div class="ro s1"><span>파장 λ</span><b>${hand ? '—' : Math.round(L * 100) + ' cm'}</b></div>`);
  if (S.ruler) rows.push(`<div class="ro ro-opt"><span>자로 잰 길이</span><b>${Math.round(Math.abs(S.rulerB - S.rulerA) * 100)} cm</b></div>`);
  rows.push('<div class="ro-sep"></div>');
  const pk = pulsePeak();
  if (S.mode === 'pulse' && pk !== null) {
    const tt = S.t - S.pulseT - 1 / (4 * S.f);
    rows.push(`<div class="ro ro-opt"><span>펄스 위치 x</span><b>${Math.round(pk * 100)} cm</b></div><div class="ro ro-opt"><span>걸린 시간 t</span><b>${tt.toFixed(2)} s</b></div>`);
    rows.push(`<div class="ro-db"><b>${Math.round(v * 100)}</b><small>cm/s</small><span class="what">속력 x/t</span></div>`);
  } else {
    rows.push(`<div class="ro-db"><b>${Math.round(v * 100)}</b><small>cm/s</small><span class="what">파동의 속력</span></div>`);
    rows.push(`<div class="ro-sub">${hand ? 'v는 용수철이 정한다' : `v = fλ = ${S.f} × ${Math.round(L * 100)}`}</div>`);
  }
  const html = rows.join('');
  if (html !== lastRO) { $('#readout').innerHTML = html; lastRO = html; }
  const tt = Math.max(0, S.t - S.t0), mm = Math.floor(tt / 60), ss = tt - mm * 60;
  setTxt($('#recTime'), `${String(mm).padStart(2, '0')}:${ss.toFixed(2).padStart(5, '0')}`);
  $('#recBadge').classList.toggle('paused', !S.run);
}

/* ---------- 메트로놈 소리 (버튼을 누를 때만 시작): 나무토막 '똑', 4박마다 첫 박 강세 ---------- */
const AU = { ctx: null };
function toggleSound() {
  if (!AU.ctx) {
    try {
      AU.ctx = new (window.AudioContext || window.webkitAudioContext)();
      AU.out = AU.ctx.createGain(); AU.out.gain.value = 0.6; AU.out.connect(AU.ctx.destination);
      const nb = AU.ctx.createBuffer(1, Math.round(AU.ctx.sampleRate * 0.03), AU.ctx.sampleRate), d = nb.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (AU.ctx.sampleRate * 0.004));
      AU.noise = nb;
    } catch (err) { AU.ctx = null; return; }
  }
  S.sound = !S.sound;
  if (S.sound) { AU.ctx.resume().catch(() => {}); woodblock(true, AU.ctx.currentTime + 0.03); }
  sync();
}
function woodblock(accent, when) {
  const c = AU.ctx, t = Math.max(c.currentTime + 0.005, when), f0 = accent ? 1180 : 880, lv = accent ? 0.5 : 0.32;
  for (const [mul, amp, dec] of [[1, 1, 0.05], [2.6, 0.42, 0.028], [4.3, 0.16, 0.018]]) {   // 나무토막의 세 고유 진동
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(f0 * mul * 1.03, t); o.frequency.exponentialRampToValueAtTime(f0 * mul, t + 0.015);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(amp * lv, t + 0.0012); g.gain.exponentialRampToValueAtTime(0.0003, t + dec * 4);
    o.connect(g).connect(AU.out); o.start(t); o.stop(t + dec * 4 + 0.02);
  }
  const n = c.createBufferSource(), bp = c.createBiquadFilter(), g = c.createGain();   // 두드리는 순간의 짧은 잡음
  n.buffer = AU.noise; bp.type = 'bandpass'; bp.frequency.value = f0 * 2.4; bp.Q.value = 1.4; g.gain.value = lv * 0.9;
  n.connect(bp).connect(g).connect(AU.out); n.start(t);
}
function beat(tb) {
  const accent = beatN % 4 === 0; beatN++;
  if (!AU.ctx || !S.sound) return;
  woodblock(accent, AU.ctx.currentTime + 0.03 + (tb - S.t) / S.speed);   // 박자의 실제 시각에 맞춰 예약 (프레임 지터 없음)
}

/* ---------- 이벤트 ---------- */
$('#presets').innerHTML = PRESETS.map((p, i) => `<button class="chip" data-p="${i}" title="${i + 1}"><b>${i + 1}</b>${p.label}</button>`).join('');
$('#presets').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (b) applyPreset(+b.dataset.p); });
document.querySelectorAll('[data-tg]').forEach(b => b.addEventListener('click', () => { const k = b.dataset.tg; setS({ [k]: !S[k] }); if (k === 'trail') trailK = 0; if (k === 'ruler' && S.ruler && !S.run) snapRuler(); if (k === 'graph' && !S.top && !V3.userMoved) goView(false); }));
document.querySelectorAll('[data-seg]').forEach(sg => sg.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; const k = sg.dataset.seg, raw = b.dataset.v;
  const v = k === 'f' || k === 'med' || k === 'speed' ? +raw : raw;
  if (k === 'speed') { S.speed = v; sync(); return; }
  S.freezeAt = 0;
  setS({ [k]: v });
}));
$('#playBtn').addEventListener('click', () => { S.freezeAt = 0; setS({ run: !S.run }); });
$('#shakeBtn').addEventListener('click', () => { S.freezeAt = 0; startShake(); });
$('#sndBtn').addEventListener('click', toggleSound);
$('#viewBtn').addEventListener('click', () => { S.top = !S.top; goView(false); sync(); });
$('#capBtn').addEventListener('click', () => setS({ cap: !S.cap }));
$('#fsBtn').addEventListener('click', () => {
  const el = $('#app');
  try { if (document.fullscreenElement) document.exitFullscreen?.()?.catch?.(() => {}); else el.requestFullscreen?.()?.catch?.(() => {}); } catch (err) {}
});
document.addEventListener('fullscreenchange', () => { setTxt($('#fsBtn'), document.fullscreenElement ? '창 모드' : '전체 화면'); });
document.addEventListener('keydown', e => {
  if (e.target.matches?.('input, textarea, select') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === ' ') { e.preventDefault(); S.freezeAt = 0; setS({ run: !S.run }); }
  else if (/^[1-9]$/.test(e.key) && +e.key <= PRESETS.length) applyPreset(+e.key - 1);
  else if (e.key === 't' || e.key === 'T') $('#viewBtn').click();
  else if (e.key === 'f' || e.key === 'F') $('#fsBtn').click();
});
// 손잡이 끌기, 자 끝 끌기
const gl = $('#gl');
let drag = null;
gl.addEventListener('pointerdown', e => {
  if (!V3.ok) return;
  const ray = setRay(e);
  if (S.ruler) { const hit = ray.intersectObjects([V3.tipA, V3.tipB, V3.lineA, V3.lineB]); if (hit.length) { drag = hit[0].object === V3.tipA || hit[0].object === V3.lineA ? 'A' : 'B'; S.rulerTo = null; } }
  if (!drag && ray.intersectObject(V3.handle, true).length) { drag = 'hand'; S.freezeAt = 0; if (S.mode !== 'hand') setS({ mode: 'hand' }); dragHand = true; if (!S.run) setS({ run: true }); }
  if (drag) { V3.controls.enabled = false; gl.setPointerCapture(e.pointerId); e.preventDefault(); e.stopImmediatePropagation(); }
}, { capture: true });
gl.addEventListener('pointermove', e => {
  if (!V3.ok) return;
  const ray = setRay(e), hit = new THREE.Vector3();
  if (drag === 'A' || drag === 'B') {
    if (ray.ray.intersectPlane(V3.floorPlane, hit)) { const x = Math.round(Math.max(0, Math.min(3.2, hit.x)) * 100) / 100; if (drag === 'A') S.rulerA = x; else S.rulerB = x; }
  } else if (drag === 'hand') {
    if (ray.ray.intersectPlane(V3.handPlane, hit)) handTarget = S.dir === 'T' ? Math.max(-0.15, Math.min(0.15, hit.z)) : Math.max(-0.06, Math.min(0.06, hit.x - HANDLE_X));
  } else if (e.buttons === 0) {
    const over = (S.ruler && ray.intersectObjects([V3.tipA, V3.tipB, V3.lineA, V3.lineB]).length) ? 'ew-resize' : ray.intersectObject(V3.handle, true).length ? 'grab' : 'default';
    gl.style.cursor = over;
  }
});
const endDrag = () => { if (drag === 'hand') { dragHand = false; handTarget = 0; } drag = null; if (V3.ok) V3.controls.enabled = true; };
gl.addEventListener('pointerup', endDrag); gl.addEventListener('pointercancel', endDrag);
const reTheme = () => { readTheme(); theme3D(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', reTheme);
new MutationObserver(reTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
new ResizeObserver(() => size3D()).observe($('#stage'));

/* ---------- 시작 ---------- */
readTheme();
try { initThree(); size3D(); }
catch (err) { V3.ok = false; $('#nogl').hidden = false; gl.hidden = true; }
applyPreset(0); goView(true);
function advance(dt) {
  if (!S.run) return;
  S.t += dt * S.speed; writeUntil(S.t);
  for (const tb of beats) beat(tb);
  beats.length = 0;
  if (S.freezeAt > 0 && S.shaking && vel() * (S.t - S.t0) >= S.freezeAt) { S.freezeAt = 0; setS({ run: false }); }
}
let last = performance.now(), fr = 0;
function loop(now) {
  const raw = Math.min(0.5, (now - last) / 1000); last = now;
  advance(Math.min(0.1, raw));
  update3D(raw);
  if (S.graph) drawGraph();
  if ((fr = (fr + 1) % 3) === 0) updateReadout();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
