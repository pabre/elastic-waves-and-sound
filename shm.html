<style>
/* TEACHER-DEMO v3 — 교사용 시연 도구

:root {
  --bg: #e9edf1;
  --surface: #ffffff;
  --surface-2: #f3f5f8;
  --ink: #141c25;
  --muted: #5a6573;
  --line: #d3dae2;
  --accent: #0b6b70;
  --accent-ink: #ffffff;
  --s1: #0a7f86;
  --s2: #d06a14;
  --hi: #e2553f;
  --minus: #6a3fd6;
  --stage: #dfe5ea;
  --wall: #e8ebe6;
  --tile-line: #d6dad2;
  --wood: #c49a6c;
  --wood-dark: #9a6f45;
  --screen: #f7f7f3;
  --steel: #b8c0c8;
  --paint: #3a434d;
  --brass: #c9a24f;
  --disc: #eef1f4;
  --peg: #d2453b;
  --lampbody: #2f353c;
  --glow: #ffe6a0;
  --tape: #f1d36b;
  --tape-ink: #3f320c;
  --ray: #e39a17;
  --shade: #0b0f14;
  --spring-b: #5d6873;
  --floor: #b9b4aa;

  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {

    --accent: #3fc0b5; --accent-ink: #0d1116; --s1: #3fc6c4; --s2: #f5a04c; --hi: #ff7461; --minus: #b08cff;
    --stage: #12171d; --wall: #1a2028; --tile-line: #212932; --wood: #7a5a3a; --wood-dark: #573e27; --screen: #d6d9dc; --steel: #9aa3ac;
    --paint: #2a3138; --brass: #b08d45; --disc: #cfd4d9; --peg: #e0574c; --lampbody: #22282e; --glow: #ffe0a0; --tape: #d6b955; --tape-ink: #2a2108;
    --ray: #ffbf4a; --shade: #000000; --spring-b: #6d7883; --floor: #2a2723;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1116; --surface: #161c23; --surface-2: #1d252e; --ink: #e6ebf0; --muted: #98a4b0; --line: #2b3540;
  --accent: #3fc0b5; --accent-ink: #0d1116; --s1: #3fc6c4; --s2: #f5a04c; --hi: #ff7461; --minus: #b08cff;
  --stage: #12171d; --wall: #1a2028; --tile-line: #212932; --wood: #7a5a3a; --wood-dark: #573e27; --screen: #d6d9dc; --steel: #9aa3ac;
  --paint: #2a3138; --brass: #b08d45; --disc: #cfd4d9; --peg: #e0574c; --lampbody: #22282e; --glow: #ffe0a0; --tape: #d6b955; --tape-ink: #2a2108;
  --ray: #ffbf4a; --shade: #000000; --spring-b: #6d7883; --floor: #2a2723;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  min-height: 100vh; display: flex; flex-direction: column; gap: 10px;
  padding-block: 10px 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bg);
}
.app:fullscreen { padding-block: 12px; }

.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.tag { font: 500 12px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 520px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px 4px 4px; cursor: pointer; font-size: 13.5px; font-weight: 500; white-space: nowrap; transition: background .15s, border-color .15s; }
.chip b { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font: 600 12px var(--mono); }
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.chip[aria-pressed="true"] b { background: var(--accent); color: var(--accent-ink); }
.tools { display: flex; gap: 6px; margin-left: auto; }
.tbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 6px 12px; cursor: pointer; font-size: 14px; font-weight: 500; white-space: nowrap; }
.tbtn:hover { border-color: var(--muted); }
.tbtn[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

/* 무대 */
.stage { position: relative; flex: 1 1 auto; height: clamp(420px, calc(100vh - 200px), 1100px); border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: var(--stage); }
.app:fullscreen .stage { height: auto; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.glass { background: color-mix(in srgb, var(--surface) 86%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border: 1px solid color-mix(in srgb, var(--line) 85%, transparent); border-radius: 14px; box-shadow: 0 8px 28px rgb(10 20 30 / .10); }
.readout { position: absolute; top: 12px; right: 12px; width: 236px; padding: 12px 14px; display: flex; flex-direction: column; gap: 3px; }

.ro b { font: 500 18px var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ro.s1 span, .ro.s1 b { color: var(--s1); } .ro.s2 span, .ro.s2 b { color: var(--s2); } .ro.hi span, .ro.hi b { color: var(--hi); }

.mini { border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); border-radius: 6px; padding: 0 7px; font-size: 12px; line-height: 20px; cursor: pointer; }
.mini[aria-pressed="true"] { color: var(--ink); border-color: var(--muted); }
.watch-time { display: flex; align-items: baseline; gap: 6px; }
.watch-time b { font: 600 40px var(--mono); line-height: 1; font-variant-numeric: tabular-nums; }
.watch-time small { color: var(--muted); font-size: 14px; }
.watch-btns { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 5px; }
.wtable { width: 100%; border-collapse: collapse; font: 13px var(--mono); font-variant-numeric: tabular-nums; }
.wtable th { font: 500 11.5px var(--font); color: var(--muted); text-align: right; padding: 1px 3px; white-space: nowrap; }
.wtable td { text-align: right; padding: 3px 3px; border-top: 1px solid var(--line); white-space: nowrap; }
.wtable th:first-child, .wtable td:first-child { text-align: left; }
@media (min-width: 900px) and (min-height: 560px) {
  html, body { height: 100%; }

}
/* wrap-reverse에서는 교차축이 뒤집히므로 flex-start = 아래쪽 맞춤 */
.bottom { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; flex-wrap: wrap-reverse; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none; }
.bottom > * { pointer-events: auto; }
.caption { padding: 9px 16px; font-size: 18px; font-weight: 500; max-width: 720px; text-wrap: balance; }
.graph-card { width: min(470px, 100%); padding: 8px 10px 4px; margin-left: auto; }
.graph-card .gt { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); padding: 0 2px 2px; }

.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl { position: absolute; left: 0; top: 0; white-space: nowrap; font-weight: 700; font-size: 16px; padding: 2px 10px; border-radius: 999px; background: color-mix(in srgb, var(--surface) 90%, transparent); box-shadow: 0 2px 8px rgb(0 0 0 / .12); color: var(--ink); }
.lbl.muted { color: var(--muted); font-weight: 500; font-size: 15px; } .lbl.s1 { color: var(--s1); } .lbl.s2 { color: var(--s2); } .lbl.hi { color: var(--hi); }
.lbl.accent { color: var(--accent); font-size: 16px; } .lbl.minus { color: var(--minus); font-size: 15px; } .lbl.vec { font: italic 700 21px var(--font); padding: 0 10px; }
.lbl.ray { color: var(--ray); }
.nogl { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); font-size: 16px; }

/* 조작 독 */
.dock { display: flex; flex-wrap: wrap; gap: 8px; }
.dg { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 7px 12px; display: flex; align-items: center; gap: 10px; min-width: 0; flex-wrap: wrap; }
.dg > span { font-size: 12px; color: var(--muted); white-space: nowrap; }
.seg { display: flex; gap: 3px; background: var(--surface-2); border-radius: 9px; padding: 3px; }
.seg button, .tg { border: 0; background: transparent; border-radius: 7px; padding: 5px 10px; cursor: pointer; font-size: 14px; font-weight: 500; white-space: nowrap; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / .14); }
.seg.num button { font-family: var(--mono); }
.tgs { display: flex; flex-wrap: wrap; gap: 4px; }
.tg { border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }
.tg[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.tg .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.pbtn { border: 0; border-radius: 9px; padding: 7px 14px; font-weight: 700; cursor: pointer; background: var(--accent); color: var(--accent-ink); white-space: nowrap; }
.pbtn.alt { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
.pbtn.stop { background: var(--hi); color: var(--accent-ink); border: 0; }
.seg button:disabled { opacity: .35; cursor: not-allowed; }

@media (max-width: 720px) {
  h1 { font-size: 18px; }
  .readout { width: 150px; padding: 8px 10px; }
  .ro-opt { display: none !important; }
  .ro b, .ro.big b { font-size: 15px; } .ro-db b { font-size: 28px; } .ro-db .what { display: none; }
  .caption { font-size: 15px; }
  .graph-card { display: none; }
  .stage { height: clamp(380px, 62vh, 700px); }
  .playbar .seg, .timenote { display: none; }
  .watch { top: auto; bottom: 12px; width: 164px; padding: 8px 10px; }
  .watch .wtable, #swAuto, #swSnd { display: none; }
  .watch-time b { font-size: 28px; }
  .watch-btns { grid-template-columns: 1fr 1fr; }
  .stage.watching .bottom { left: 186px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
(() => {
'use strict';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = s => document.querySelector(s);
const TAU = 2 * Math.PI, G = 9.8;

/* ---------- 장치 치수 (m, y가 위쪽) ---------- */
const HOOK_Y = 1.0, L0 = 0.14, LMIN = 0.095, SXW = -0.30, ROD_X = -0.54, RZ = -0.026, RXW = -0.17, FEET = 0.006, BASE_TOP = 0.036, ZS = -0.34, WXW = 0.27, TW = 4;
const HANG = 0.03, PLATE = 0.005, DISC = 0.0075, MR = 0.025;           // 추걸이 막대, 받침판, 100 g 홈추(지름 5 cm, 두께 7.5 mm), 홈추 반지름
const ANCH_Y = BASE_TOP + 0.024;                                        // 아래 용수철을 거는 받침판 고리
const LDN = Math.hypot(0.35, 1), LD = [-0.35 / LDN, 0, -1 / LDN];       // 램프의 평행 광선 방향 (y 성분 0 → 그림자 높이 = 물체 높이)
const LAMP_D = 1.15, MIDX = (SXW + WXW) / 2;                            // 램프는 용수철과 원판 사이 한가운데를 겨눔
const LAMP = [MIDX - LD[0] * LAMP_D, 0.55, -LD[2] * LAMP_D];
const LENS_R = 0.067, BEAM0 = 0.075, BEAM_K = 0.215;                    // 빛줄기 반지름 = BEAM0 + BEAM_K × 거리
const SPR = { 16: { coils: 26, R: 0.0165, r: 0.0013 }, 64: { coils: 16, R: 0.016, r: 0.0021 } };   // 단단한 용수철일수록 굵은 철사

/* ---------- 상태 ---------- */
const S = {
  k: 16, m: 0.4, two: false, A: 0, side: -1, start: 'end', released: false, hold: null, t: 0, paused: false,
  speed: reduce ? 0.25 : 1, circle: false, strobe: false, arrows: false, graphs: false, watch: false,
  preset: 0, cam: 'close', front: false, cap: true, ro: [], big: 'T', natural: false
};
let hist = [];
const rec = [];

/* ---------- 물리 ---------- */
const keff = () => S.k * (S.two ? 2 : 1);
const omega = () => Math.sqrt(keff() / S.m);
const period = () => TAU / omega();                                    // T = 2π/ω = 2π√(m/k)
const stretch = () => S.m * G / S.k;                                    // 용수철 1개: 평형까지 늘어난 길이 mg/k
const nDisc = () => Math.max(1, Math.round(S.m / 0.1));
const stackH = () => PLATE + nDisc() * DISC;
const hangH = () => HANG + stackH();                                    // 용수철 끝 ~ 받침판 아래
function lensEq() {                                                     // 평형에서 위·아래 용수철 길이
  if (!S.two) return { top: L0 + stretch(), bot: 0 };
  const sum = HOOK_Y - ANCH_Y - hangH(), top = (sum + stretch()) / 2;   // 같은 용수철 2개: k(L위−L0) − k(L아래−L0) = mg
  return { top, bot: sum - top };
}
const attachEq = () => HOOK_Y - lensEq().top;

/* ---------- 그래프 (카메라가 기록한 운동) ---------- */
const gcv = $('#graph'), gctx = gcv.getContext('2d');
function drawGraph() {
  const r = gcv.getBoundingClientRect(); if (!r.width) return;
  const dpr = Math.min(2, devicePixelRatio || 1), w = r.width, h = r.height;
  if (gcv.width !== Math.round(w * dpr) || gcv.height !== Math.round(h * dpr)) { gcv.width = Math.round(w * dpr); gcv.height = Math.round(h * dpr); }
  const ctx = gctx; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
  const Lp = 56, Rp = 6, Bp = 20, A0 = Math.max(S.A, 0.05), wv = omega();
  const defs = [
    { key: 'x', name: 'x', unit: 'cm', col: T.s1, k: 100, max: niceMax(A0 * 100 * 1.05) },
    { key: 'v', name: 'v', unit: 'm/s', col: T.s2, k: 1, max: niceMax(A0 * wv * 1.02) },
    { key: 'a', name: 'a', unit: 'm/s²', col: T.hi, k: 1, max: niceMax(A0 * wv * wv * 1.02) }
  ];
  const rh = (h - Bp) / 3, pw = w - Lp - Rp;
  const tNow = hist.length ? hist[hist.length - 1].t : 0, t1 = Math.max(TW, tNow), t0 = t1 - TW;
  const X = tau => Lp + (tau - t0) / TW * pw;
  ctx.font = `12px ${T.mono}`; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (let s = Math.ceil(t0 * 2) / 2; s <= t1 + 1e-9; s += 0.5) {
    const xx = X(s); ctx.strokeStyle = T.line; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(xx, 2); ctx.lineTo(xx, h - Bp); ctx.stroke();
    if (Math.abs(s - Math.round(s)) < 1e-6) { ctx.fillStyle = T.muted; ctx.fillText(String(Math.round(s)), xx, h - Bp + 4); }
  }
  const pts = hist.filter(p => p.t >= t0);
  defs.forEach((d, i) => {
    const top = i * rh + 4, bot = (i + 1) * rh - 4, mid = (top + bot) / 2, half = (bot - top) / 2;
    const Yv = v => mid - v * d.k / d.max * half;
    ctx.strokeStyle = T.muted; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(Lp, mid); ctx.lineTo(w - Rp, mid); ctx.stroke();
    ctx.fillStyle = d.col; ctx.font = `italic 700 21px ${T.font}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(d.name, 2, mid - 7);
    ctx.fillStyle = T.muted; ctx.font = `12px ${T.font}`; ctx.fillText(d.unit, 2, mid + 12);
    ctx.font = `11.5px ${T.mono}`; ctx.textAlign = 'right';

    pts.forEach((p, j) => { const xx = X(p.t), yy = Yv(p[d.key]); j ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); });

    if (d.key === 'x' && S.A > 0) {                     // 주기 T 표시

        ctx.font = `italic 700 14px ${T.font}`; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillStyle = T.ink;

  if (!pts.length) { ctx.fillStyle = T.muted; ctx.font = `14px ${T.font}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('추를 놓으면 기록됩니다', Lp + pw / 2, rh * 1.5); }
}

}

    const t = c.currentTime + 0.012 + i * 0.12, o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();

}

}

  if (S.hold !== null) { release(S.hold); return; }
  if (!S.released) { pullCm(10); return; }
  S.paused = !S.paused; sync();
}
$('#playBtn').addEventListener('click', togglePlay);
document.querySelectorAll('[data-seg="speed"]').forEach(sg => sg.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { S.speed = +b.dataset.v; sync(); } }));
$('#pullSeg').addEventListener('click', e => { const b = e.target.closest('[data-pull]'); if (b && !b.disabled) pullCm(+b.dataset.pull); });
$('#kSeg').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b && +b.dataset.k !== S.k) setApparatus({ k: +b.dataset.k }); });
$('#mSeg').addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (b && +b.dataset.m !== S.m) setApparatus({ m: +b.dataset.m }); });
$('#twoSeg').addEventListener('click', e => { const b = e.target.closest('[data-two]'); if (b && (b.dataset.two === '1') !== S.two) setApparatus({ two: b.dataset.two === '1' }); });
document.querySelectorAll('[data-tg]').forEach(b => b.addEventListener('click', () => { const k = b.dataset.tg; S[k] = !S[k]; sync(); }));
$('#viewBtn').addEventListener('click', () => { S.front = !S.front; goView(false); sync(); });
$('#capBtn').addEventListener('click', () => { S.cap = !S.cap; sync(); });
$('#fsBtn').addEventListener('click', () => {
  const el = $('#app');
  try { if (document.fullscreenElement) document.exitFullscreen?.()?.catch?.(() => {}); else el.requestFullscreen?.()?.catch?.(() => {}); } catch (err) {}
});
document.addEventListener('fullscreenchange', () => txt($('#fsBtn'), document.fullscreenElement ? '창 모드' : '전체 화면'));
$('#swStart').addEventListener('click', () => {
  if (AU.on) audio();
  if (!S.released) pullCm(10);
  if (SW.run) { SW.run = false; SW.auto = false; beep(1); if (SW.laps >= 0.5) swRecord(Math.max(1, Math.round(SW.laps)), SW.el); }
  else { SW.el = 0; SW.laps = 0; SW.th = stateAt(S.t).th; SW.run = true; S.paused = false; beep(1); }
  sync();
});
$('#swAuto').addEventListener('click', () => {
  if (AU.on) audio();
  if (!S.released) pullCm(10);
  SW.el = 0; SW.laps = 0; SW.th = stateAt(S.t).th; SW.run = true; SW.auto = true; S.paused = false; beep(1); sync();
});
$('#swReset').addEventListener('click', () => { swReset(); rec.length = 0; sync(); });
$('#swSnd').addEventListener('click', () => { AU.on = !AU.on; if (AU.on) { audio(); beep(1); } sync(); });
document.addEventListener('keydown', e => {
  if (e.target.matches?.('input, textarea, select') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target === $('#gl') && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    e.preventDefault();
    const lim = pullLimits(), x0 = S.hold !== null ? S.hold : 0; S.released = false; swReset(); hist = [];
    S.hold = Math.max(-lim.down, Math.min(lim.up, Math.round((x0 + (e.key === 'ArrowDown' ? -0.01 : 0.01)) * 100) / 100)); sync(); return;
  }
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  else if (/^[1-9]$/.test(e.key) && +e.key <= PRESETS.length) applyPreset(+e.key - 1);
  else if (e.key === 't' || e.key === 'T') $('#viewBtn').click();
  else if (e.key === 'f' || e.key === 'F') $('#fsBtn').click();
});

// 추를 직접 끌어서 당기기 (광선 추적)
const gl = $('#gl');
let dragging = false, grabDy = 0;
function hitWeight(e) { const rc = pick(e); return rc && rc.intersectObject(V3.weight, true).length ? rc : null; }
gl.addEventListener('pointerdown', e => {
  const rc = hitWeight(e); if (!rc) return;
  const y = planeY(rc); if (y === null) return;
  dragging = true; V3.controls.enabled = false; gl.setPointerCapture(e.pointerId);
  const x0 = current().x; grabDy = y - (attachEq() + x0);
  S.hold = Math.round(x0 * 100) / 100; S.released = false; swReset(); hist = [];
  gl.style.cursor = 'grabbing'; e.preventDefault(); e.stopImmediatePropagation(); sync();
}, { capture: true });
gl.addEventListener('pointermove', e => {
  if (!V3.ok) return;
  if (dragging) {
    const y = planeY(pick(e)); if (y === null) return;
    const lim = pullLimits(), x = y - grabDy - attachEq();
    S.hold = Math.round(Math.max(-lim.down, Math.min(lim.up, x)) * 100) / 100; return;
  }
  if (e.buttons === 0) gl.style.cursor = hitWeight(e) ? 'grab' : 'move';
});
function endDrag() { if (!dragging) return; dragging = false; V3.controls.enabled = true; gl.style.cursor = 'grab'; release(S.hold ?? 0); }
gl.addEventListener('pointerup', endDrag);
gl.addEventListener('pointercancel', endDrag);
const reTheme = () => { readTheme(); theme3D(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', reTheme);
new MutationObserver(reTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
new ResizeObserver(() => size3D()).observe($('#stage'));

/* ---------- 시작 ---------- */
readTheme();
try { initThree(); size3D(); }
catch (err) { V3.ok = false; $('#nogl').hidden = false; gl.hidden = true; }
applyPreset(0, true);
function advance(dt) {
  if (!(S.released && S.hold === null && !S.paused)) return;
  const ds = dt * S.speed; S.t += ds;
  const s = stateAt(S.t); hist.push({ t: S.t, x: s.x, v: s.v, a: s.a });
  while (hist.length && hist[0].t < S.t - TW - 0.2) hist.shift();
  if (SW.run) {
    SW.el += ds; SW.laps = (s.th - SW.th) / TAU;
    if (SW.auto && SW.laps >= 10) { SW.el = 10 * period(); SW.laps = 10; SW.run = false; SW.auto = false; swRecord(10, SW.el); beep(2); }
  }
}
let last = performance.now(), tick = 0;
function loop(now) {
  const raw = Math.min(0.5, (now - last) / 1000); last = now;
  advance(Math.min(0.1, raw));
  const cur = current();
  update3D(cur, raw);
  if (S.graphs) drawGraph();
  if ((tick = (tick + 1) % 4) === 0) { paintReadout(cur); swPaint(); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
