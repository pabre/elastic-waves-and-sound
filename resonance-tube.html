<title>공기 기둥 공명 실험</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* TEACHER-DEMO v3 — 교사용 시연 도구
   Layout: 얇은 상단 바(수업 순서 장면 칩) / 화면을 채우는 무대(옆에서 본 공명 장치 + 깊이를 맞춘 소리 크기 그래프) + 유리 카드 측정값 / 아래 조작 독 */
:root {
  --bg: #e9edf1;
  --surface: #ffffff;
  --surface-2: #f3f5f8;
  --ink: #141c25;
  --muted: #5a6573;
  --line: #d3dae2;
  --accent: #0b6b70;
  --accent-ink: #ffffff;
  --s1: #0a7f86;
  --s2: #d06a14;
  --hi: #e2553f;
  --lo: #2c6fd4;
  --heat: #f0a20f;
  --nodal: #6a3fd6;
  --anti: #17955a;
  --stage: #dfe5ea;
  --shadow: #0d1620;
  --wall-1: #eef1f3;
  --wall-2: #d6dce2;
  --wood-1: #d9b582;
  --wood-2: #b08048;
  --wood-grain: #7d5329;
  --stand-1: #4a5560;
  --stand-2: #1f262d;
  --metal-hi: #f6f8fa;
  --metal-lo: #8b95a0;
  --glass: #cfe6ee;
  --glass-hi: #ffffff;
  --glass-edge: #5f90a3;
  --water-1: #a3d0f0;
  --water-2: #2f7cbc;
  --rubber-1: #b7553d;
  --rubber-2: #5e2216;
  --cork: #c8a073;
  --band: #f0a21a;
  --phone: #1b2127;
  --phone-edge: #6d7782;
  --screen-1: #fbfcfd;
  --screen-2: #e9eef3;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1116; --surface: #161c23; --surface-2: #1d252e; --ink: #e6ebf0; --muted: #98a4b0; --line: #2b3540;
    --accent: #3fc0b5; --accent-ink: #0d1116; --s1: #3fc6c4; --s2: #f5a04c;
    --hi: #ff7461; --lo: #5d9cff; --heat: #ffbb33; --nodal: #b08cff; --anti: #4fd389; --stage: #12171d;
    --shadow: #000000; --wall-1: #1c232a; --wall-2: #11161b; --wood-1: #8a6a43; --wood-2: #5a4025; --wood-grain: #2f1d0d;
    --stand-1: #59646f; --stand-2: #1b2127; --metal-hi: #e3e8ec; --metal-lo: #5f6973;
    --glass: #2c4a56; --glass-hi: #d8eef6; --glass-edge: #74a8bb; --water-1: #4a8fc8; --water-2: #17436c;
    --rubber-1: #9e4a36; --rubber-2: #43160d; --cork: #8f714e; --band: #d99a2b;
    --phone: #05080b; --phone-edge: #4c5560; --screen-1: #1d252e; --screen-2: #141a20;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1116; --surface: #161c23; --surface-2: #1d252e; --ink: #e6ebf0; --muted: #98a4b0; --line: #2b3540;
  --accent: #3fc0b5; --accent-ink: #0d1116; --s1: #3fc6c4; --s2: #f5a04c;
  --hi: #ff7461; --lo: #5d9cff; --heat: #ffbb33; --nodal: #b08cff; --anti: #4fd389; --stage: #12171d;
  --shadow: #000000; --wall-1: #1c232a; --wall-2: #11161b; --wood-1: #8a6a43; --wood-2: #5a4025; --wood-grain: #2f1d0d;
  --stand-1: #59646f; --stand-2: #1b2127; --metal-hi: #e3e8ec; --metal-lo: #5f6973;
  --glass: #2c4a56; --glass-hi: #d8eef6; --glass-edge: #74a8bb; --water-1: #4a8fc8; --water-2: #17436c;
  --rubber-1: #9e4a36; --rubber-2: #43160d; --cork: #8f714e; --band: #d99a2b;

}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  min-height: 100vh; display: flex; flex-direction: column; gap: 10px;
  padding-block: 10px 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bg);
}
.app:fullscreen { padding-block: 12px; }

/* 상단 바 */
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.tag { font: 500 12px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 520px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px 4px 4px; cursor: pointer; font-size: 13.5px; font-weight: 500; white-space: nowrap; transition: background .15s, border-color .15s; }
.chip b { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font: 600 12px var(--mono); }
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.chip[aria-pressed="true"] b { background: var(--accent); color: var(--accent-ink); }
.tools { display: flex; gap: 6px; margin-left: auto; }
.tbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 6px 12px; cursor: pointer; font-size: 14px; font-weight: 500; white-space: nowrap; }
.tbtn:hover { border-color: var(--muted); }
.tbtn[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

/* 무대 */
.stage { position: relative; flex: 1 1 auto; height: clamp(420px, calc(100vh - 200px), 1100px); border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: var(--stage); }
.app:fullscreen .stage { height: auto; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.glass { background: color-mix(in srgb, var(--surface) 86%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border: 1px solid color-mix(in srgb, var(--line) 85%, transparent); border-radius: 14px; box-shadow: 0 8px 28px color-mix(in srgb, var(--shadow) 10%, transparent); }
.readout { position: absolute; top: 12px; right: 12px; width: 236px; padding: 12px 14px 12px; display: flex; flex-direction: column; gap: 3px; }
.ro { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 13px; color: var(--muted); }
.ro b { font: 500 18px var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ro.y span { color: var(--s2); font-weight: 700; }
.ro.v b { font-size: 24px; font-weight: 600; }
.ro.e span { color: var(--hi); font-weight: 700; }
.ro-sub { text-align: right; font: 500 13px var(--mono); color: var(--muted); margin-top: -2px; white-space: nowrap; }
.ro-sep { height: 1px; background: var(--line); margin: 6px 0; }
.ro-db { display: flex; align-items: baseline; gap: 6px; }
.ro-db b { font: 600 38px var(--mono); line-height: 1; font-variant-numeric: tabular-nums; }
.ro-db small { color: var(--muted); font-size: 14px; }
.state { margin-left: auto; font-size: 13px; font-weight: 700; padding: 2px 9px; border-radius: 999px; }
.state[data-s="plus"] { color: var(--anti); background: color-mix(in srgb, var(--anti) 14%, transparent); }
.meter { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-top: 6px; }
.meter i { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--anti), var(--heat) 65%, var(--hi)); }

.playbar { position: absolute; top: 12px; left: 12px; display: flex; align-items: center; gap: 6px; padding: 6px; }
.timenote { font-size: 12px; color: var(--muted); padding: 0 8px 0 4px; white-space: nowrap; }
@media (min-width: 900px) and (min-height: 560px) {
  html, body { height: 100%; }
  body { margin: 0; }
  .app { height: 100%; min-height: 0; }
  .stage { height: auto; flex: 1 1 0; min-height: 360px; }
}
.bottom { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; flex-wrap: wrap-reverse; justify-content: space-between; align-items: flex-end; gap: 10px; pointer-events: none; }
.bottom > * { pointer-events: auto; }
.caption { padding: 9px 16px; font-size: 18px; font-weight: 500; max-width: 760px; text-wrap: balance; }

/* 조작 독 */
.dock { display: flex; flex-wrap: wrap; gap: 8px; }
.dg { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 7px 8px; display: flex; align-items: center; gap: 10px; min-width: 0; min-height: 52px; }
.dg > span { font-size: 12px; color: var(--muted); white-space: nowrap; }
.dg.slider { flex: 1 1 240px; }
.dg.slider input[type="range"] { min-width: 70px; }
.dg.slider label { font-size: 12px; color: var(--muted); white-space: nowrap; display: flex; flex-direction: column; line-height: 1.2; }
.dg.slider output { font: 600 17px var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.dg input[type="range"] { flex: 1; min-width: 90px; accent-color: var(--accent); height: 28px; }
.seg { display: flex; gap: 3px; background: var(--surface-2); border-radius: 9px; padding: 3px; }
.seg button, .tg { border: 0; background: transparent; border-radius: 7px; padding: 5px 10px; cursor: pointer; font-size: 14px; font-weight: 500; white-space: nowrap; color: var(--muted); min-height: 34px; }
.seg button.num { font-family: var(--mono); font-size: 14px; padding: 5px 8px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px color-mix(in srgb, var(--shadow) 14%, transparent); }
.tgs { display: flex; flex-wrap: wrap; gap: 4px; }
.tg { border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }
.tg[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.tg .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.pbtn { border: 0; border-radius: 9px; padding: 7px 14px; font-weight: 700; cursor: pointer; background: var(--accent); color: var(--accent-ink); white-space: nowrap; min-height: 36px; }
.pbtn.alt { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
.pbtn.sm { padding: 7px 9px; font-family: var(--mono); font-weight: 600; }
.pbtn[aria-pressed="true"].snd { background: var(--hi); color: var(--surface); }
.pbtn[aria-pressed="true"]:not(.snd) { background: var(--ink); color: var(--surface); }

@media (max-width: 720px) {
  h1 { font-size: 18px; }
  .readout { width: 150px; padding: 8px 10px; }
  .ro { font-size: 12px; } .ro b { font-size: 14px; } .ro-db b { font-size: 26px; } .ro.v b { font-size: 16px; }
  .ro.l span { font-size: 0; } .ro.l span::before { content: "λ"; font-size: 12px; }
  .ro-sub, .ro-opt { display: none !important; }
  .caption { font-size: 15px; }
  .stage { height: clamp(380px, 62vh, 700px); }
  .playbar .seg, .timenote { display: none; }
  .playbar .pbtn.snd { padding: 7px 10px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app" id="app">
  <header class="topbar">
    <div class="brand"><span class="tag">Ⅲ-05 정상파</span><h1>공기 기둥 공명 실험</h1></div>
    <nav class="presets" id="presets" aria-label="수업 장면"></nav>
    <div class="tools">
      <button class="tbtn" id="capBtn" aria-pressed="true" title="C">설명</button>
      <button class="tbtn" id="fsBtn" title="F">전체 화면</button>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="공기 기둥 공명 장치. 물통이나 관 속 수면을 위아래로 끌어 옮기고, 위아래 화살표 키로 1 mm씩 옮깁니다. Enter 키는 위치 표시입니다.">
    <canvas id="scene"></canvas>
    <div class="glass playbar" id="playbar">
      <button class="pbtn alt" id="playBtn" title="Space">❚❚</button>
      <div class="seg" data-seg="speed"><button data-v="1">보통</button><button data-v="0.4">느리게</button></div>
      <button class="pbtn snd" id="sndBtn" aria-pressed="false">소리 켜기</button>
      <span class="timenote" id="timenote"></span>
    </div>
    <div class="glass readout" id="readout" aria-live="polite"></div>
    <div class="bottom">
      <div class="glass caption" id="caption"></div>
    </div>
  </section>

  <div class="dock" id="dock">
    <div class="dg" title="소리 발생기 진동수 (Hz)"><div class="seg" data-seg="f"><button class="num" data-v="256">256</button><button class="num" data-v="320">320</button><button class="num" data-v="384">384</button><button class="num" data-v="440">440</button><button class="num" data-v="512">512</button></div></div>
    <div class="dg slider"><label for="y">수면 위치 y<output id="yOut"></output></label><button class="pbtn alt sm" data-act="up" title="1 mm 위로 (↑)" aria-label="1 mm 위로">▲</button><input type="range" id="y" min="0.02" max="1.17" step="0.001"><button class="pbtn alt sm" data-act="dn" title="1 mm 아래로 (↓)" aria-label="1 mm 아래로">▼</button></div>
    <div class="dg"><button class="pbtn" data-act="lower" id="lowerBtn">천천히 내리기</button><button class="pbtn alt" data-act="mark" title="Enter">위치 표시</button><button class="pbtn alt" data-act="clear">지우기</button></div>
    <div class="dg"><span>온도</span><div class="seg" data-seg="t"><button class="num" data-v="0">0°</button><button class="num" data-v="20">20°</button><button class="num" data-v="35">35°</button></div></div>
    <div class="dg"><div class="tgs">
      <button class="tg" data-act="thick" id="thickBtn">굵은 관</button>
      <button class="tg" data-tg="wave">정상파</button>
      <button class="tg" data-tg="parts">공기 입자</button>
      <button class="tg" data-tg="endc">끝보정</button>
    </div></div>
  </div>
</div>

<script>
(() => {
'use strict';
/* 유리관 1.2 m. 수면 위치 y는 관 입구에서 수면까지의 거리 (m).
   공명: 공기 기둥 y + e가 λ/4의 홀수 배일 때 (e ≈ 0.6r, 끝보정). 음속 v = 331.5 + 0.6t
   물통과 관은 고무관으로 이어진 그릇: 물의 양이 보존되므로 물통을 Δ만큼 내리면 수면은 Δ·A물통/(A관 + A물통)만큼 내려간다.
   화면에서 관·물통의 가로 폭은 잘 보이도록 XT배 넓게 그린다 (길이 방향은 실제 비율).
   스마트폰 배치: 소리 발생기 앱 폰을 관 입구 바로 위 거치대에 물려 아래 모서리의 스피커가 입구 GAP(3 cm) 위에서 관 속을 향하게 하고
   (입구를 막지 않고, 입구 위 e 높이의 배보다 위), 소리 측정 앱 폰은 그 옆에 달아 아래 모서리의 마이크가 관 입구 바로 옆에 오게 한다. */
const $ = s => document.querySelector(s);
const TUBE = 1.2, YMIN = 0.02, YMAX = 1.17, BG = 40, FD = 0.6, SLOW = 0.4, GAP = 0.03, XT = 3;
const RES = { R: 0.08, H: 0.2, h0: 0.03 };           // 물통 안쪽 반지름 8 cm, 높이 20 cm, 수면이 맨 위일 때 물 높이 3 cm
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const BASE = { f: 512, t: 20, r: 0.015, wave: false, parts: false, endc: false };
const S = { ...BASE, y: 0.03, run: true, speed: reduce ? SLOW : 1, sound: false, cap: true, preset: 0, lowering: false, lowerV: 0.06, auto: 0 };
const LW = { phase: 'down', hold: 0, back: 0, pk: { max: -1, y: 0 }, armed: true };
let theta = 0, marks = [], trace = new Map(), prev = null, drag = null, flashMark = { y: 0, t: -9e9 }, zoomK = 0;   // zoomK: 돋보기 칸이 열린 정도 (0–1)
const hist = [];

/* ---------- 물리 ---------- */
const vSound = (t = S.t) => 331.5 + 0.6 * t;
const lam = (f = S.f, t = S.t) => vSound(t) / f;
const ecorr = (r = S.r) => 0.6 * r;
function ampAt(y, f = S.f, t = S.t, r = S.r) {
  const Le = y + ecorr(r), k = 2 * Math.PI / lam(f, t), d = 0.1 + 0.08 * Le, c = Math.cos(k * Le);
  return d / Math.sqrt(c * c + d * d) * (1 - 0.12 * Le);
}
const dBat = (y, f, t, r) => 10 * Math.log10(Math.pow(10, BG / 10) + Math.pow(10, 8.5) * Math.pow(ampAt(y, f, t, r), 2));
const resY = m => (2 * m - 1) * lam() / 4 - ecorr();
const m3 = v => v.toFixed(3);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rho = () => (S.r / RES.R) ** 2;                 // 관과 물통의 단면적 비
const resWater = (y = S.y) => RES.h0 + rho() * (y - YMIN);   // 물통 속 물 높이
const resBottom = (y = S.y) => y + resWater(y);        // 물통 바닥의 깊이 (관 입구 기준)
const yFromResBottom = zb => (zb - RES.h0 + rho() * YMIN) / (1 + rho());
const yMax = () => Math.min(YMAX, +yFromResBottom(TUBE + 0.06).toFixed(3));   // 물통이 받침대에 닿기 전까지만 내릴 수 있다
function synth(f, t, r) { const m = new Map(); for (let mm = Math.round(YMIN * 1000); mm <= YMAX * 1000; mm++) m.set(mm, dBat(mm / 1000, f, t, r)); return m; }
function measured() {
  const ys = [...marks].sort((a, b) => a - b);
  if (ys.length < 2) return { ys };
  const ds = ys.slice(1).map((y, i) => y - ys[i]), l = 2 * ds.reduce((a, b) => a + b, 0) / ds.length;
  return { ys, lam: l, v: S.f * l };
}

/* ---------- 수업 장면 ---------- */
const PRESETS = [
  { label: '장치', cap: '물통을 내리면 관 속 수면이 함께 내려가 공기 기둥이 길어진다', run: () => { set({}); S.y = 0.03; marks = []; } },
  { label: '첫 번째 공명 y₁', cap: '수면을 내리다 소리가 가장 커지는 곳 — 첫 번째 공명 위치 y₁', run: () => { set({}); marks = []; S.y = YMIN; startLower(0.06, 1); } },
  { label: 'y₂, y₃', cap: '이웃한 공명 위치 사이 = λ/2 → λ = 2(yₙ₊₁ − yₙ), v = fλ', run: () => { set({}); S.y = marks.length ? Math.max(...marks) + 0.03 : YMIN; startLower(0.06, 3); } },

  if ((tick = (tick + 1) % 3) === 0) updateReadout();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
