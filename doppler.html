    const x0 = X(m.xa), x1 = X(m.xb), y0 = Y(LY - m.hh), y1 = Y(LY + m.hh);
    ctx.save(); rr(x0 - 4, y0 - 4, x1 - x0 + 8, y1 - y0 + 8, 4);
    ctx.strokeStyle = rgba(T.surface, 0.75); ctx.lineWidth = 4; ctx.stroke(); ctx.setLineDash([4, 3]); ctx.strokeStyle = T.accent; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
  },
  graph() { return ['돋보기 · 사이렌 바로 앞', `한 주기 ${Number((1 / this.p.f).toPrecision(2))}초`]; },
  live() {
    const c = $('#gcv'), [W, H] = fit(c); if (W < 160) return;
    const g = c.getContext('2d'), w = this.w, e = w.ems[0], f = this.p.f, u = this.p.u;
    const lam = V / f, vT = u / f, src = wp(w, e, w.t).x;
    const xa = src - vT - Math.max(0.12 * lam, 0.06), xb = src + lam - vT + 0.12 * lam, k = W / (xb - xa);
    const Xm = x => (x - xa) * k, ym = H / 2;
    this.mag = { xa, xb, hh: H / 2 / k };
    const fs = w.fronts.filter(q => q.src === 's' && q.ep === w.ep), fn = fs[fs.length - 1], fp = fs[fs.length - 2];
    const at = !S.playing && !(this.adv > 0) && fn && fp && w.t - fn.t0 < 1e-6;
    const fsz = PH.on ? 11 : 12.5, white = '#ffffff', red = mix(T.cone, '#ffffff', 0.2), pur = mix(T.b, '#ffffff', 0.42), cyan = mix(T.wave, '#ffffff', 0.15);
    const lab = (s, x, y, col, al = 'center') => {
      g.font = `600 ${fsz}px ${T.font}`; g.textAlign = al; g.textBaseline = 'middle'; g.lineJoin = 'round';
      g.lineWidth = 3.5; g.strokeStyle = rgba('#000000', 0.55); g.strokeText(s, x, y); g.fillStyle = col; g.fillText(s, x, y);
    };
    const bar = (x0, x1, y, col) => {
      g.strokeStyle = rgba('#000000', 0.45); g.lineWidth = 5; g.lineCap = 'round'; g.beginPath(); g.moveTo(x0, y); g.lineTo(x1, y); g.stroke();
      g.strokeStyle = col; g.lineWidth = 2.6; g.stroke();
      g.lineWidth = 2; g.beginPath(); for (const x of [x0, x1]) { g.moveTo(x, y - 5); g.lineTo(x, y + 5); } g.stroke(); g.lineCap = 'butt';
    };
    g.setTransform(D.dpr, 0, 0, D.dpr, 0, 0); g.clearRect(0, 0, W, H);
    ctx = g;
    try {
      g.save(); rr(0, 0, W, H, 8); g.clip();
      g.fillStyle = T.asphalt; g.fillRect(0, 0, W, H);
      const xh = Xm(src + 0.25);                          // 구급차 앞 범퍼 (반투명: 아래에서 파면이 나오는 것이 보이게)
      g.fillStyle = rgba(T['veh-w'], 0.42); g.fillRect(0, 0, xh, H);
      g.strokeStyle = rgba(T['veh-w'], 0.9); g.lineWidth = 2; g.beginPath(); g.moveTo(xh, 0); g.lineTo(xh, H); g.stroke();
      lab('구급차 앞', 6, 12, rgba(white, 0.9), 'left');
      for (const [lw, col] of [[7, rgba(T.wave, 0.25)], [3, cyan]]) {
        g.strokeStyle = col; g.lineWidth = lw;
        for (const q of fs) { const r = w.v * (w.t - q.t0) * k; if (r < 1) continue; g.beginPath(); g.arc(Xm(q.cx), ym, r, 0, TAU); g.stroke(); }
      }
      for (const q of fs) {                               // 파면이 태어난 자리
        const x = Xm(q.cx), big = q === fn || q === fp; if (x < -6 || x > W + 6) continue;
        g.fillStyle = rgba('#000000', 0.5); g.beginPath(); g.arc(x, ym, big ? 5.4 : 3.8, 0, TAU); g.fill();
        g.fillStyle = big ? white : rgba(white, 0.7); g.beginPath(); g.arc(x, ym, big ? 3.6 : 2.4, 0, TAU); g.fill();
      }
      if (at) {
        const x0 = Xm(fp.cx), x1 = Xm(fn.cx), x2 = Xm(fp.cx + lam), yT = Math.max(24, H * 0.24), yB = H - Math.max(24, H * 0.24);
        g.setLineDash([3, 3]); g.strokeStyle = rgba(white, 0.5); g.lineWidth = 1; g.beginPath();
        for (const x of [x0, x1, x2]) { g.moveTo(x, yT); g.lineTo(x, yB); } g.stroke(); g.setLineDash([]);
        bar(x0, x2, yT, white); bar(x0, x1, yB, red); bar(x1, x2, yB, pur);
        lab(`원래 파장 λ = ${lam.toFixed(2)} m`, (x0 + x2) / 2, yT - 12, white);
        lab(`구급차가 간 거리 ${vT.toFixed(2)} m`, 5, yB + 13, red, 'left');
        lab(`λ′ = ${(lam - vT).toFixed(2)} m`, x2 - 2, yB + 13, pur, 'right');
      } else {
        lab('사이렌', Xm(src), ym - 14, white);
        if (!S.playing && !(this.adv > 0)) lab("'한 주기 ▶'로 넘겨 보세요", W - 6, 12, rgba(white, 0.85), 'right');
      }
      g.restore();
    } finally { ctx = ctx0; }
  }
};

function sirenScene(moving) {        // ① 정지한 사이렌, ② 다가오는 구급차
  // 측정기 A·B 자리와 ② 구급차 출발점 (m). 휴대폰에서는 가까이 두어 파면 사이가 넉넉히 보이게 (②는 뒤쪽에 차 길이만큼 더)
  const geo = () => !PH.on ? { A: -17, B: 17, x0: -6 } : moving ? { A: -13, B: 11, x0: -2.4 } : { A: -10, B: 10, x0: -2.4 };
  const s = Object.assign(Object.create(sirenSound), {
    chip: moving ? '다가오는 구급차' : '정지한 사이렌',
    cap: moving ? '앞(B)은 파장이 짧아져 높은 소리, 뒤(A)는 파장이 길어져 낮은 소리' : '멈춘 음원: 앞뒤 어디서나 파장과 진동수가 같다',
    view: { cx: 0, cy: 2.4, w: 40, h: 21 }, bg: 'road', K: SLOW,
    p: { f: 500, u: moving ? 30 : 0, centers: false, rulers: true, ov: false },
    pv() { const r = 54 * PH.k * 0.62 + 6, g = this.g; return { x0: g.A, x1: g.B, y0: LY - 1.1, y1: LY + 1.1, pad: [fz(58), r, fz(60), r] }; },
    enter() { this.build(); },
    relayout() { if (this.g.B !== geo().B) this.build(); },
    build() {
      this.adv = 0;
      const g = this.g = geo(), u = this.p.u, x0 = u ? g.x0 : SPK, A = g.A, B = g.B;
      this.w = WS({ v: V, ems: [{ id: 's', x: x0, y: LY, vx: u, f: this.p.f, xmax: B - 4, pre: u > 0 ? Math.min(0.16, (x0 - A - 2) / u) : 0.16 }],
        rxs: [{ id: 'A', src: 's', x: A, y: LY }, { id: 'B', src: 's', x: B, y: LY }] });
    },
    step(dt) { this.adv = 0; wsStep(this.w, dt / this.K); },
    draw() {
      const w = this.w, e = w.ems[0], p = wp(w, e, w.t), u = this.p.u, k = vehK();
      wsDraw(w, { centers: this.p.centers ? 's' : null });
      for (const [rx, col, face] of [[w.rxs[0], T.a, 0], [w.rxs[1], T.b, Math.PI]]) {
        const x = X(rx.x), y = Y(rx.y), sz = Math.max(54 * PH.k, 1.8 * VW.sc); flashRing(rx, x, y, col);
        meterTop(x, y, sz, face, col, rx.flash && performance.now() - rx.flash < 120);
        pill(rx.id, x, y + sz * 0.62 + 20 * PH.k, col, 'center', fz(17));
      }
      vehicle('amb', X(p.x) - SPK * k, Y(p.y), 1, { siren: true });
      const tip = (46 + Math.min(40, u * 0.8)) * PH.k;
      if (u) arrowPx(X(p.x) + 12 * PH.k, Y(p.y), X(p.x) + tip, Y(p.y), T.ink, 4 * PH.k);
      if (this.p.rulers) {           // 앞: 화살표 끝 ~ B 측정기, 뒤: 구급차 꽁무니 ~ A 측정기 (구간은 8 m까지)
        const sc = VW.sc, mo = (Math.max(54 * PH.k, 1.8 * sc) * 0.62 + 12) / sc, f = this.p.f;
        const ia = p.x + (u ? tip + 12 : 0.25 * sc + 14) / sc, ib = p.x - SPK - VEH.amb[0] / 2 - 14 / sc;
        lamRulers(this, w, LY, [
          { key: 'a', dir: 1, inner: ia, outer: Math.min(ia + 8, w.rxs[1].x - mo), lam: (V - u) / f, label: `${u ? 'λ′' : 'λ'} = ${((V - u) / f).toFixed(2)} m`, col: T.b },
          { key: 'b', dir: -1, inner: ib, outer: Math.max(ib - 8, w.rxs[0].x + mo), lam: (V + u) / f, label: `${u ? 'λ″' : 'λ'} = ${((V + u) / f).toFixed(2)} m`, col: T.a }]);
      }
      if (this.magBox) this.magBox();
      scaleBar(5, '5 m');
    },
    vals() { const f = this.p.f, u = this.p.u; return { fA: f * V / (V + u), fB: f * V / (V - u), lA: (V + u) / f, lB: (V - u) / f }; },
    hud() {
      const v = this.vals(), f = this.p.f, u = this.p.u;
      return {
        L: [ro({ k: 'A에서 들리는 소리', dot: T.a, v: f1(v.fA), u: 'Hz', s: `파장 ${v.lA.toFixed(2)} m`, f: u ? `340/(340 + ${u}) × ${f}` : `λ = 340 ÷ ${f}` })],
        M: [ro({ k: u ? '구급차' : '구급차 (정지)', v: `${u}`, u: u ? `m/s · ${kmh(u)} km/h` : 'm/s', s: `사이렌 높은 음 ${f} Hz` })],
        R: [ro({ k: 'B에서 들리는 소리', dot: T.b, v: f1(v.fB), u: 'Hz', s: `파장 ${v.lB.toFixed(2)} m`, f: u ? `340/(340 − ${u}) × ${f}` : `λ = 340 ÷ ${f}` })]
      };
    },
    dock() {
      const d = [{ t: 'play' }, { t: 'restart' }];
      if (moving) d.push({ t: 'act', label: '한 주기 ▶', key: '.', run: () => this.stepPeriod() });
      if (moving) d.push({ t: 'slider', label: '구급차 속력', key: 'u', min: 0, max: 50, step: 5, fmt: v => `${v} <small>m/s · ${kmh(v)} km/h</small>` });
      d.push({ t: 'slider', label: '사이렌 (높은 음)', key: 'f', min: 300, max: 1000, step: 50, fmt: v => `${v} <small>Hz</small>`, narrow: true });
      d.push({ t: 'sound', id: 'o', label: '원래 소리' }, { t: 'sound', id: 'A', label: 'A', dot: T.a }, { t: 'sound', id: 'B', label: 'B', dot: T.b });
      if (moving) d.push({ t: 'toggle', key: 'centers', label: '파면 중심' }, { t: 'toggle', key: 'ov', label: '돋보기' });
      d.push({ t: 'toggle', key: 'rulers', label: '파장 자' }, { t: 'formula' });
      return d;
    },
    sound(id) { const u = this.p.u; return { f: this.p.f, D: { o: 1, A: V / (V + u), B: V / (V - u) }[id] }; },
    onParam() { this.build(); }
  });
  if (!moving) return s;
  Object.defineProperty(s, 'view', { get() { return { cx: 0, cy: this.p.ov ? 4 : 2.4, w: 40, h: 21 }; } });
  return Object.assign(s, MAG);
}

const SCENES = [
  sirenScene(false),
  sirenScene(true),

  /* ③ 길옆에서 듣는 지나가는 구급차: 실제 속도 + 소리 + 진동수 그래프 */
  {
    chip: '지나가는 구급차', cap: '길옆에서는 나를 향하는 속도 성분만 진동수를 바꿔, 소리가 부드럽게 낮아진다',
    get view() { return { cx: 0, cy: 8.5, w: clamp(D.w / 6.5, 44, 90), h: 44 }; },   // 좁은 화면에서는 가까이
    bg: 'roadSide', K: 1, realtime: true, dmax: 20,
    p: { u: 20, d: 6, los: false, waves: false },
    x0: -44, x1: 48, f0: 500,
    pv() { return { x0: -22, x1: 22, y0: LY - 1.6, y1: LY + this.dv + 0.4, pad: [8, 8, fz(46), 8] }; },     // 휴대폰: 길 ~ 나 (끄는 동안에는 보기를 바꾸지 않음)
    enter() { this.t = 0; this.run = false; this.fin = false; this.trace = []; this.prev = null; this.Ttot = 0; this.wv = null; this.drag = false; this.uRun = this.p.u; this.dv = Math.max(8, this.p.d); },
    obs() { return { x: 0, y: LY + this.p.d }; },
    hit(p) {                       // 사람 그림(발 = 관찰자 자리, 위로 키 h)이나 발밑 고리를 누르면 끌기
      const o = this.obs(), h = manH(), dx = (p.x - o.x) * VW.sc, dy = (p.y - o.y) * VW.sc;
      return Math.hypot(dx, dy) < 34 || (Math.abs(dx) < Math.max(22, h * 0.5) && dy > -h - 6 && dy < h * 0.2 + 8);
    },
    Tr() { return (this.x1 - this.x0) / this.uRun; },
    amb(te) { return { x: this.x0 + this.uRun * te, y: LY }; },          // 사이렌 스피커(앞 범퍼) 위치
    te(t) { return retard(t, te => this.amb(te), () => this.obs()); },
    heard(t) { return this.f0 * (this.te(t + 0.005) - this.te(t - 0.005)) / 0.01; },     // 지금 들리는 진동수 = f0 · dte/dt
    primary() { this.start(); },
    start() {
      if (this.run) return;
      if (this.trace.length) this.prev = { pts: this.trace, d: this.dRun, u: this.uRun };
      this.trace = []; this.t = 0; this.run = true; this.fin = false; this.dRun = this.p.d; this.uRun = this.p.u;
      this.Ttot = this.Tr() + 0.8;

    step(dt) {

      if (this.wv) wsStep(this.wv, this.t - tPrev);

    draw() {
      const o = this.obs(), te = this.run ? this.t : 0, a = this.amb(te), k = vehK();
      if (this.p.waves && this.wv && this.run) wsDraw(this.wv, { lw: 2.2 });

      ctx.strokeStyle = T.ink; ctx.lineWidth = 2; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.moveTo(dx - 7, Y(LY)); ctx.lineTo(dx + 7, Y(LY)); ctx.moveTo(dx, Y(LY)); ctx.lineTo(dx, Y(o.y)); ctx.stroke(); ctx.setLineDash([]);

        ctx.setLineDash([9, 7]); ctx.strokeStyle = rgba(T.surface, 0.9); ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(X(g.x), Y(g.y)); ctx.lineTo(X(o.x), Y(o.y)); ctx.stroke();

    },
    dock() {
      return [{ t: 'go', label: '출발', busy: () => this.run }, { t: 'slider', label: '구급차 속력', key: 'u', min: 10, max: 40, step: 5, fmt: v => `${v} <small>m/s · ${kmh(v)} km/h</small>`, lock: () => this.run },

    view: { cx: 2, cy: -3.1, w: 40, h: 21 }, bg: 'road', K: SLOW,      // 아래 오른쪽 관찰자 시점 창에 차 이름표가 가리지 않게 조금 위로
