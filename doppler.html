* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; }
button, input { font: inherit; color: inherit; }

.app:fullscreen { padding-block: 12px; }

.chip b { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font: 600 12px var(--mono); }
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.chip[aria-pressed="true"] b { background: var(--accent); color: var(--accent-ink); }
.tools { display: flex; gap: 6px; margin-left: auto; }
.tbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 6px 12px; cursor: pointer; font-size: 14px; font-weight: 500; white-space: nowrap; }
.tbtn:hover { border-color: var(--muted); }
.tbtn[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

.app:fullscreen .stage { height: auto; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.readout { position: absolute; top: 12px; right: 12px; width: 236px; padding: 12px 14px 12px; display: flex; flex-direction: column; gap: 3px; }
.ro { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 13px; color: var(--muted); }
.ro b { font: 500 18px var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }

.ro span { min-width: 0; }
.ro-k { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--muted); margin-top: 2px; }
.ro-k i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.ro-sub { text-align: right; font: 500 14px var(--mono); color: var(--muted); margin-top: -2px; white-space: nowrap; }
.ro-f { text-align: right; font: 500 13px var(--mono); color: var(--ink); background: var(--surface-2); border-radius: 7px; padding: 3px 7px; margin-top: 2px; white-space: nowrap; overflow-x: auto; }
.ro-sep { height: 1px; background: var(--line); margin: 6px 0; }
.ro-db { display: flex; align-items: baseline; justify-content: flex-end; gap: 6px; }
.ro-db b { font: 600 36px var(--mono); line-height: 1.05; font-variant-numeric: tabular-nums; letter-spacing: -.02em; white-space: nowrap; }

.timenote { font-size: 12px; color: var(--muted); padding: 0 8px 0 4px; white-space: nowrap; }

.graph-card.tall { width: min(420px, 100%); }
.graph-card.tall #gcv { height: 138px; }

.dg > span { font-size: 12px; color: var(--muted); white-space: nowrap; }

.dg input[type="range"]:disabled { opacity: .45; }
.seg { display: flex; gap: 3px; background: var(--surface-2); border-radius: 9px; padding: 3px; }
.seg button, .tg { border: 0; background: transparent; border-radius: 7px; padding: 5px 10px; cursor: pointer; font-size: 14px; font-weight: 500; white-space: nowrap; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / .14); }
.seg.snd button[aria-pressed="true"] { background: var(--cone); color: var(--on-cone); }
.seg .dot, .tg .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.tgs { display: flex; flex-wrap: wrap; gap: 4px; }
.tg { border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }
.tg[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.pbtn { border: 0; border-radius: 9px; padding: 7px 14px; font-weight: 700; cursor: pointer; background: var(--accent); color: var(--accent-ink); white-space: nowrap; }
.pbtn.alt { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
.pbtn:disabled { opacity: .5; cursor: not-allowed; }

@media (max-width: 720px) {
  h1 { font-size: 18px; }
  .readout { width: 150px; padding: 8px 10px; }
  .ro-opt, .ro-f { display: none !important; }
  .ro { flex-wrap: wrap; gap: 0 8px; } .ro span { white-space: nowrap; } .ro b { margin-left: auto; }
  .ro-sub { white-space: normal; text-wrap: balance; font-size: 12px; }
  .ro b { font-size: 15px; } .ro-db b { font-size: 24px; }
  .caption { font-size: 15px; }
  .graph-card { display: none; }
  .stage { height: clamp(380px, 62vh, 700px); }
  .playbar { max-width: calc(100% - 186px); }
  .playbar .seg.speed, .timenote { display: none; }

        const sc = VW.sc, mo = (Math.max(54, 1.8 * sc) * 0.62 + 12) / sc, f = this.p.f;

    hud() {

        M: [ro({ k: u ? '구급차' : '구급차 (정지)', v: `${u}`, u: u ? `m/s · ${kmh(u)} km/h` : 'm/s', s: `사이렌 높은 음 ${f} Hz` })],
        R: [ro({ k: 'B에서 들리는 소리', dot: T.b, v: f1(v.fB), u: 'Hz', s: `파장 ${v.lB.toFixed(2)} m`, f: u ? `340/(340 − ${u}) × ${f}` : `λ = 340 ÷ ${f}` })]

    dock() {

      d.push({ t: 'slider', label: '사이렌 (높은 음)', key: 'f', min: 300, max: 1000, step: 50, fmt: v => `${v} <small>Hz</small>`, narrow: true });
      d.push({ t: 'sound', id: 'o', label: '원래 소리' }, { t: 'sound', id: 'A', label: 'A', dot: T.a }, { t: 'sound', id: 'B', label: 'B', dot: T.b });
      if (moving) d.push({ t: 'toggle', key: 'centers', label: '파면 중심' });

    },
    sound(id) { const u = this.p.u; return { f: this.p.f, D: { o: 1, A: V / (V + u), B: V / (V - u) }[id] }; },
    onParam() { this.build(); }
  });
}

    road[i] = 0.55 * Math.min(1.4, 6 / rc) * fade; eng[i] = 0.3 * Math.min(1.4, 6 / rc) * fade;
  }
  const sv = sirenVoice(bus, s.f0, Dk[0], st);
  sv.mul.gain.setValueCurveAtTime(Dk, st, Tt); sv.lfo.frequency.setValueCurveAtTime(lfoF, st, Tt);
  sv.vol.gain.setValueCurveAtTime(vS, st, Tt); sv.air.frequency.setValueCurveAtTime(fc, st, Tt);
  if (sv.pan) sv.pan.pan.setValueCurveAtTime(pan, st, Tt);
  const rg = amp(0), eg = amp(0), np = c.createStereoPanner ? c.createStereoPanner() : null;
  chain(noise(st), biquad('bandpass', 850, 0.6), biquad('lowpass', 2600, 0.5), rg);
  const eo = keep(c.createOscillator()); eo.type = 'sawtooth'; eo.frequency.value = engF[0];
  chain(eo, biquad('lowpass', 240, 1.6), eg); eo.start(st);
  rg.gain.setValueCurveAtTime(road, st, Tt); eg.gain.setValueCurveAtTime(eng, st, Tt); eo.frequency.setValueCurveAtTime(engF, st, Tt);
  if (np) { rg.connect(np); eg.connect(np); np.connect(bus); np.pan.setValueCurveAtTime(pan, st, Tt); } else { rg.connect(bus); eg.connect(bus); }
  const amb = amp(0); chain(noise(st), biquad('lowpass', 420, 0.5), amb, bus);           // 도시의 낮은 배경 소음
  amb.gain.setValueCurveAtTime(Float32Array.from([0, 0.12, 0.12, 0.12, 0]), st, Tt);
  for (const x of AU.srcs) { try { x.stop(st + Tt + 0.1); } catch (e) {} }
  return st;
}
function beatSound(s) {            // ⑦ 경찰차 안: 두 사이렌(일정한 음) + 거리 감쇠 + 차 안 소음
  const bus = newBus(), c = AU.ctx, st = c.currentTime + 0.05, Tt = s.dur, N = Math.ceil(Tt * 60);
  AU.key = 'beat';
  const cabin = biquad('lowpass', 3400, 0.5); cabin.connect(bus);
  [s.res.fa, s.res.fb].forEach((f, j) => {
    const sv = sirenVoice(cabin, f, 1, st, true), a = new Float32Array(N);
    for (let i = 0; i < N; i++) { const t = i / (N - 1) * Tt; a[i] = 0.2 * s.gains(t)[j] * Math.min(1, t / 0.15, (Tt - t) / 0.3); }
    sv.vol.gain.setValueCurveAtTime(a, st, Tt);
  });
  const rum = amp(0); chain(noise(st), biquad('lowpass', 150, 0.7), biquad('lowpass', 220, 0.5), rum, bus);
  rum.gain.setValueCurveAtTime(Float32Array.from([0, 1.3, 1.3, 1.3, 0]), st, Tt);
  for (const x of AU.srcs) { try { x.stop(st + Tt + 0.1); } catch (e) {} }
  return st;
}

/* ---------- 작은 그래프 ---------- */
function plot(c, o) {
  const [w, h] = fit(c), g = c.getContext('2d');
  g.setTransform(D.dpr, 0, 0, D.dpr, 0, 0); g.clearRect(0, 0, w, h);
  const L = 44, R = 12, Tp = 8, B = 20, pw = w - L - R, ph = h - Tp - B;
  const Xp = x => L + (x - o.x0) / (o.x1 - o.x0) * pw, Yp = y => Tp + ph - (y - o.y0) / (o.y1 - o.y0) * ph;
  g.font = `12px ${T.mono}`; g.lineWidth = 1; g.textBaseline = 'middle';
  for (const yv of o.yt) { g.strokeStyle = rgba(T.ink, 0.12); g.beginPath(); g.moveTo(L, Yp(yv)); g.lineTo(w - R, Yp(yv)); g.stroke(); g.fillStyle = T.muted; g.textAlign = 'right'; g.fillText(yv, L - 6, Yp(yv)); }
  g.textBaseline = 'top';
  o.xt.forEach((xv, i) => { g.fillStyle = T.muted; g.textAlign = i === o.xt.length - 1 && Xp(xv) > w - R - 14 ? 'right' : 'center'; g.fillText(o.xf(xv), g.textAlign === 'right' ? w - 2 : Xp(xv), h - B + 5); });
  for (const hl of o.hl || []) { g.setLineDash([5, 4]); g.strokeStyle = T.muted; g.beginPath(); g.moveTo(L, Yp(hl.y)); g.lineTo(w - R, Yp(hl.y)); g.stroke(); g.setLineDash([]); }
  g.save(); g.beginPath(); g.rect(L, Tp - 3, pw, ph + 6); g.clip();
  for (const s of o.series) { g.globalAlpha = s.alpha ?? 1; g.strokeStyle = s.col; g.lineWidth = s.w; g.lineJoin = 'round'; g.beginPath(); s.pts.forEach(([x, y], i) => i ? g.lineTo(Xp(x), Yp(y)) : g.moveTo(Xp(x), Yp(y))); g.stroke(); }
  g.restore(); g.globalAlpha = 1;
}

/* =====================================================================
   화면 구성과 조작
   ===================================================================== */
let cur = SCENES[0], PB = [], DK = [];
function renderChips() {
  $('#chips').innerHTML = SCENES.map((s, i) => `<button class="chip" data-i="${i}" aria-pressed="${i === S.i}" title="${i + 1}"><b>${i + 1}</b>${s.chip}</button>`).join('');
}
function go(i) {
  S.i = clamp(i, 0, SCENES.length - 1); stopAudio(); S.playing = !reduce;
  cur = SCENES[S.i]; cur.enter(); setView(cur.view);
  document.querySelectorAll('.chip').forEach((b, j) => b.setAttribute('aria-pressed', String(j === S.i)));
  renderBars(); txt($('#caption'), cur.cap); $('#caption').hidden = !S.caption;
  $('#gpanel').classList.toggle('tall', !!cur.live); panelSync(); BG.key = ''; hudKey = '';
  renderHud(); measureUI();
  try { localStorage.setItem('doppler3-scene', String(S.i)); } catch (e) {}
}
function renderBars() {
  const items = cur.dock();
  PB = items.filter(d => ['play', 'restart', 'go'].includes(d.t));
  const snd = items.filter(d => d.t === 'sound');
  DK = items.filter(d => ['slider', 'seg'].includes(d.t));
  const tg = items.filter(d => d.t === 'toggle' || d.t === 'formula');
  let pb = PB.map((d, i) => {
    if (d.t === 'play') return `<button class="pbtn alt" data-pb="${i}" title="Space"></button><div class="seg speed"><button data-speed="1">보통</button><button data-speed="0.3">느리게</button></div>`;
    if (d.t === 'restart') return `<button class="pbtn alt" data-pb="${i}">처음부터</button>`;
    return `<button class="pbtn" data-pb="${i}" title="Space"></button>`;
  }).join('');
  if (snd.length) pb += `<div class="seg snd" aria-label="소리"><button data-snd="">소리 끔</button>${snd.map(s => `<button data-snd="${s.id}">${s.dot ? `<i class="dot" style="background:${s.dot}"></i>` : ''}${s.label}</button>`).join('')}</div>`;
  pb += '<span class="timenote" id="timenote"></span>';
  $('#playbar').innerHTML = pb;
  let dk = DK.map((d, i) => {
    if (d.t === 'slider') return `<div class="dg slider"${d.narrow ? ' style="flex-grow:.6"' : ''}><label for="sl${i}">${d.label}<output id="so${i}"></output></label><input type="range" id="sl${i}" data-dk="${i}" min="${d.min}" max="${d.max}" step="${d.step}"></div>`;
    return `<div class="dg"><span>${d.label}</span><div class="seg">${d.opts.map(([v, l]) => `<button data-dk="${i}" data-v="${v}">${l}</button>`).join('')}</div></div>`;
  }).join('');
  if (tg.length) dk += `<div class="dg"><div class="tgs">${tg.map(d => d.t === 'formula' ? '<button class="tg" data-tg="formula">식</button>' : `<button class="tg" data-tg="${d.key}">${d.label}</button>`).join('')}</div></div>`;
  $('#dock').innerHTML = dk;
  syncBars();
}
const panelOn = () => !!cur.graph && cur.p.ov !== false;      // 아래 오른쪽 작은 창 (그래프 · ④ 관찰자 시점)
function panelSync() { const gp = $('#gpanel'), on = panelOn(); if (gp.hidden === on) gp.hidden = !on; }
function syncBars() {
  panelSync();
  PB.forEach((d, i) => {
    const el = document.querySelector(`#playbar [data-pb="${i}"]`); if (!el) return;
    if (d.t === 'play') { txt(el, S.playing ? '❚❚' : '▶'); el.setAttribute('aria-label', S.playing ? '멈춤' : '재생'); }
    if (d.t === 'go') { txt(el, d.busy() ? '진행 중…' : `▶ ${d.label}`); el.disabled = d.busy(); }
  });
  document.querySelectorAll('#playbar [data-speed]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.speed === S.speed)));
  document.querySelectorAll('#playbar [data-snd]').forEach(b => b.setAttribute('aria-pressed', String((['pass', 'beat'].includes(AU.key) ? '' : AU.key || '') === b.dataset.snd)));
  const tn = $('#timenote');
  if (tn) {
    const k = Math.round(cur.K / S.speed);
    let s = !cur.realtime && !S.playing ? '일시정지' : cur.realtime || k <= 1 ? '실제 속도' : `실제보다 ${k}배 느림`;
    if (cur.note && (S.playing || cur.realtime)) s += ' · ' + cur.note();
    txt(tn, s);
  }
  DK.forEach((d, i) => {
    if (d.t === 'slider') { const el = $('#sl' + i); if (!el) return; if (document.activeElement !== el) el.value = cur.p[d.key]; el.disabled = !!(d.lock && d.lock()); html($('#so' + i), d.fmt(cur.p[d.key])); }
    else document.querySelectorAll(`#dock [data-dk="${i}"]`).forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.v === cur.p[d.key])));
  });
  document.querySelectorAll('#dock [data-tg]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tg === 'formula' ? S.formula : !!cur.p[b.dataset.tg])));
}
function roHTML(o, compact) {
  const dot = o.dot ? `<i style="background:${o.dot}"></i>` : '';
  let h = compact
    ? `<div class="ro"><span>${o.k}</span><b>${o.v}${o.u ? `<small>${o.u}</small>` : ''}</b></div>`
    : `<div class="ro-k">${dot}${o.k}</div><div class="ro-db"><b>${o.v}</b>${o.u ? `<small>${o.u}</small>` : ''}</div>`;
  if (o.s) h += `<div class="ro-sub${compact ? ' ro-opt' : ''}">${o.s}</div>`;
  if (o.f && S.formula) h += `<div class="ro-f">${o.f}</div>`;
  return h;
}
let hudKey = '';
function renderHud() {
  const h = cur.hud(), parts = [];
  if (h.M && h.M.length) parts.push(h.M.map(o => roHTML(o, o.compact ?? !o.big)).join(''));
  const lr = ['L', 'R'].filter(s => h[s] && h[s].length).map(s => h[s].map(o => roHTML(o, !!o.compact)).join(''));
  if (lr.length) parts.push(lr.join(h.L && h.L.length && h.L[0].compact ? '' : '<div class="ro-sep"></div>'));
  const s = parts.join('<div class="ro-sep"></div>');
  if (s !== hudKey) { $('#readout').innerHTML = s; hudKey = s; }
  if (panelOn()) { const g = cur.graph(); txt($('#gTitle'), g[0]); txt($('#gUnit'), g[1]); }
}
function toggleSound(id) {
  if (!id || AU.key === id) { stopAudio(); return; }
  if (!cur.listen || !audioOK()) return;
  newBus(); AU.key = id; cur.listen(id);
}

$('#chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) go(+b.dataset.i); });
$('#playbar').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.pb != null) {
    const d = PB[+b.dataset.pb];
    if (d.t === 'play') S.playing = !S.playing;
    else if (d.t === 'restart') cur.enter();
    else if (d.t === 'go') cur.primary();
  } else if (b.dataset.speed) S.speed = +b.dataset.speed;
  else if (b.dataset.snd != null) toggleSound(b.dataset.snd);
  syncBars(); renderHud();
});
$('#dock').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.dk != null) { const d = DK[+b.dataset.dk]; cur.p[d.key] = +b.dataset.v; cur.onParam(); }
  else if (b.dataset.tg) {
    if (b.dataset.tg === 'formula') { S.formula = !S.formula; try { localStorage.setItem('doppler3-formula', S.formula ? '1' : '0'); } catch (err) {} }
    else cur.p[b.dataset.tg] = !cur.p[b.dataset.tg];
  }
  syncBars(); renderHud();
});
$('#dock').addEventListener('input', e => {
  const r = e.target.closest('input[data-dk]'); if (!r) return;
  const d = DK[+r.dataset.dk]; cur.p[d.key] = +r.value; cur.onParam(); syncBars(); renderHud();
});
$('#capBtn').addEventListener('click', () => { S.caption = !S.caption; $('#caption').hidden = !S.caption; $('#capBtn').setAttribute('aria-pressed', String(S.caption)); try { localStorage.setItem('doppler3-cap', S.caption ? '1' : '0'); } catch (e) {} });
function toggleFS() {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else { const el = $('#app'), fn = el.requestFullscreen || el.webkitRequestFullscreen; if (fn) { const p = fn.call(el); if (p && p.catch) p.catch(() => {}); } }
  } catch (e) {}
}
$('#fsBtn').addEventListener('click', toggleFS);
document.addEventListener('fullscreenchange', () => { txt($('#fsBtn'), document.fullscreenElement ? '전체 화면 끝' : '전체 화면'); resize(); });
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tg = e.target, onRange = !!tg.matches?.('input[type="range"]');
  if (!onRange && tg.matches?.('input, textarea, select')) return;
  if (e.key === ' ') { e.preventDefault(); if (cur.primary) cur.primary(); else S.playing = !S.playing; syncBars(); renderHud(); return; }
  if (/^[1-9]$/.test(e.key) && +e.key <= SCENES.length) { go(+e.key - 1); return; }
  if (e.key === 'f' || e.key === 'F') { toggleFS(); return; }
  if (e.key === 'c' || e.key === 'C') { $('#capBtn').click(); return; }
  if (onRange) return;                 // 화살표는 슬라이더 몫
  if (cur.obs && !cur.run && (e.key === 'ArrowUp' || e.key === 'ArrowDown') && tg === cv) { e.preventDefault(); cur.p.d = clamp(cur.p.d + (e.key === 'ArrowUp' ? -1 : 1), 2, cur.dmax || 20); syncBars(); }
});
const pe = e => { const r = cv.getBoundingClientRect(); return toW(e.clientX - r.left, e.clientY - r.top); };
cv.addEventListener('pointerdown', e => { if (cur.down && cur.down(pe(e))) cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  if (cur.move) cur.move(pe(e));
  if (cur.obs) { const o = cur.obs(), p = pe(e); cv.style.cursor = cur.drag ? 'grabbing' : !cur.run && Math.hypot(p.x - o.x, p.y - o.y) < Math.max(3, 34 / VW.sc) ? 'grab' : 'default'; } else cv.style.cursor = 'default';
});
cv.addEventListener('pointerup', () => { if (cur.up) cur.up(); });
cv.addEventListener('pointercancel', () => { if (cur.up) cur.up(); });

/* ---------- 시작과 반복 (시간 기반: 창이 가려져도 같은 속도로 흐름) ---------- */
readTheme(); resize();
new ResizeObserver(resize).observe($('#stage'));
renderChips();
try {
  if (localStorage.getItem('doppler3-cap') === '0') S.caption = false;
  if (localStorage.getItem('doppler3-formula') === '1') S.formula = true;
  const i = +(localStorage.getItem('doppler3-scene') || 0); if (i >= 0 && i < SCENES.length) S.i = i;
} catch (e) {}
$('#capBtn').setAttribute('aria-pressed', String(S.caption));
go(S.i);
let last = performance.now(), tick = 0, pending = false;
function loop(now) { pending = false; frame(now); request(); }
function request() { if (!pending) { pending = true; requestAnimationFrame(loop); } }
setInterval(() => { if (performance.now() - last > 300) frame(performance.now()); }, 100);
function frame(now) {
  let el = Math.min(1, Math.max(0, (now - last) / 1000)); last = now;
  if (cur.realtime) while (el > 1e-6) { const d = Math.min(0.05, el); cur.step(d); el -= d; }
  else if (S.playing) { el *= S.speed; while (el > 1e-6) { const d = Math.min(0.05, el); cur.step(d); el -= d; } }
  setView(cur.view);
  if (cur.tickAudio) cur.tickAudio();
  if (AU.siren && AU.key && cur.sound) { const s = cur.sound(AU.key), k = s.f + '|' + s.D; if (k !== AU.last) { AU.siren.set(s.f, s.D); AU.last = k; } }
  ctx.setTransform(D.dpr, 0, 0, D.dpr, 0, 0); ctx.globalAlpha = 1; ctx.setLineDash([]); noShadow(); ctx.filter = 'none';
  drawBackground(cur.bg);
  cur.draw();
  if (cur.live && panelOn()) cur.live();
  if ((tick = (tick + 1) % 4) === 0) { renderHud(); syncBars(); measureUI(); }
}
request();
})();
</script>
