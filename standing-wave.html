<title>정상파 만들기</title>

<style>
/* TEACHER-DEMO v3 — 교사용 시연 도구
   Layout: 얇은 상단 바(수업 순서 장면 칩) / 화면을 채우는 2D 무대 + 유리 카드 측정값 / 아래 조작 독 */
:root {
  --bg: #e9edf1;
  --surface: #ffffff;
  --surface-2: #f3f5f8;
  --ink: #141c25;
  --muted: #5a6573;
  --line: #d3dae2;
  --accent: #0b6b70;
  --accent-ink: #ffffff;
  --hi: #e2553f;
  --hi-ink: #ffffff;
  --lo: #2c6fd4;
  --heat: #f0a20f;
  --nodal: #6a3fd6;
  --anti: #17955a;
  --stage: #dfe5ea;
  --stage-a: #f3f6f8; --stage-b: #dce3e9;
  --floor-a: #d6dbd4; --floor-b: #c8cec6;
  --str: #2d3b49; --str-lo: #0e161f; --str-hi: #8da2b6;
  --thread: #f4f0e6; --thread-lo: #a59d8c;
  --board: #14181d; --board-hi: #2b323a;
  --p1: #0a7f86; --p2: #d06a14;
  --metal-hi: #f7f9fb; --metal: #a9b3bd; --metal-lo: #5b6671;
  --iron: #3d454e; --iron-hi: #6a747f;
  --case: #2a3037; --case-hi: #4b545e;
  --holder: #1b1f23; --holder-hi: #4a525b;
  --wire-r: #d23a2c;
  --rubber: #2d3136; --rubber-hi: #6b737c;
  --wood: #dcb781; --wood-lo: #a97f48; --wood-ink: #4a3215;
  --shadow: #0b1520; --spec: #ffffff;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {

    --bg: #0d1116; --surface: #161c23; --surface-2: #1d252e; --ink: #e6ebf0; --muted: #98a4b0; --line: #2b3540;
    --accent: #3fc0b5; --accent-ink: #0d1116;

    --iron: #2a3037; --iron-hi: #545e69;

}

  --accent: #3fc0b5; --accent-ink: #0d1116;

  --stage: #12171d; --stage-a: #1a222b; --stage-b: #10161c; --floor-a: #232a31; --floor-b: #1a2027;
  --str: #c9d4df; --str-lo: #6b7c8d; --str-hi: #ffffff; --p1: #3fc6c4; --p2: #f5a04c;
  --thread: #f1ece0; --thread-lo: #8f8878;
  --board: #07090c; --board-hi: #1d232a;
  --metal-hi: #e3e9ee; --metal: #87939f; --metal-lo: #38424c;
  --iron: #2a3037; --iron-hi: #545e69;
  --case: #1d2228; --case-hi: #3c444d;
  --holder: #121417; --holder-hi: #3c434b;
  --wire-r: #e0584b;

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  min-height: 100vh; display: flex; flex-direction: column; gap: 10px;
  padding-block: 10px 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bg);
}
.app:fullscreen { padding-block: 12px; }

/* 상단 바 */
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.tag { font: 500 12px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 520px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px 4px 4px; cursor: pointer; font-size: 13.5px; font-weight: 500; white-space: nowrap; transition: background .15s, border-color .15s; }
.chip b { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font: 600 12px var(--mono); }
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.chip[aria-pressed="true"] b { background: var(--accent); color: var(--accent-ink); }
.tools { display: flex; gap: 6px; margin-left: auto; }
.tbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 6px 12px; cursor: pointer; font-size: 14px; font-weight: 500; white-space: nowrap; }
.tbtn:hover { border-color: var(--muted); }
.tbtn[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

/* 무대 */
.stage { position: relative; flex: 1 1 auto; height: clamp(420px, calc(100vh - 200px), 1100px); border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: var(--stage); }
.app:fullscreen .stage { height: auto; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.glass { background: color-mix(in srgb, var(--surface) 86%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border: 1px solid color-mix(in srgb, var(--line) 85%, transparent); border-radius: 14px; box-shadow: 0 8px 28px color-mix(in srgb, var(--shadow) 10%, transparent); }
.readout { position: absolute; top: 12px; right: 12px; width: 236px; padding: 12px 14px 12px; display: flex; flex-direction: column; gap: 3px; }
.ro { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 13px; color: var(--muted); }
.ro b { font: 500 18px var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.ro.hi span { color: var(--hi); font-weight: 700; } .ro.lo span { color: var(--lo); font-weight: 700; } .ro.nd span { color: var(--nodal); font-weight: 700; }
.ro-sep { height: 1px; background: var(--line); margin: 6px 0; }
.ro-cap { font-size: 13px; color: var(--muted); }
.ro-db { display: flex; align-items: baseline; gap: 6px; }
.ro-db b { font: 600 38px var(--mono); line-height: 1; font-variant-numeric: tabular-nums; }
.ro-db small { color: var(--muted); font-size: 14px; }
.state { margin-left: auto; font-size: 13px; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.state[data-s="plus"] { color: var(--anti); background: color-mix(in srgb, var(--anti) 14%, transparent); }
.state[data-s="minus"] { color: var(--nodal); background: color-mix(in srgb, var(--nodal) 14%, transparent); }

.playbar { position: absolute; top: 12px; left: 12px; display: flex; align-items: center; gap: 6px; padding: 6px; }
.timenote { font: 500 13px var(--mono); color: var(--muted); padding: 0 8px 0 4px; white-space: nowrap; }
@media (min-width: 900px) and (min-height: 560px) {
  html, body { height: 100%; }
  .app { height: 100%; min-height: 0; }
  .stage { height: auto; flex: 1 1 0; min-height: 360px; }
}
.bottom { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; flex-wrap: wrap-reverse; justify-content: space-between; align-items: flex-start; /* wrap-reverse에서는 flex-start가 아래쪽 */ gap: 10px; pointer-events: none; }
.bottom > * { pointer-events: auto; }
.caption { padding: 9px 16px; font-size: 18px; font-weight: 500; max-width: 720px; text-wrap: balance; }
.graph-card { width: min(480px, 100%); padding: 8px 10px 4px; margin-left: auto; }
.graph-card .gt { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); padding: 0 2px 2px; }
#graph { display: block; width: 100%; height: 128px; }

/* 조작 독 */
.dock { display: flex; flex-wrap: wrap; gap: 8px; }
.dg { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 7px 12px; display: flex; align-items: center; gap: 10px; min-width: 0; flex-wrap: wrap; }
.dg > span { font-size: 12px; color: var(--muted); white-space: nowrap; }
.dg.slider { flex: 1 1 170px; flex-wrap: nowrap; }
.dg.slider label { font-size: 12px; color: var(--muted); white-space: nowrap; display: flex; flex-direction: column; line-height: 1.2; }
.dg.slider output { font: 600 17px var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.dg input[type="range"] { flex: 1; min-width: 90px; accent-color: var(--accent); height: 28px; }
.seg { display: flex; gap: 3px; background: var(--surface-2); border-radius: 9px; padding: 3px; flex-wrap: wrap; }
.seg button, .tg { border: 0; background: transparent; border-radius: 7px; padding: 5px 10px; cursor: pointer; font-size: 14px; font-weight: 500; white-space: nowrap; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px color-mix(in srgb, var(--shadow) 14%, transparent); }
.tgs { display: flex; flex-wrap: wrap; gap: 4px; }
.tg { border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }
.tg[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.tg .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; box-shadow: 0 0 0 1.5px var(--surface); }
.pbtn { border: 0; border-radius: 9px; padding: 7px 14px; font-weight: 700; cursor: pointer; background: var(--accent); color: var(--accent-ink); white-space: nowrap; }
.pbtn.alt { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
.pbtn[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.pbtn.snd[aria-pressed="true"] { background: var(--hi); color: var(--hi-ink); border-color: var(--hi); }

@media (max-width: 720px) {
  h1 { font-size: 18px; }
  .readout { width: 178px; padding: 8px 10px; }
  .ro b { font-size: 15px; } .ro-db b { font-size: 28px; }
  .ro-db { flex-wrap: wrap; row-gap: 4px; }
  .ro.opt, .ro-sep { display: none; }
  .caption { font-size: 15px; }
  .graph-card { display: none; }
  .stage { height: clamp(380px, 62vh, 700px); }
  .playbar .seg, .timenote, #backBtn { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---------- PHONE v1: 휴대폰 세로·가로 ---------- */
.presets, .dock { scrollbar-width: none; }
.presets::-webkit-scrollbar, .dock::-webkit-scrollbar { display: none; }
@media (max-width: 600px) and (orientation: portrait), (max-height: 500px) and (orientation: landscape) {
  html, body { height: 100%; }
  body { overscroll-behavior: none; }
  .app { height: 100vh; height: 100dvh; min-height: 0; gap: 6px;
         padding: max(6px, env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-right, 0px)) max(6px, env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  .topbar { flex: 0 0 auto; gap: 6px 8px; }
  .brand { gap: 6px; }
  .tag { font-size: 11px; padding: 1px 6px; }
  h1 { font-size: 16px; }
  .presets { flex-wrap: nowrap; overflow-x: auto; overscroll-behavior-x: contain; gap: 4px; padding: 1px 0;
             -webkit-mask-image: linear-gradient(90deg, #000 90%, transparent); mask-image: linear-gradient(90deg, #000 90%, transparent); }
  .chip { flex: 0 0 auto; font-size: 13px; padding: 3px 9px 3px 3px; min-height: 30px; }
  .chip b { width: 22px; height: 22px; font-size: 11px; }
  .tools { gap: 4px; }
  .tbtn { padding: 5px 9px; font-size: 13px; min-height: 30px; }
  .stage { height: auto; flex: 1 1 0; min-height: 0; border-radius: 12px; }
  .glass { border-radius: 11px; }
  .playbar { top: 6px; left: 6px; padding: 4px; gap: 4px; }
  .pbtn { padding: 6px 11px; font-size: 14px; min-height: 34px; }
  .playbar .seg, .timenote { display: none; }
  .readout { top: 6px; right: 6px; width: 158px; padding: 6px 9px; gap: 1px; }   /* 폭 고정: 값이 바뀌어도 장면이 움직이지 않게 */
  .ro { font-size: 12px; gap: 6px; } .ro b { font-size: 14px; }
  .ro-cap { font-size: 11px; }
  .ro-db { flex-wrap: nowrap; } .ro-db b { font-size: 24px; } .ro-db small { font-size: 11px; }
  .state { font-size: 12px; padding: 1px 8px; }
  .ro-opt, .ro-x, .ro.opt, .ro-sep { display: none !important; }
  .bottom { left: 6px; right: 6px; bottom: 6px; gap: 6px; }
  .caption { font-size: 13.5px; padding: 6px 11px; line-height: 1.35; word-break: keep-all; }   /* 낱말 가운데서 줄이 바뀌지 않게 */
  .graph-card { display: none; }
  .dock { flex: 0 0 auto; flex-wrap: nowrap; overflow-x: auto; overscroll-behavior-x: contain; gap: 6px; }
  .dg { flex: 0 0 auto; padding: 4px 9px; gap: 7px; border-radius: 10px; flex-wrap: nowrap; }
  .dg.slider { flex: 0 0 auto; width: min(76vw, 300px); }
  .seg { flex-wrap: nowrap; }
  .seg button, .tg { padding: 7px 10px; font-size: 13px; }
  .tgs { flex-wrap: nowrap; }
}
@media (max-width: 600px) and (orientation: portrait) {
  .pbtn { padding: 6px 9px; }                      /* 좁은 화면: 재생 막대가 측정값 카드에 닿지 않게 (T/4 뒤로는 넓은 화면에서처럼 숨김) */
  .brand { flex: 1 1 auto; min-width: 0; }
  .presets { order: 3; flex: 1 0 100%; }          /* 장면 버튼: 둘째 줄, 옆으로 밀기 */
}
@media (max-height: 500px) and (orientation: landscape) {
  .topbar { flex-wrap: nowrap; }                   /* 한 줄: 제목 · 장면 버튼(옆으로 밀기) · 도구 */
  .presets { flex: 1 1 0; min-width: 0; }
  .caption { font-size: 13px; max-width: 58%; }
  #ro[data-mode="wave"] { width: 204px; flex-direction: row; flex-wrap: wrap; align-items: baseline; column-gap: 8px; }   /* 파동 장면: 낮은 화면이라 */
  #ro[data-mode="wave"] .ro { display: none; }     /* 합성파 진폭만, 이름과 값을 한 줄에 */
  .stage[data-mode="motor"] .graph-card { display: block; width: 210px; padding: 4px 8px 2px; }   /* 전동기 장면: 오른쪽 빈자리에 공명 그래프를 작게 */
  .stage[data-mode="motor"] .graph-card .gt { font-size: 11px; padding: 0 2px; }
  .stage[data-mode="motor"] #graph { height: 78px; }
}

<div class="app" id="app">
  <header class="topbar">
    <div class="brand"><span class="tag">Ⅲ-05 정상파</span><h1>정상파 만들기</h1></div>
    <nav class="presets" id="presets" aria-label="수업 장면"></nav>
    <div class="tools">
      <button class="tbtn" id="capBtn" aria-pressed="true" title="C">설명</button>
      <button class="tbtn" id="fsBtn" title="F">전체 화면</button>
    </div>

  <section class="stage" id="stage" aria-label="실험 장면">

      <button class="pbtn alt" id="fwdBtn" title="→" aria-label="T/4 앞으로">T/4 ▶</button>
      <div class="seg" data-seg="speed"><button data-v="0.5">보통</button><button data-v="0.2">느리게</button></div>

      <span class="timenote" id="timenote"></span>

    <div class="glass readout" id="ro" aria-live="polite"></div>
    <div class="bottom">
      <div class="glass caption" id="caption"></div>
      <div class="glass graph-card" id="graphCard" hidden>
        <div class="gt"><span id="gTitle"></span><span id="gUnit"></span></div>
        <canvas id="graph"></canvas>

  <div class="dock">
    <div class="dg" data-only="wave"><div class="tgs">
      <button class="tg" data-tg="red"><i class="dot" style="background:var(--hi)"></i>오른쪽 진행파</button>
      <button class="tg" data-tg="blue"><i class="dot" style="background:var(--lo)"></i>왼쪽 진행파</button>
      <button class="tg" data-tg="sum"><i class="dot" style="background:var(--muted)"></i>합성파</button>
    </div></div>
    <div class="dg" data-only="wave"><div class="tgs">
      <button class="tg" data-tg="nodes"><i class="dot" style="background:var(--nodal)"></i>마디·배</button>
      <button class="tg" data-tg="dots"><i class="dot" style="background:var(--p1)"></i>매질 입자</button>
      <button class="tg" data-tg="crests">마루 표시</button>
      <button class="tg" data-tg="graph">그래프</button>
    </div></div>

    <div class="dg slider" data-only="motor"><label for="Lr">손가락 위치 L<output id="LOut"></output></label><input type="range" id="Lr" min="10" max="66" step="0.5"></div>
    <div class="dg" data-only="motor"><span>전동기</span>
      <div class="seg" data-seg="f"><button data-v="50">50 Hz</button><button data-v="100">100 Hz</button></div>
      <div class="seg" data-seg="view"><button data-v="0">눈으로</button><button data-v="1">느린 화면</button></div>
    </div>
    <div class="dg" data-only="motor"><div class="tgs">
      <button class="tg" data-tg="sweep">자동 훑기</button>
      <button class="tg" data-tg="nodes"><i class="dot" style="background:var(--nodal)"></i>마디·배</button>
      <button class="tg" data-tg="graph">그래프</button>
    </div></div>
  </div>
</div>

<script>
(() => {
'use strict';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

/* ---------- 물리 ----------
   두 진행파: 빨강 y₁ = A sin(kx − ωt) (오른쪽), 파랑 y₂ = A sin(kx + ωt) (왼쪽)
   합성파 y = 2A sin kx · cos ωt → 마디 x = nλ/2, 배의 진폭 2A

  ctx.beginPath(); ctx.moveTo(x - 8, y0); ctx.lineTo(x + 8, y0); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.moveTo(x - 8, y1); ctx.lineTo(x + 8, y1); ctx.stroke();
  ctx.restore();
  if (text) label(text, x + 12, (y0 + y1) / 2, color, 'left', 15);
}

  $$('.chip').forEach((b, i) => b.setAttribute('aria-pressed', String(i === S.preset)));
  $$('[data-only]').forEach(el => { el.hidden = el.dataset.only !== S.mode; });
  $$('[data-tg]').forEach(b => b.setAttribute('aria-pressed', String(!!S[b.dataset.tg])));
  $$('[data-seg]').forEach(sg => sg.querySelectorAll('button').forEach(b => {
    const kk = sg.dataset.seg, v = +b.dataset.v;
    b.setAttribute('aria-pressed', String(kk === 'speed' ? Math.abs(S.speed - v) < 1e-6 : S[kk] === v));
  }));
  $('#playBtn').textContent = S.run ? '❚❚' : '▶';
  const showSteps = S.mode === 'wave' || S.view === 1;
  $('#backBtn').hidden = $('#fwdBtn').hidden = !showSteps;
  $('#playBtn').hidden = S.mode === 'motor' && S.view === 0;
  $('.playbar .seg').hidden = S.mode === 'motor' && S.view === 0;
  $('#capBtn').setAttribute('aria-pressed', String(S.cap));
  $('#sndBtn').setAttribute('aria-pressed', String(S.sound));
  $('#Lr').value = S.L; $('#LOut').textContent = `${S.L.toFixed(1)} cm`;
  $('#graphCard').hidden = !S.graph;
  $('#gTitle').textContent = S.mode === 'motor' ? (PHONE.matches ? 'L에 따른 배의 진폭' : '손가락 위치 L에 따른 배의 진폭 (지나간 자리만)') : '주기 T 동안의 모습';
  stage.dataset.mode = S.mode;                                           // 휴대폰 가로: 전동기 장면에서만 그래프 카드를 작게 살림 (CSS)
  $('#gUnit').textContent = S.mode === 'motor' ? 'cm' : '';
  updateCaption(); measureRO();
  lastRO = ''; readout();
  stage.setAttribute('aria-label', S.mode === 'motor' ? '전동기를 매단 실. 위아래로 끌거나 화살표 키로 손가락 위치를 바꿉니다.' : '두 진행파와 합성파. 화살표 키로 T/4씩 넘깁니다.');
}
function updateCaption() {
  const p = PRESETS[S.preset];
  let cap = p ? p.cap : '';
  if (p && p.quarter) { const q = qIndex(); cap = q === null ? '→ 키를 누르면 T/4씩 넘어간다' : CAPS4[q]; }
  if (p && p.build) cap = CAPSB[phaseB() - 1];
  const el = $('#caption'), hid = !S.cap || !cap;
  if (el.textContent !== cap || el.hidden !== hid) { el.textContent = cap; el.hidden = hid; measureRO(); }
}
function updateBars() {
  let note;
  if (S.mode === 'motor') note = S.view ? `${tLabel()} · 실제보다 ${Math.round(S.f / S.speed)}배 느리게` : '눈으로 보는 모습 (실제 속도)';
  else note = tLabel();
  const tn = $('#timenote'); if (tn.textContent !== note) tn.textContent = note;
}

/* ---------- 이벤트 ---------- */
PHONE.addEventListener('change', () => sync());                         // 휴대폰 세로·가로가 바뀌면 그래프 제목 등 다시
$('#presets').innerHTML = PRESETS.map((p, i) => `<button class="chip" data-p="${i}" title="${i + 1}"><b>${i + 1}</b>${p.label}</button>`).join('');
$('#presets').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (b) applyPreset(+b.dataset.p); });
$$('[data-tg]').forEach(b => b.addEventListener('click', () => { const kk = b.dataset.tg; S[kk] = !S[kk]; if (kk === 'sweep' && S.sweep && S.L >= LMAX - 0.5) S.L = LMIN; sync(); }));
$$('[data-seg]').forEach(sg => sg.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; const kk = sg.dataset.seg, v = +b.dataset.v;
  if (kk === 'speed') S.speed = v;
  else if (kk === 'f') { if (S.f !== v) { S.f = v; clearTrail(); humFreq(); } }
  else if (kk === 'view') { S.view = v; if (v) S.run = true; }
  sync();
}));
$('#playBtn').addEventListener('click', () => { S.run = !S.run; sync(); });
$('#backBtn').addEventListener('click', () => quarter(-1));
$('#fwdBtn').addEventListener('click', () => quarter(1));
$('#sndBtn').addEventListener('click', toggleSound);
function setL(v, snap = true) { S.L = clamp(snap ? Math.round(v * 2) / 2 : v, LMIN, LMAX); $('#Lr').value = S.L; $('#LOut').textContent = `${S.L.toFixed(1)} cm`; }
function stopSweep() { if (S.sweep) { S.sweep = false; $$('[data-tg="sweep"]').forEach(b => b.setAttribute('aria-pressed', 'false')); } }
$('#Lr').addEventListener('input', e => { stopSweep(); setL(+e.target.value); });
$('#capBtn').addEventListener('click', () => { S.cap = !S.cap; sync(); });
$('#fsBtn').addEventListener('click', () => {
  const el = $('#app');
  if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
  else el.requestFullscreen?.().catch(() => {});
});
document.addEventListener('keydown', e => {
  if (e.target.matches?.('input, textarea, select') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === ' ') { e.preventDefault(); S.run = !S.run; sync(); }
  else if (/^[1-9]$/.test(e.key) && +e.key <= PRESETS.length) applyPreset(+e.key - 1);
  else if (e.key === 'f' || e.key === 'F') $('#fsBtn').click();
  else if (e.key === 'c' || e.key === 'C') $('#capBtn').click();
  else if (e.key === 's' || e.key === 'S') toggleSound();
  else if (S.mode === 'motor' && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) { e.preventDefault(); stopSweep(); setL(S.L + (e.key === 'ArrowUp' ? 1 : -1) * (e.shiftKey ? 5 : 0.5)); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    e.preventDefault(); const d = e.key === 'ArrowRight' ? 1 : -1;
    if (S.mode === 'motor' && !S.view) { stopSweep(); setL(S.L + d * (e.shiftKey ? 5 : 0.5)); }
    else quarter(d);
  }
});
const posY = e => { const r = cv.getBoundingClientRect(); return e.clientY - r.top; };
let dragging = false;
cv.addEventListener('pointerdown', e => {
  if (S.mode !== 'motor') return;
  dragging = true; stopSweep(); try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  const G = mgeo(); setL((G.yA - posY(e)) / G.s);
});
cv.addEventListener('pointermove', e => {
  if (S.mode !== 'motor') { cv.style.cursor = 'default'; return; }
  if (dragging) { const G = mgeo(); setL((G.yA - posY(e)) / G.s); }
  else cv.style.cursor = 'ns-resize';
});
cv.addEventListener('pointerup', () => { dragging = false; });
cv.addEventListener('pointercancel', () => { dragging = false; });

function clearTrail() { trail.fill(null); lastIdx = null; }
function recordTrail() {
  const idx = Math.round(S.L * 2);
  if (lastIdx !== null && Math.abs(idx - lastIdx) > 1 && Math.abs(idx - lastIdx) < 40) {
    const st = idx > lastIdx ? 1 : -1;
    for (let i = lastIdx + st; i !== idx; i += st) trail[i] = steadyAmp(i / 2);
  }
  trail[idx] = steadyAmp(S.L); lastIdx = idx;
}

/* ---------- 시작 ---------- */
readTheme(); resize();
let start = 1;
try { const v = parseInt(localStorage.getItem('standing-demo-preset'), 10); if (v >= 0 && v < PRESETS.length) start = v; } catch (err) {}
applyPreset(start);
document.fonts?.ready.then(() => { lastRO = ''; });
let last = performance.now(), tick = 0;
function loop(now) {
  const dt = Math.min(0.25, (now - last) / 1000); last = now;
  if (S.run) S.tau += dt * S.speed;
  if (S.mode === 'motor') {
    const [tR, tI] = target(), a = 1 - Math.exp(-dt / 0.2);              // 실의 감쇠 시간 약 0.2 s
    S.cR += (tR - S.cR) * a; S.cI += (tI - S.cI) * a;
    if (S.sweep) { setL(Math.min(LMAX, S.L + 3 * dt), false); if (S.L >= LMAX) { S.sweep = false; sync(); } }
    recordTrail();
    drawMotorScene();
  } else drawWaves();
  if (S.graph) drawGraphCard();
  updateBars();
  if ((tick = (tick + 1) % 4) === 0) { readout(); updateCaption(); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
