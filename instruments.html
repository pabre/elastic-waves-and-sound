<script>
(() => {
'use strict';
/* 기타: 5번 줄(A2). 개방현 길이 l = 65 cm, 기본 진동수 110 Hz → 줄을 따라 진행하는 파동의 속력 v = 2lf = 143 m/s
   관·병: 교실 20 °C → 공기 중 음속 v = 331.5 + 0.6 × 20 = 343.5 m/s (교과서처럼 끝보정은 무시)
   화면 속 진동은 FD = 0.6 Hz(주기 약 1.7 초)로 느리게 보여 주고, 실제보다 몇 배 느린지 위에 적는다. */
const $ = s => document.querySelector(s);
const L0 = 0.65, F_A = 110, VSTR = 2 * L0 * F_A, TEMP = 20, VAIR = 331.5 + 0.6 * TEMP;
const FD = 0.6, SLOW = 0.4, Q_RES = 10, FG0 = 100, FG1 = 1200, F_SW0 = 120, F_SW1 = 1200, PLUCK_P = 0.18;

const H0 = 0.0025;                                   // 갓 튕긴 5번 줄의 최대 변위 2.5 mm (실제 크기)
const PR = 0.02, PW = 0.0025;                        // 관 안쪽 반지름 2 cm, 유리 두께 2.5 mm
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TIMBRE = {
  pure:   ['순음', [1, 0, 0, 0, 0, 0, 0, 0]],
  flute:  ['플루트형', [1, 0.42, 0.16, 0.07, 0.03, 0.012, 0, 0]],
  violin: ['바이올린형', [1, 0.62, 0.5, 0.34, 0.38, 0.21, 0.17, 0.11]],
  clar:   ['클라리넷형', [1, 0, 0.6, 0, 0.36, 0, 0.2, 0]]

const fdir = x => { const a = (12 + 20 * smooth(clamp((x - 0.2) / 0.125, 0, 1))) * Math.PI / 180; return [-Math.sin(a), -Math.cos(a)]; };   // 손끝 → 손: 위로, 너트 쪽으로 12°(낮은 프렛)…32°(12 프렛, 손목을 돌린다)
function fretHand(G, fx, touch) {                    // fx: 손끝이 닿는 자리 (너트에서 m). 움직이지 않으므로 한 번 그려 둔다.
  const { ppm } = G, tx = G.xN + fx * ppm, ty = G.yc + strY(GT.act, fx) * ppm;
  const key = `${fx.toFixed(5)}|${touch}|${ppm.toFixed(2)}|${G.xN.toFixed(1)}|${G.yc.toFixed(1)}|${IMG.hand ? 1 : 0}`;
  ctx.drawImage(layer('hand', key, () => drawHand(ppm, tx, ty, touch, fdir(fx))), 0, 0, D.w, D.h);
}
function drawHand(ppm, tx, ty, touch, [dx, dy]) {
  const im = IMG.hand; if (!im) return;
  const k = D.dpr, u = HAND.FW / HAND.fw * ppm, phi = Math.atan2(dx, -dy);            // u: 그림 1칸의 화면 크기 (px)

  } else {
    const lab = i => water(i) ? `물 ${cm1(water(i))} cm` : '빈 병';
    h = ro('(가) 공기 기둥 h', `${cm1(hAir(0))} cm`, 0, 1) + ro('(나) 공기 기둥 h', `${cm1(hAir(1))} cm`, 0, 1) + '<div class="ro-sep ro-opt"></div>'
      + `<div class="ro-cap">(가) ${lab(0)}</div>` + big(hz(fBottle(0)), 'Hz') + `<div class="ro-cap">(나) ${lab(1)}</div>` + big(hz(fBottle(1)), 'Hz') + `<div class="ro-f">f = v/4h · 음속은 같다</div>`;
  }
  if (h !== lastRO) { roEl.innerHTML = h; lastRO = h; }
}

/* ---------- 조작 독 ---------- */
const tg = (k, label, dot) => `<button class="tg" data-tg="${k}">${dot ? `<i class="dot" style="background:var(--${dot})"></i>` : ''}${label}</button>`;
const segN = list => `<div class="seg" data-seg="n">${list.map(n => `<button class="num" data-v="${n}">${n}</button>`).join('')}</div>`;
const slider = (id, label, min, max, step) => `<div class="dg slider"><label for="${id}">${label}<output id="${id}Out"></output></label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}"></div>`;
function buildDock() {
  let h = '';
  if (S.scene === 'string') h = slider('fret', '누르는 프렛', 0, 12, 1) + `<div class="dg"><span>진동 n</span>${segN([1, 2, 3, 4, 5, 6])}</div><div class="dg"><button class="pbtn" data-act="pluck" title="Enter">튕기기</button></div><div class="dg"><div class="tgs">${tg('real', '실제 속도')}${tg('comp', '두 파동', 'hi')}${tg('labels', '마디·배', 'nodal')}</div></div>`;
  else if (S.scene === 'open' || S.scene === 'closed') h = slider('Lp', '관 길이 l', 0.1, 0.6, 0.005) + `<div class="dg"><span>진동 n</span>${segN(S.scene === 'closed' ? [1, 3, 5, 7] : [1, 2, 3, 4, 5, 6])}</div><div class="dg"><div class="tgs">${tg('parts', '공기 입자')}${tg('env', '변위 곡선', 'accent')}${tg('labels', '마디·배', 'nodal')}</div></div>`;
  else if (S.scene === 'compare') h = slider('Lc', '같은 길이 l', 0.2, 0.6, 0.01) + `<div class="dg"><span>소리</span><div class="seg" data-seg="cmp"><button data-v="string">현</button><button data-v="open">열린 관</button><button data-v="closed">닫힌 관</button></div></div><div class="dg"><div class="tgs">${tg('labels', '마디·배', 'nodal')}</div></div>`;
  else if (S.scene === 'timbre') h = `<div class="dg"><span>음색</span><div class="seg" data-seg="timbre">${Object.keys(TIMBRE).map(k => `<button data-v="${k}">${TIMBRE[k][0]}</button>`).join('')}</div></div>`;
  else if (S.scene === 'res') h = slider('fd', '스피커 진동수', FG0, FG1, 1) + `<div class="dg"><button class="pbtn" data-act="sweep"></button><button class="pbtn alt" data-act="clear">기록 지우기</button></div><div class="dg"><div class="tgs">${tg('parts', '공기 입자')}${tg('env', '변위 곡선', 'accent')}${tg('labels', '마디·배', 'nodal')}</div></div>`;
  else h = `<div class="dg"><button class="pbtn" data-act="b0" title="Enter">(가) 불기</button><button class="pbtn" data-act="b1">(나) 불기</button></div>${slider('wA', '(가) 물 높이', 0, BOT.wMax, 0.005)}${slider('wB', '(나) 물 높이', 0, BOT.wMax, 0.005)}<div class="dg"><span>계속 소리</span><div class="seg" data-seg="bottle"><button data-v="0">(가)</button><button data-v="1">(나)</button></div></div><div class="dg"><div class="tgs">${tg('bwave', '정상파', 'accent')}</div></div>`;
  const dock = $('#dock');
  if (dock.dataset.scene !== S.scene) { dock.innerHTML = h; dock.dataset.scene = S.scene; }
}
function timenote() {
  if (!S.run) return '일시정지';
  if (S.scene === 'string' && S.real) return '실제 속도 — 너무 빨라 번져 보임';
  if (S.scene === 'timbre') return '기본 220 Hz';
  const f = S.scene === 'string' ? fStr(lStr(), S.n) : S.scene === 'compare' ? (S.cmp === 'string' ? fStr(S.Lc) : fPipe(S.Lc, S.cmp === 'closed'))
    : S.scene === 'res' ? S.fd : S.scene === 'bottle' ? fBottle(S.bottle) : fPipe(S.Lp, S.scene === 'closed', S.n);
  return `화면 속 진동은 실제보다 약 ${Math.round(f / (FD * S.speed)).toLocaleString('ko-KR')}배 느림`;
}
function sync() {
  buildDock();
  $('#presets').querySelectorAll('.chip').forEach((b, i) => b.setAttribute('aria-pressed', String(i === S.preset)));
  document.querySelectorAll('[data-tg]').forEach(b => b.setAttribute('aria-pressed', String(!!S[b.dataset.tg])));
  document.querySelectorAll('[data-seg]').forEach(sg => sg.querySelectorAll('button').forEach(b => {
    const k = sg.dataset.seg, v = b.dataset.v;
    b.setAttribute('aria-pressed', String(k === 'speed' ? S.speed === +v : k === 'n' || k === 'bottle' ? S[k] === +v : S[k] === v));
  }));
  const out = (id, v, t) => { const el = document.getElementById(id); if (el) { el.value = v; document.getElementById(id + 'Out').textContent = t; } };
  out('fret', S.fret, S.fret ? `${S.fret}번 · ${cm1(lStr())} cm` : `개방 · ${cm1(L0)} cm`);
  out('wA', S.wA, S.wA ? `${cm1(S.wA)} cm` : '빈 병'); out('wB', S.wB, S.wB ? `${cm1(S.wB)} cm` : '빈 병');
  out('Lp', S.Lp, `${cm1(S.Lp)} cm`); out('Lc', S.Lc, `${cm1(S.Lc)} cm`); out('fd', Math.round(S.fd), `${Math.round(S.fd)} Hz`);
  const sw = document.querySelector('[data-act="sweep"]'); if (sw) sw.textContent = S.sweep ? '훑기 멈춤' : '자동으로 훑기';
  $('#playBtn').textContent = S.run ? '❚❚' : '▶';
  $('#capBtn').setAttribute('aria-pressed', String(S.cap));
  const cap = S.preset >= 0 ? PRESETS[S.preset].cap : '';
  capEl.textContent = cap; capEl.hidden = !S.cap || !cap;
  $('#sndBtn').setAttribute('aria-pressed', String(S.sound)); $('#sndBtn').textContent = S.sound ? '소리 끄기' : '소리 켜기';
  $('#timenote').textContent = timenote();
  cv.style.touchAction = S.scene === 'bottle' ? 'none' : '';   // 전자칠판·태블릿에서도 수면을 위아래로 끌 수 있게
  updateReadout();
}
function stopPreset() { S.preset = -1; }
function setS(patch) { Object.assign(S, patch); sync(); }
function applyPreset(i) {
  stopAll();
  S.preset = i; Object.assign(S, BASE, PRESETS[i].s); trace.clear(); Object.assign(SW, { armed: true, max: 0, hold: 0 });
  if (S.scene === 'res') S.sweep = false;            // 소리를 켜면 자동으로 훑기 시작
  pluckAge = 0;                                      // 기타 장면은 방금 튕긴 모습으로 시작 (소리는 누를 때만)
  sync();
  try { localStorage.setItem('instr3-preset', String(i)); } catch (err) {}
}
function startSweep() { if (!S.sound) toggleSound(); if (!S.sound) return; if (S.fd >= F_SW1 - 1) { S.fd = F_SW0; trace.clear(); } Object.assign(SW, { armed: resp(S.fd) < 0.4, max: 0, hold: 0 }); setS({ sweep: true }); }

/* ---------- 이벤트 ---------- */
$('#presets').innerHTML = PRESETS.map((p, i) => `<button class="chip" data-p="${i}" title="${i + 1}"><b>${i + 1}</b>${p.label}</button>`).join('');
$('#presets').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (b) applyPreset(+b.dataset.p); });
$('#playBtn').addEventListener('click', () => setS({ run: !S.run }));
$('#sndBtn').addEventListener('click', () => { toggleSound(); if (S.scene === 'res' && S.sound && S.preset === 6 && !trace.size) startSweep(); });
$('#capBtn').addEventListener('click', () => setS({ cap: !S.cap }));
$('#fsBtn').addEventListener('click', () => {
  const el = $('#app');
  if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
  else el.requestFullscreen?.().catch(() => {});
});
document.addEventListener('fullscreenchange', () => { $('#fsBtn').textContent = document.fullscreenElement ? '전체 화면 끝' : '전체 화면'; });
stage.addEventListener('click', e => {
  const sg = e.target.closest('[data-seg="speed"]'); if (!sg) return;
  const b = e.target.closest('button'); if (b) setS({ speed: +b.dataset.v });
});
$('#dock').addEventListener('click', e => {
  const t = e.target.closest('[data-tg]');
  if (t) { const k = t.dataset.tg; const p = { [k]: !S[k] }; if (k === 'comp' && p.comp) p.real = false; if (k === 'real' && p.real) p.comp = false; setS(p); return; }
  const b = e.target.closest('[data-seg] button');
  if (b) {
    const k = b.parentElement.dataset.seg, v = b.dataset.v; stopPreset();
    if (k === 'n') { setS({ n: +v, fret: +v > 1 ? 0 : S.fret }); pluckAge = 0; repluck(); }   // 하모닉스는 개방현의 l/n 자리에 살짝 댄다
    else if (k === 'bottle') { setS({ bottle: +v }); if (!S.sound) toggleSound(); }
    else { setS({ [k]: v }); if (k === 'cmp') repluck(); }
    return;
  }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'pluck') pluck();
  else if (act === 'sweep') { stopPreset(); if (S.sweep) setS({ sweep: false }); else startSweep(); }
  else if (act === 'clear') { trace.clear(); Object.assign(SW, { armed: resp(S.fd) < 0.4, max: 0 }); }
  else if (act === 'b0' || act === 'b1') blowBottle(+act[1]);
});
$('#dock').addEventListener('input', e => {
  const id = e.target.id, v = +e.target.value;
  if (id === 'wA' || id === 'wB') { setWater(id === 'wB' ? 1 : 0, v); return; }   // 물 높이: 장면 설명은 그대로 둔다
  stopPreset();
  if (id === 'fret') { setS({ fret: v, n: v > 0 ? 1 : S.n }); pluckAge = 0; repluck(); }   // 손가락은 하나: 누르면 기본 진동으로
  else if (id === 'Lp') setS({ Lp: v });
  else if (id === 'Lc') { setS({ Lc: v }); repluck(); }
  else if (id === 'fd') { setS({ fd: v, sweep: false }); SW.hold = 0; }
});
cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  if (S.scene === 'string') { const G = HIT.guitar; if (G && x > G.x0 && x < G.x1 && y > G.y0 && y < G.y1) pluck(); }
  else if (S.scene === 'bottle') {
    const g = grabWater(x, y);
    if (g >= 0) { const b = HIT.bottles[g]; drag = { i: g, dy: y - b.yw }; try { cv.setPointerCapture(e.pointerId); } catch (err) {} startPour(g); e.preventDefault(); }
    else { const i = HIT.bottles.findIndex(b => b && x > b.x0 && x < b.x1); if (i >= 0) blowBottle(i); }
  }
  else if (S.scene === 'compare') { const row = HIT.rows.find(q => y > q.y0 && y < q.y1 && x > q.x0 && x < q.x1); if (row) { stopPreset(); setS({ cmp: row.kind }); repluck(); } }
});
function grabWater(x, y) {                           // 손잡이나 수면 근처를 누르면 물 높이를 끈다
  return S.scene !== 'bottle' ? -1 : HIT.bottles.findIndex(b => b && (Math.hypot(x - b.hx, y - b.yw) < b.hit || (Math.abs(y - b.yw) < b.hitY && Math.abs(x - b.cx) < b.rl + 6)));
}
cv.addEventListener('pointermove', e => {
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  if (drag) { const b = HIT.bottles[drag.i]; setWater(drag.i, BOT.H - (y - drag.dy - b.y0) / b.pxm); return; }
  let c = '';
  if (grabWater(x, y) >= 0) c = 'ns-resize';
  else if (S.scene === 'bottle' && HIT.bottles.some(b => b && x > b.x0 && x < b.x1)) c = 'pointer';
  else if (S.scene === 'string' && HIT.guitar && x > HIT.guitar.x0 && x < HIT.guitar.x1 && y > HIT.guitar.y0 && y < HIT.guitar.y1) c = 'pointer';
  if (cv.style.cursor !== c) cv.style.cursor = c;
});
const endDrag = () => { if (drag) { drag = null; stopPour(); } };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag); cv.addEventListener('lostpointercapture', endDrag);
$('#dock').addEventListener('pointerdown', e => { if (e.target.id === 'wA' || e.target.id === 'wB') startPour(e.target.id === 'wB' ? 1 : 0); });
addEventListener('pointerup', () => { if (!drag) stopPour(); }); addEventListener('pointercancel', () => { if (!drag) stopPour(); });
document.addEventListener('keydown', e => {
  if (e.target.matches?.('input, textarea, select')) return;
  if (e.key === ' ') { e.preventDefault(); setS({ run: !S.run }); }
  else if (/^[1-9]$/.test(e.key) && +e.key <= PRESETS.length) applyPreset(+e.key - 1);
  else if (e.key === 'f' || e.key === 'F') $('#fsBtn').click();
  else if (e.key === 'c' || e.key === 'C') $('#capBtn').click();
  else if (e.key === 'Enter' && !e.target.matches?.('button, a')) {
    if (S.scene === 'string' || S.scene === 'compare' && S.cmp === 'string') pluck();
    else if (S.scene === 'bottle') blowBottle(S.bottle);
  }
});

/* ---------- 시작 ---------- */
resize();
let startP = 0;
try { startP = +(localStorage.getItem('instr3-preset') || 0) || 0; } catch (err) {}
applyPreset(clamp(startP, 0, PRESETS.length - 1));
document.fonts?.ready.then(() => { lastRO = ''; updateReadout(); for (const k in LAYER) LAYER[k].key = ''; });
let last = performance.now(), tick = 0, lastFi = null;
function loop(now) {
  const raw = clamp((now - last) / 1000, 0, 0.5), dt = Math.min(0.05, raw); last = now;   // 첫 프레임의 시각은 시작 시각보다 이를 수 있다 (음수가 되면 안 됨)
  if (S.run) { theta += 2 * Math.PI * FD * S.speed * (S.scene === 'string' && S.real ? 6 : 1) * dt; pluckAge += raw; }
  if (S.sweep && S.scene === 'res' && S.sound) {     // 소리가 커질수록 천천히 → 봉우리를 지나면 돌아와 잠시 머문다
    if (SW.hold > 0) { SW.hold -= raw; if (SW.hold <= 0) S.fd = SW.resume; }
    else {
      const a = resp(S.fd); S.fd = Math.min(F_SW1, S.fd + 60 * (1 - 0.85 * a) * raw);
      const a2 = resp(S.fd);
      if (!SW.armed) { if (a2 < 0.4) Object.assign(SW, { armed: true, max: 0 }); }
      else if (a2 > SW.max) { SW.max = a2; SW.maxF = S.fd; }
      else if (SW.max > 0.8 && a2 < SW.max * 0.88) { SW.resume = S.fd; S.fd = SW.maxF; SW.hold = 1.2; SW.armed = false; }
      if (S.fd >= F_SW1) S.sweep = false;
    }
  }
  if (S.scene === 'res' && S.sound) { const f = Math.round(S.fd); if (lastFi !== null && Math.abs(f - lastFi) <= 80) for (let q = Math.min(f, lastFi); q <= Math.max(f, lastFi); q++) trace.set(q, dBof(resp(q))); trace.set(f, dBof(resp(f))); lastFi = f; } else lastFi = null;
  try { draw(); } catch (e) { if (!loop.warned) { loop.warned = true; console.error(e); } cv.width = cv.width; }   // 한 번의 오류로 그림이 멈추지 않게
  updateAudio(now);
  if ((tick = (tick + 1) % 4) === 0) {
    $('#timenote').textContent = timenote();
    if (S.scene === 'res') { updateReadout(); const o = document.getElementById('fdOut'); if (o) { o.textContent = `${Math.round(S.fd)} Hz`; $('#fd').value = Math.round(S.fd); } const sw = document.querySelector('[data-act="sweep"]'); if (sw) sw.textContent = S.sweep ? '훑기 멈춤' : '자동으로 훑기'; }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
