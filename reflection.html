function drawKnot(G, x, y, m) {
  const { k } = G, a = ROPES[S.r1], b = ROPES[S.r2], wa = a.w * k, wb = b.w * k, big = Math.max(wa, wb), sm = Math.min(wa, wb);

    rope(p, wd * 0.85, key, 1e3);
    ctx.fillStyle = T[key + '-lo']; ctx.beginPath(); ctx.ellipse(x + dx, y + r * 1.45, wd * 0.4, wd * 0.28, 0.3, 0, 2 * Math.PI); ctx.fill();
  };

  const gr = ctx.createRadialGradient(x - r * 0.4, y - r * 0.5, 1, x, y, r * 1.35);
  gr.addColorStop(0, T[kb + '-hi']); gr.addColorStop(0.45, T[kb]); gr.addColorStop(1, T[kb + '-lo']);
  shadowed(() => { ctx.fillStyle = gr; ctx.beginPath(); ctx.ellipse(x, y, r * 1.2, r * 0.98, 0, 0, 2 * Math.PI); ctx.fill(); }, 10, 6, 3, 0.3);
  ctx.strokeStyle = T[kb + '-lo']; ctx.globalAlpha = 0.5; ctx.lineWidth = Math.max(1, big * 0.08);
  ctx.beginPath(); ctx.ellipse(x + r * 0.05, y + r * 0.02, r * 0.75, r * 0.5, 0, 0, 2 * Math.PI); ctx.stroke(); ctx.globalAlpha = 1;

function wallTexture(xw, floorY) {
  const W = Math.max(1, Math.ceil((D.w - xw) * D.dpr)), H = Math.max(1, Math.ceil(floorY * D.dpr)), key = `${W}x${H}x${T.brick}`;

  x.fillStyle = T.mortar; x.fillRect(0, 0, W, H);
  const bh = 30 * k * s, bw = 74 * k * s, gap = 2.4 * s;

  for (let y = H, r = 0; y > -bh; y -= bh, r++) {

      x.fillStyle = A(T.spec, .18); x.fillRect(x0 + gap, y - bh + gap / 2, bw - 2 * gap, 1.2 * s);
      x.fillStyle = A(T.shadow, .14); x.fillRect(x0 + gap, y - gap / 2 - 1.4 * s, bw - 2 * gap, 1.4 * s);

  if (cur) trace(cur, SW.on ? SW.p * K.tMax : K.tMax, 1, true);
  if (SW.on) { const xx = Xt(SW.p * K.tMax); ctx.fillStyle = T['scope-trace']; ctx.globalAlpha = 0.12; ctx.fillRect(xx - 10, Tt, 10, B - Tt); ctx.globalAlpha = 1; }
  const boxes = [];                                                   // 두 반사파 시각 글자가 겹치면 아래 줄로
  if (S.last && !SW.on) for (const e of S.last.echoes) {
    if (e.amp < 0.1) continue;
    const xx = Xt(e.t), col = e.type === 'flaw' ? T.heat : T['scope-ink'];
    ctx.strokeStyle = col; ctx.globalAlpha = 0.75; ctx.setLineDash([4, 4]); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(xx, Tt); ctx.lineTo(xx, B); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
    ctx.font = `600 15px ${T.mono}`; ctx.fillStyle = col;
    const txt = `${e.t.toFixed(1)} μs`, tw = ctx.measureText(txt).width, tx = xx > R - 90 ? xx - 6 - tw : xx + 6;
    let ty = Tt + 4;
    while (boxes.some(b => b[1] === ty && tx < b[0] + b[2] + 8 && b[0] < tx + tw + 8)) ty += 19;
    boxes.push([tx, ty, tw]);
    ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillText(txt, tx, ty);
  }
  if (!cur) { ctx.font = `500 15px ${T.font}`; ctx.fillStyle = T['scope-ink']; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('초음파를 보내세요', L + pw / 2, Tt + ph / 2); }
  ctx.fillStyle = lin(sx, sy, sx + sw * 0.6, sy + sh, [[0, A(T.spec, .09)], [0.45, A(T.spec, 0)]]); ctx.fillRect(sx, sy, sw, sh);
  ctx.restore();
  // 오른쪽 조작부: 다이얼과 버튼
  if (cw) {
    const cx0 = x + w - pad - cw + 14, cxm = cx0 + (cw - 14) / 2, kr = Math.min((cw - 14) * 0.36, sh * 0.17), ky = sy + kr + 6;
    shadowed(() => { ctx.fillStyle = metalGrad(cxm - kr, cxm + kr, ky - kr, ky + kr); ctx.beginPath(); ctx.arc(cxm, ky, kr, 0, 2 * Math.PI); ctx.fill(); }, 8, 4, 3, 0.4);
    ctx.strokeStyle = A(T.shadow, .25); ctx.lineWidth = 1;
    for (let i = 0; i < 28; i++) { const a = i / 28 * 2 * Math.PI; ctx.beginPath(); ctx.moveTo(cxm + Math.cos(a) * kr * 0.84, ky + Math.sin(a) * kr * 0.84); ctx.lineTo(cxm + Math.cos(a) * kr, ky + Math.sin(a) * kr); ctx.stroke(); }
    ctx.fillStyle = lin(cxm - kr, ky - kr, cxm + kr, ky + kr, [[0, T['metal-hi']], [1, T.metal]]); ctx.beginPath(); ctx.arc(cxm, ky, kr * 0.7, 0, 2 * Math.PI); ctx.fill();
    ctx.strokeStyle = T.case; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(cxm, ky); ctx.lineTo(cxm + kr * 0.5, ky - kr * 0.45); ctx.stroke();
    const bw = (cw - 14) * 0.42, bh = Math.min(22, sh * 0.1), gy = ky + kr + 16;
    for (let j = 0; j < 3; j++) for (let i = 0; i < 2; i++) {
      const bx0 = cx0 + i * (cw - 14 - bw), by0 = gy + j * (bh + 10);
      if (by0 + bh > sy + sh) continue;
      shadowed(() => { ctx.fillStyle = lin(0, by0, 0, by0 + bh, [[0, T['case-hi']], [1, T.case]]); ctx.beginPath(); ctx.roundRect(bx0, by0, bw, bh, 5); ctx.fill(); }, 3, 2, 1, 0.45);
      ctx.strokeStyle = T.spec; ctx.globalAlpha = 0.18; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(bx0 + 4, by0 + 1); ctx.lineTo(bx0 + bw - 4, by0 + 1); ctx.stroke(); ctx.globalAlpha = 1;
    }
  }
}

/* ---------- 측정값 카드 ---------- */
let lastRO = '';
function readout() {
  let h;
  const fmtCm = v => `${v < -0.0005 ? '−' : ''}${Math.abs(v * 100).toFixed(1)}`;
  if (S.mode === 'rope') {
    const c = coef(), sp = split(), none = Math.abs(c.R) < 0.003;
    const n2 = S.r2 in ROPES ? ROPES[S.r2].name : ENDS[S.r2];
    const st = !sp || none ? '' : c.R < 0 ? 'minus' : 'plus';
    h = `<div class="ro ro-opt ${ROPES[S.r1].c}"><span>${ROPES[S.r1].name}</span><b>${v1()} m/s</b></div>
      <div class="ro ro-opt ${S.r2 in ROPES ? ROPES[S.r2].c : ''}"><span>${n2}</span><b>${c.v2 ? `${c.v2} m/s` : S.r2 === 'wall' ? '고정' : '자유'}</b></div>
      <div class="ro opt"><span>입사파</span><b>20.0 cm</b></div>
      <div class="ro-sep"></div>
      <div class="ro-cap">반사파</div>
      <div class="ro-db"><b>${!sp ? '?' : none ? '0' : fmtCm(c.R * AMP)}</b><small>${sp && !none ? 'cm' : ''}</small><span class="state" data-s="${st}" ${st ? '' : 'hidden'}>${st === 'minus' ? '뒤집힘' : '그대로'}</span></div>
      <div class="ro opt"><span>위상 변화</span><b>${!sp ? '?' : none ? '—' : c.R < 0 ? '180°' : '0°'}</b></div>
      <div class="ro"><span>투과파</span><b>${!c.v2 ? '—' : sp ? `${fmtCm(c.tau * AMP)} cm` : '?'}</b></div>`;
  } else {
    const e = mainEcho(S.last);
    h = `<div class="ro ro-opt"><span>탐촉자 위치</span><b>${S.probeX} mm</b></div>
      <div class="ro opt"><span>강철 속 음속 v</span><b>6000 m/s</b></div>
      <div class="ro"><span>반사파 시간 t</span><b>${e ? e.t.toFixed(1) + ' μs' : '—'}</b></div>
      <div class="ro-sep"></div>
      <div class="ro-cap">깊이 d = vt ÷ 2</div>
      <div class="ro-db"><b>${e ? (K.v * e.t / 2).toFixed(1) : '—'}</b><small>mm</small><span class="state" data-s="${e && e.type === 'flaw' ? 'flaw' : 'plus'}" ${e ? '' : 'hidden'}>${e && e.type === 'flaw' ? '결함' : '바닥면'}</span></div>`;
  }
  if (h !== lastRO) {
    $('#ro').innerHTML = h; lastRO = h;
    measureOverlays();
  }
}

/* ---------- 동기화 ---------- */
function sync() {
  $$('.chip').forEach((b, i) => b.setAttribute('aria-pressed', String(i === S.preset)));
  const pr = $('#presets'), on = pr.children[S.preset];                // 휴대폰: 장면 버튼 줄이 옆으로 넘치면 고른 버튼이 보이게 민다
  if (on && pr.scrollWidth > pr.clientWidth + 1) {
    const a = pr.getBoundingClientRect(), b = on.getBoundingClientRect(), edge = a.right - a.width * 0.12;
    if (b.left < a.left + 4) pr.scrollLeft -= a.left + 28 - b.left; else if (b.right > edge) pr.scrollLeft += b.right - edge + 4;
  }
  $$('[data-for]').forEach(el => { el.hidden = el.dataset.for !== S.mode; });
  $$('[data-seg]').forEach(sg => sg.querySelectorAll('button').forEach(b => {
    const k = sg.dataset.seg, on = k === 'rate' ? Math.abs(S.rate - +b.dataset.v) < 1e-6 : S[k] === b.dataset.v;
    b.setAttribute('aria-pressed', String(on));
  }));
  $$('[data-tg]').forEach(b => b.setAttribute('aria-pressed', String(!!S[b.dataset.tg])));
  $('#capBtn').setAttribute('aria-pressed', String(S.cap));
  $('#sndBtn').setAttribute('aria-pressed', String(S.sound));
  $('#tline').max = String(tEnd());
  $('#probeX').value = S.probeX; $('#pxOut').textContent = `${S.probeX} mm`;
  const p = S.preset >= 0 ? PRESETS[S.preset] : null;
  $('#caption').textContent = p ? p.cap : ''; $('#caption').hidden = !S.cap || !p;
  measureOverlays();
  lastRO = ''; readout();
  stage.setAttribute('aria-label', S.mode === 'rope' ? `${ROPES[S.r1].name}에서 ${S.r2 in ROPES ? ROPES[S.r2].name : ENDS[S.r2]}(으)로 가는 펄스. 손을 누르거나 Enter 키로 튕깁니다.` : '강철 블록과 초음파 탐상기. 블록 위를 누르거나 화살표 키로 탐촉자를 옮깁니다.');
  lastRO = '';
}
function stopPreset() { if (S.preset !== -1) { S.preset = -1; sync(); } }
const fmtSlow = n => n >= 1e4 ? `${+(n / 1e4).toFixed(1)}만` : String(Math.round(n));
function updateBars() {
  const pb = $('#playBtn');
  let t;
  if (S.mode === 'scan') t = S.run ? '❚❚' : '▶';
  else t = S.t < 0 || S.t >= tEnd() - 1e-6 ? '↺' : S.paused ? '▶' : '❚❚';
  if (pb.textContent !== t) pb.textContent = t;
  const note = S.mode === 'rope' ? `t = ${Math.max(0, S.t).toFixed(2)} s${S.rate < 1 ? ` · ${Math.round(1 / S.rate)}배 느리게` : ''}`
    : SW.on ? `t = ${(SW.p * K.tMax).toFixed(1)} μs · ${fmtSlow(SLOW)} 배 느리게` : (S.run ? '자동 반복' : '멈춤');
  const tn = $('#timenote'); if (tn.textContent !== note) tn.textContent = note;
  $('#tOut').textContent = `${Math.max(0, S.t).toFixed(2)} s`;
  const tl = $('#tline'); if (document.activeElement !== tl) tl.value = Math.max(0, S.t);
}

/* ---------- 이벤트 ---------- */
$('#presets').innerHTML = PRESETS.map((p, i) => `<button class="chip" data-p="${i}" title="${i + 1}"><b>${i + 1}</b>${p.label}</button>`).join('');
$('#presets').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (b) applyPreset(+b.dataset.p); });
$('#flickBtn').addEventListener('click', flick);
$('#pingBtn').addEventListener('click', () => ping());
$('#playBtn').addEventListener('click', togglePlay);
function toggleSound() { S.sound = !S.sound; if (S.sound) { if (!audioReady()) S.sound = false; } else hush(); sync(); }
$('#sndBtn').addEventListener('click', toggleSound);
$$('[data-seg]').forEach(sg => sg.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; const k = sg.dataset.seg;
  if (k === 'rate') { S.rate = +b.dataset.v; sync(); return; }
  stopPreset(); S[k] = b.dataset.v; S.t = -1; sync(); flick();
}));
$$('[data-tg]').forEach(b => b.addEventListener('click', () => { const k = b.dataset.tg; S[k] = !S[k]; sync(); }));
$('#tline').addEventListener('input', e => { S.t = +e.target.value; S.paused = true; });
$('#probeX').addEventListener('input', e => moveProbe(+e.target.value, true));
$('#newBtn').addEventListener('click', () => { newFlaw(); S.scans = []; S.last = null; ghosts.length = 0; S.flaw = false; SW.on = false; SW.wait = 0.3; sync(); });
$('#capBtn').addEventListener('click', () => { S.cap = !S.cap; sync(); });
$('#fsBtn').addEventListener('click', () => {
  const el = $('#app');
  if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
  else el.requestFullscreen?.().catch(() => {});
});
document.addEventListener('keydown', e => {
  if (e.target.matches?.('input, textarea, select') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'Enter' && !e.target.matches?.('button')) { e.preventDefault(); S.mode === 'rope' ? flick() : ping(); }
  else if (/^[1-9]$/.test(e.key) && +e.key <= PRESETS.length) applyPreset(+e.key - 1);
  else if (e.key === 'f' || e.key === 'F') $('#fsBtn').click();
  else if (e.key === 'c' || e.key === 'C') $('#capBtn').click();
  else if (e.key === 's' || e.key === 'S') toggleSound();
  else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    e.preventDefault(); const d = e.key === 'ArrowRight' ? 1 : -1;
    if (S.mode === 'rope') stepTime(d * (e.shiftKey ? 0.1 : 0.02));
    else moveProbe(S.probeX + d * (e.shiftKey ? 10 : 2), true);
  }
});

function ping() {
  if (S.mode !== 'scan') return;
  SW.on = true; SW.p = reduce ? 0.999 : 0; SW.x = S.probeX; SW.rec = { x: S.probeX, echoes: echoes(S.probeX) }; SW.fired = 0;
  if (!reduce) sfxPing();
}
// 같은 자리(1 mm 단위)의 기록만 바꾼다. (예전에는 ±1 mm 이웃까지 지워서, 천천히 끌면 기록이 남지 않고 탐촉자 밑의 점 하나만 따라다녔다)
function addScan(rec) { S.scans = S.scans.filter(s => s.x !== rec.x).concat(rec); if (S.scans.length > K.W + 1) S.scans.shift(); }
function finishSweep() {
  SW.on = false;
  if (S.last && S.last.x !== SW.rec.x) { ghosts.push(S.last); if (ghosts.length > 3) ghosts.shift(); }
  S.last = SW.rec; addScan(SW.rec);
}
// 탐촉자를 옮기면 실제 장비처럼 곧바로 A-스캔과 반사된 곳 기록이 갱신된다 (초당 수백 번 쏨). 멈추면 느린 화면 반복이 다시 시작된다.
// slide = 블록 위를 미끄러져 지나감(끌기·슬라이더·화살표): 지나간 자리도 모두 기록한다. 클릭은 탐촉자를 들어 옮긴 것으로 본다.
function moveProbe(x, slide = false) {
  x = clamp(Math.round(x), 0, K.W);
  if (x === S.probeX && S.last && S.last.x === x) return;
  if (slide) for (let i = S.probeX; i !== x; i += Math.sign(x - S.probeX)) addScan({ x: i, echoes: echoes(i) });
  S.probeX = x; SW.on = false; ghosts.length = 0;
  const rec = { x, echoes: echoes(x) }; S.last = rec; addScan(rec); SW.wait = 0.9;
  $('#probeX').value = x; $('#pxOut').textContent = `${x} mm`;
}
const posOf = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
let dragging = false;
const onBlock = (G, px, py) => px >= G.bx - 24 && px <= G.bx + G.bw + 24 && py >= G.by - 140 && py <= G.by + G.bh + 24;
cv.addEventListener('pointerdown', e => {
  const [px, py] = posOf(e);
  if (S.mode === 'scan') {
    const G = ngeo();
    if (onBlock(G, px, py)) { dragging = true; try { cv.setPointerCapture(e.pointerId); } catch (err) {} moveProbe((px - G.bx) / G.bw * K.W); }
    return;
  }
  const G = rgeo(); if (Math.hypot(px - G.X(0), py - G.Y(yAt(0, S.t))) < 80 || px < G.X(0) + 24) flick();
});
cv.addEventListener('pointermove', e => {
  const [px, py] = posOf(e);
  if (dragging) { const G = ngeo(); moveProbe((px - G.bx) / G.bw * K.W, true); return; }
  if (S.mode === 'rope') { const G = rgeo(); cv.style.cursor = Math.hypot(px - G.X(0), py - G.Y(yAt(0, S.t))) < 80 ? 'pointer' : 'default'; }
  else cv.style.cursor = onBlock(ngeo(), px, py) ? 'ew-resize' : 'default';
});
cv.addEventListener('pointerup', () => { dragging = false; });
cv.addEventListener('pointercancel', () => { dragging = false; });

/* ---------- 시작 ---------- */
newFlaw(); readTheme(); resize();
let start = 1;
try { const v = parseInt(localStorage.getItem('reflect-demo-preset'), 10); if (v >= 0 && v < PRESETS.length) start = v; } catch (err) {}
applyPreset(start);
document.fonts?.ready.then(() => { lastRO = ''; });
let last = performance.now(), tick = 0;
function loop(now) {
  requestAnimationFrame(loop);                                        // 먼저 다음 프레임을 예약: 한 프레임에서 오류가 나도 화면이 멈추지 않게
  const dt = Math.min(0.25, (now - last) / 1000); last = now;
  if (S.mode === 'rope') {
    if (!S.paused && S.t >= 0 && S.t < tEnd()) S.t = Math.min(tEnd(), S.t + dt * S.rate);
    drawRope();
  } else {
    if (SW.on) {
      SW.p += dt / K.sweep;
      const es = SW.rec.echoes;
      while (SW.fired < es.length && SW.p * K.tMax >= es[SW.fired].t) { const e = es[SW.fired++]; if (e.amp > 0.1) sfxPing(0.2 * e.amp, 0.07); }
      if (SW.p >= 1) { SW.p = 1; finishSweep(); SW.wait = K.gap; }
    }
    else if (S.run) { SW.wait -= dt; if (SW.wait <= 0) ping(); }
    else if (SW.wait > 0) { SW.wait -= dt; if (SW.wait <= 0) ping(); }
    drawScan();
  }
  updateBars();
  if ((tick = (tick + 1) % 4) === 0) readout();
}
requestAnimationFrame(loop);
})();
</script>
