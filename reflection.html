<title>반사와 투과 실험실</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>

  --ink: #141c25;
  --muted: #5a6573;
  --line: #d3dae2;
  --accent: #0b6b70;
  --accent-ink: #ffffff;
  --hi: #e2553f;
  --hi-ink: #ffffff;
  --lo: #2c6fd4;
  --heat: #f0a20f;
  --nodal: #6a3fd6;
  --anti: #17955a;
  --stage: #dfe5ea;
  --stage-a: #f3f6f8; --stage-b: #dce3e9;
  --floor-a: #d6dbd4; --floor-b: #c8cec6;
  --r1: #1d8a8c; --r1-lo: #0b4c4f; --r1-hi: #93ddd7;
  --r2: #c8701f; --r2-lo: #74390a; --r2-hi: #f7c387;
  --r3: #8a6440; --r3-lo: #3e2a16; --r3-hi: #d8b688;
  --skin: #e8bf98; --skin-lo: #b0784f; --skin-hi: #f8dcc0; --nail: #f2c9bf;
  --sleeve: #3d6fb6; --sleeve-lo: #22457c; --sleeve-hi: #6e9bd8;
  --metal-hi: #f7f9fb; --metal: #a9b3bd; --metal-lo: #5b6671;
  --iron: #3d454e; --iron-hi: #6a747f;
  --brick: #d9cbb9; --brick-lo: #b19d86; --mortar: #ece4d8;
  --wood: #dcb781; --wood-lo: #a97f48; --wood-ink: #4a3215;
  --steel-hi: #eef1f4; --steel: #b5bec8; --steel-lo: #7a8590;
  --case: #2a3037; --case-hi: #4b545e; --bumper: #eaa823; --bumper-lo: #a8700d;
  --cable: #1c2228; --cable-hi: #66717c;
  --scope-bg: #0c181a; --scope-grid: #1d3637; --scope-trace: #52f2b4; --scope-ink: #8fd3bf;
  --shadow: #0b1520; --spec: #ffffff;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1116; --surface: #161c23; --surface-2: #1d252e; --ink: #e6ebf0; --muted: #98a4b0; --line: #2b3540;
    --accent: #3fc0b5; --accent-ink: #0d1116;
    --hi: #ff7461; --hi-ink: #0d1116; --lo: #5d9cff; --heat: #ffbb33; --nodal: #b08cff; --anti: #4fd389;
    --stage: #12171d; --stage-a: #1a222b; --stage-b: #10161c; --floor-a: #232a31; --floor-b: #1a2027;
    --r1: #33b2ae; --r1-lo: #0f5355; --r1-hi: #aaf1ea; --r2: #e48a3a; --r2-lo: #80420c; --r2-hi: #ffd09c; --r3: #ab8257; --r3-lo: #45301c; --r3-hi: #e6c498;
    --skin: #d2a47c; --skin-lo: #8a5c3c; --skin-hi: #e8c4a2; --nail: #e2b4aa;
    --sleeve: #4f86d1; --sleeve-lo: #2a548f; --sleeve-hi: #7fa9e2;
    --metal-hi: #e3e9ee; --metal: #87939f; --metal-lo: #38424c;
    --iron: #2a3037; --iron-hi: #545e69;
    --brick: #48413a; --brick-lo: #2c2722; --mortar: #5a524a;
    --wood: #8d6c43; --wood-lo: #5b4329; --wood-ink: #f6e7cc;
    --steel-hi: #c3ccd5; --steel: #707c88; --steel-lo: #39424b;
    --case: #1d2228; --case-hi: #3c444d; --bumper: #c98d18; --bumper-lo: #7c5409;

  }
}
:root[data-theme="dark"] {
  --bg: #0d1116; --surface: #161c23; --surface-2: #1d252e; --ink: #e6ebf0; --muted: #98a4b0; --line: #2b3540;
  --accent: #3fc0b5; --accent-ink: #0d1116;
  --hi: #ff7461; --hi-ink: #0d1116; --lo: #5d9cff; --heat: #ffbb33; --nodal: #b08cff; --anti: #4fd389;

  --r1: #33b2ae; --r1-lo: #0f5355; --r1-hi: #aaf1ea; --r2: #e48a3a; --r2-lo: #80420c; --r2-hi: #ffd09c; --r3: #ab8257; --r3-lo: #45301c; --r3-hi: #e6c498;
  --skin: #d2a47c; --skin-lo: #8a5c3c; --skin-hi: #e8c4a2; --nail: #e2b4aa;
  --sleeve: #4f86d1; --sleeve-lo: #2a548f; --sleeve-hi: #7fa9e2;
  --metal-hi: #e3e9ee; --metal: #87939f; --metal-lo: #38424c;
  --iron: #2a3037; --iron-hi: #545e69;
  --brick: #48413a; --brick-lo: #2c2722; --mortar: #5a524a;
  --wood: #8d6c43; --wood-lo: #5b4329; --wood-ink: #f6e7cc;
  --steel-hi: #c3ccd5; --steel: #707c88; --steel-lo: #39424b;
  --case: #1d2228; --case-hi: #3c444d; --bumper: #c98d18; --bumper-lo: #7c5409;

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  min-height: 100vh; display: flex; flex-direction: column; gap: 10px;
  padding-block: 10px 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bg);
}
.app:fullscreen { padding-block: 12px; }

/* 상단 바 */
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.tag { font: 500 12px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 520px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px 4px 4px; cursor: pointer; font-size: 13.5px; font-weight: 500; white-space: nowrap; transition: background .15s, border-color .15s; }
.chip b { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font: 600 12px var(--mono); }
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.chip[aria-pressed="true"] b { background: var(--accent); color: var(--accent-ink); }
.tools { display: flex; gap: 6px; margin-left: auto; }
.tbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 6px 12px; cursor: pointer; font-size: 14px; font-weight: 500; white-space: nowrap; }
.tbtn:hover { border-color: var(--muted); }
.tbtn[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

/* 무대 */
.stage { position: relative; flex: 1 1 auto; height: clamp(420px, calc(100vh - 200px), 1100px); border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: var(--stage); }
.app:fullscreen .stage { height: auto; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.glass { background: color-mix(in srgb, var(--surface) 86%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border: 1px solid color-mix(in srgb, var(--line) 85%, transparent); border-radius: 14px; box-shadow: 0 8px 28px color-mix(in srgb, var(--shadow) 10%, transparent); }
.readout { position: absolute; top: 12px; right: 12px; width: 236px; padding: 12px 14px 12px; display: flex; flex-direction: column; gap: 3px; }
.ro { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 13px; color: var(--muted); }
.ro b { font: 500 18px var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.ro.r1 span { color: var(--r1); font-weight: 700; } .ro.r2 span { color: var(--r2); font-weight: 700; } .ro.r3 span { color: var(--r3); font-weight: 700; }
.ro-sub { text-align: right; font: 500 14px var(--mono); color: var(--muted); margin-top: -2px; }
.ro-sep { height: 1px; background: var(--line); margin: 6px 0; }
.ro-cap { font-size: 13px; color: var(--muted); }
.ro-db { display: flex; align-items: baseline; gap: 6px; }
.ro-db b { font: 600 38px var(--mono); line-height: 1; font-variant-numeric: tabular-nums; }
.ro-db small { color: var(--muted); font-size: 14px; }
.state { margin-left: auto; font-size: 13px; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.state[data-s="plus"] { color: var(--anti); background: color-mix(in srgb, var(--anti) 14%, transparent); }
.state[data-s="minus"] { color: var(--nodal); background: color-mix(in srgb, var(--nodal) 14%, transparent); }
.state[data-s="flaw"] { color: var(--heat); background: color-mix(in srgb, var(--heat) 16%, transparent); }

.playbar { position: absolute; top: 12px; left: 12px; display: flex; align-items: center; gap: 6px; padding: 6px; }
.timenote { font: 500 13px var(--mono); color: var(--muted); padding: 0 8px 0 4px; white-space: nowrap; }
@media (min-width: 900px) and (min-height: 560px) {
  html, body { height: 100%; }
  .app { height: 100%; min-height: 0; }
  .stage { height: auto; flex: 1 1 0; min-height: 360px; }
}
.bottom { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; flex-wrap: wrap-reverse; justify-content: space-between; align-items: flex-start; /* wrap-reverse에서는 flex-start가 아래쪽 */ gap: 10px; pointer-events: none; }
.bottom > * { pointer-events: auto; }
.caption { padding: 9px 16px; font-size: 18px; font-weight: 500; max-width: 720px; text-wrap: balance; }

/* 조작 독 */
.dock { display: flex; flex-wrap: wrap; gap: 8px; }
.dg { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 7px 12px; display: flex; align-items: center; gap: 10px; min-width: 0; flex-wrap: wrap; }
.dg > span { font-size: 12px; color: var(--muted); white-space: nowrap; }
.dg.slider { flex: 1 1 170px; flex-wrap: nowrap; }
.dg.slider label { font-size: 12px; color: var(--muted); white-space: nowrap; display: flex; flex-direction: column; line-height: 1.2; }
.dg.slider output { font: 600 17px var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.dg input[type="range"] { flex: 1; min-width: 90px; accent-color: var(--accent); height: 28px; }
.seg { display: flex; gap: 3px; background: var(--surface-2); border-radius: 9px; padding: 3px; flex-wrap: wrap; }
.seg button, .tg { border: 0; background: transparent; border-radius: 7px; padding: 5px 10px; cursor: pointer; font-size: 14px; font-weight: 500; white-space: nowrap; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px color-mix(in srgb, var(--shadow) 14%, transparent); }
.tgs { display: flex; flex-wrap: wrap; gap: 4px; }
.tg { border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }
.tg[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.tg .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; box-shadow: 0 0 0 1.5px var(--surface); }
.tg .dot + .dot { margin-left: -9px; }
.pbtn { border: 0; border-radius: 9px; padding: 7px 14px; font-weight: 700; cursor: pointer; background: var(--accent); color: var(--accent-ink); white-space: nowrap; }
.pbtn.alt { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
.pbtn[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.pbtn.snd[aria-pressed="true"] { background: var(--hi); color: var(--hi-ink); border-color: var(--hi); }

@media (max-width: 720px) {
  h1 { font-size: 18px; }
  .readout { width: 178px; padding: 8px 10px; }
  .ro b { font-size: 15px; } .ro-db b { font-size: 28px; }
  .ro-db { flex-wrap: wrap; row-gap: 4px; }
  .ro.opt, .ro-sep { display: none; }
  .caption { font-size: 15px; }
  .stage { height: clamp(380px, 62vh, 700px); }
  .playbar .seg, .timenote, .snd { display: none; }
}
@media (max-width: 480px) {
  .readout { width: 172px; }
  .ro { font-size: 12px; gap: 6px; } .ro-db b { font-size: 24px; }
  .state { font-size: 12px; padding: 2px 7px; }
  .pbtn .lg { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app" id="app">
  <header class="topbar">
    <div class="brand"><span class="tag">Ⅲ-02 탄성파</span><h1>반사와 투과</h1></div>
    <nav class="presets" id="presets" aria-label="수업 장면"></nav>
    <div class="tools">
      <button class="tbtn" id="capBtn" aria-pressed="true" title="C">설명</button>
      <button class="tbtn" id="fsBtn" title="F">전체 화면</button>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="실험 장면">
    <canvas id="cv" tabindex="0"></canvas>

      <button class="pbtn" id="flickBtn" data-for="rope" title="Enter">튕기기</button>
      <button class="pbtn" id="pingBtn" data-for="scan" title="Enter">초음파<span class="lg"> 보내기</span></button>
      <button class="pbtn alt" id="playBtn" title="Space">❚❚</button>
      <div class="seg" data-seg="rate" data-for="rope"><button data-v="1">실제</button><button data-v="0.5">1/2</button><button data-v="0.25">1/4</button><button data-v="0.1">1/10</button></div>
      <button class="pbtn alt snd" id="sndBtn" aria-pressed="false" title="S">소리</button>
      <span class="timenote" id="timenote"></span>
    </div>

    <div class="bottom"><div class="glass caption" id="caption"></div></div>
  </section>

  <div class="dock">
    <div class="dg" data-for="rope"><span>왼쪽 줄</span>
      <div class="seg" data-seg="r1"><button data-v="thin">가는 줄</button><button data-v="thick">굵은 줄</button></div>
    </div>
    <div class="dg" data-for="rope"><span>오른쪽 끝</span>
      <div class="seg" data-seg="r2"><button data-v="thin">가는 줄</button><button data-v="thick">굵은 줄</button><button data-v="heavy">밧줄</button><button data-v="wall">벽</button><button data-v="ring">고리</button></div>
    </div>
    <div class="dg" data-for="rope"><div class="tgs">
      <button class="tg" data-tg="comps"><i class="dot" style="background:var(--hi)"></i><i class="dot" style="background:var(--lo)"></i>입사파·반사파 따로</button>
      <button class="tg" data-tg="dims">높이</button>
    </div></div>
    <div class="dg slider" data-for="rope"><label for="tline">시간<output id="tOut"></output></label><input type="range" id="tline" min="0" max="1" step="0.001"></div>

    <div class="dg slider" data-for="scan"><label for="probeX">탐촉자 위치<output id="pxOut"></output></label><input type="range" id="probeX" min="0" max="200" step="1"></div>
    <div class="dg" data-for="scan"><div class="tgs">
      <button class="tg" data-tg="map"><i class="dot" style="background:var(--heat)"></i>깊이 지도</button>

    </div><button class="pbtn alt" id="newBtn">새 결함</button></div>
  </div>
</div>

<script>
(() => {
'use strict';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

/* ---------- 물리: 두 줄 (손 x = 0, 매듭 x = L1 = 2 m, 두 줄의 장력은 같음) ----------
   장력이 같고 재질이 같으면 v = √(T/μ) ∝ 1/굵기 → 그림의 줄 굵기도 1/v에 비례하게 그린다 */
const L1 = 2, XMAX = 4, AMP = 0.2, TP = 0.12;
const ROPES = {
  thin: { name: '가는 줄', v: 4, w: 7, c: 'r1' },
  thick: { name: '굵은 줄', v: 2, w: 14, c: 'r2' },
  heavy: { name: '밧줄', v: 1, w: 28, c: 'r3' }
};
const ENDS = { wall: '벽', ring: '고리' };
const S = { mode: 'rope', r1: 'thin', r2: 'thick', t: -1, paused: false, rate: reduce ? 0.1 : 0.25, comps: false, dims: true, cap: true, preset: 1,
  probeX: 30, run: !reduce, map: true, flaw: false, scans: [], last: null, sound: false };
const v1 = () => ROPES[S.r1].v;
function coef() {
  if (S.r2 === 'wall') return { R: -1, tau: 0, v2: 0 };
  if (S.r2 === 'ring') return { R: 1, tau: 0, v2: 0 };
  const a = v1(), b = ROPES[S.r2].v; return { R: (b - a) / (a + b), tau: 2 * b / (a + b), v2: b };
}
const g = (s, w) => s < 0 || s > w ? 0 : Math.sin(Math.PI * s / w) ** 2;
// 정확한 1차원 해: 왼쪽 y = f(x − v₁t) + R·f(2L₁ − x − v₁t), 오른쪽 y = τ·f(L₁ + (x − L₁)v₁/v₂ − v₁t)
// R = (v₂ − v₁)/(v₁ + v₂), τ = 2v₂/(v₁ + v₂)  (장력이 같으면 줄의 임피던스는 1/v에 비례)
const yInc = (x, t) => t < 0 ? 0 : AMP * g(v1() * t - x, v1() * TP);
const yRef = (x, t) => t < 0 ? 0 : coef().R * AMP * g(v1() * t - (2 * L1 - x), v1() * TP);
function yAt(x, t) {
  if (t < 0) return 0;
  if (x <= L1) return yInc(x, t) + yRef(x, t);
  const c = coef(); if (!c.v2) return 0;
  return c.tau * AMP * g(v1() * t - L1 - (x - L1) * v1() / c.v2, v1() * TP);
}
const tEnd = () => 2 * L1 / v1() - 0.003;                          // 반사파가 손에 닿기 직전에 멈춤
const split = () => S.t >= 0 && v1() * S.t - v1() * TP >= L1;        // 입사파가 경계를 다 지나감

/* ---------- 물리: 강철 블록 초음파 비파괴 검사 ---------- */
const K = { W: 200, D: 50, v: 6, tMax: 20, sweep: 1.5, gap: 0.6 };   // mm, mm/μs (= 6000 m/s), μs, 화면 속 한 번 쏘는 데 걸리는 시간 s
const SLOW = K.sweep / (K.tMax * 1e-6);                                // 느린 화면 배율 (7.5만 배)
const TG = {};
function newFlaw() { const r = (a, b) => a + Math.random() * (b - a); TG.x0 = Math.round(r(35, 120)); TG.w = Math.round(r(30, 46)); TG.d = Math.round(r(12, 36)); }
function echoes(x) {
  const bh = 4, cov = Math.max(0, Math.min(x + bh, TG.x0 + TG.w) - Math.max(x - bh, TG.x0)) / (2 * bh), out = [];
  if (cov > 0) out.push({ d: TG.d, amp: 0.85 * cov, type: 'flaw' });
  out.push({ d: K.D, amp: 0.7 * (1 - 0.75 * cov), type: 'back' });
  return out.map(e => ({ ...e, t: 2 * e.d / K.v }));
}
function signal(t, r) {                                                // 2.5 MHz 탐촉자: 주기 0.4 μs

  ctx.fillStyle = T['scope-bg']; ctx.beginPath(); ctx.roundRect(sx, sy, sw, sh, 9); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.roundRect(sx, sy, sw, sh, 9); ctx.clip();
  const L = sx + 12, R = sx + sw - 12, Tt = sy + 12, B = sy + sh - 30, pw = R - L, ph = B - Tt;
  const Xt = t => L + t / K.tMax * pw, Yv = v => Tt + ph * 0.6 - v / 1.15 * ph * 0.52;
  ctx.strokeStyle = T['scope-grid']; ctx.lineWidth = 1;
  for (let i = 0; i <= 10; i++) { const xx = Math.round(L + pw * i / 10) + 0.5; ctx.beginPath(); ctx.moveTo(xx, Tt); ctx.lineTo(xx, B); ctx.stroke(); }
  for (let j = 0; j <= 6; j++) { const yy = Math.round(Tt + ph * j / 6) + 0.5; ctx.beginPath(); ctx.moveTo(L, yy); ctx.lineTo(R, yy); ctx.stroke(); }
  ctx.font = `500 14px ${T.mono}`; ctx.fillStyle = T['scope-ink']; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (let t = 0; t <= K.tMax; t += 5) ctx.fillText(t === K.tMax ? '20 μs' : String(t), Math.min(Xt(t), R - 24), B + 7);
  const trace = (r, tE, alpha, glow) => {
    ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = T['scope-trace']; ctx.lineWidth = 2; ctx.lineJoin = 'round';
    if (glow) { ctx.shadowColor = T['scope-trace']; ctx.shadowBlur = 10; }
    ctx.beginPath(); const n = Math.max(300, Math.round(pw * 1.8));
    for (let i = 0; i <= n; i++) { const t = i / n * K.tMax; if (t > tE) break; const yy = Yv(signal(t, r)); i ? ctx.lineTo(Xt(t), yy) : ctx.moveTo(Xt(t), yy); }
    ctx.stroke(); ctx.restore();
  };
  ghosts.forEach((r, i) => trace(r, K.tMax, 0.1 + 0.08 * i, false));
  const cur = SW.on ? SW.rec : S.last;
  if (cur) trace(cur, SW.on ? SW.p * K.tMax : K.tMax, 1, true);
  if (SW.on) { const xx = Xt(SW.p * K.tMax); ctx.fillStyle = T['scope-trace']; ctx.globalAlpha = 0.12; ctx.fillRect(xx - 10, Tt, 10, B - Tt); ctx.globalAlpha = 1; }
  if (S.last && !SW.on) for (const e of S.last.echoes) {
    if (e.amp < 0.1) continue;
    const xx = Xt(e.t), col = e.type === 'flaw' ? T.heat : T['scope-ink'];
    ctx.strokeStyle = col; ctx.globalAlpha = 0.75; ctx.setLineDash([4, 4]); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(xx, Tt); ctx.lineTo(xx, B); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
    ctx.font = `600 15px ${T.mono}`; ctx.fillStyle = col; const rt = xx > R - 90;
    ctx.textAlign = rt ? 'right' : 'left'; ctx.textBaseline = 'top'; ctx.fillText(`${e.t.toFixed(1)} μs`, xx + (rt ? -6 : 6), Tt + 4);
  }
  if (!cur) { ctx.font = `500 15px ${T.font}`; ctx.fillStyle = T['scope-ink']; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('초음파를 보내세요', L + pw / 2, Tt + ph / 2); }
  ctx.fillStyle = lin(sx, sy, sx + sw * 0.6, sy + sh, [[0, A(T.spec, .09)], [0.45, A(T.spec, 0)]]); ctx.fillRect(sx, sy, sw, sh);
  ctx.restore();
  // 오른쪽 조작부: 다이얼과 버튼
  if (cw) {
    const cx0 = x + w - pad - cw + 14, cxm = cx0 + (cw - 14) / 2, kr = Math.min((cw - 14) * 0.36, sh * 0.17), ky = sy + kr + 6;
    shadowed(() => { ctx.fillStyle = metalGrad(cxm - kr, cxm + kr, ky - kr, ky + kr); ctx.beginPath(); ctx.arc(cxm, ky, kr, 0, 2 * Math.PI); ctx.fill(); }, 8, 4, 3, 0.4);
    ctx.strokeStyle = A(T.shadow, .25); ctx.lineWidth = 1;
    for (let i = 0; i < 28; i++) { const a = i / 28 * 2 * Math.PI; ctx.beginPath(); ctx.moveTo(cxm + Math.cos(a) * kr * 0.84, ky + Math.sin(a) * kr * 0.84); ctx.lineTo(cxm + Math.cos(a) * kr, ky + Math.sin(a) * kr); ctx.stroke(); }
    ctx.fillStyle = lin(cxm - kr, ky - kr, cxm + kr, ky + kr, [[0, T['metal-hi']], [1, T.metal]]); ctx.beginPath(); ctx.arc(cxm, ky, kr * 0.7, 0, 2 * Math.PI); ctx.fill();
    ctx.strokeStyle = T.case; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(cxm, ky); ctx.lineTo(cxm + kr * 0.5, ky - kr * 0.45); ctx.stroke();
    const bw = (cw - 14) * 0.42, bh = Math.min(22, sh * 0.1), gy = ky + kr + 16;
    for (let j = 0; j < 3; j++) for (let i = 0; i < 2; i++) {
      const bx0 = cx0 + i * (cw - 14 - bw), by0 = gy + j * (bh + 10);
      if (by0 + bh > sy + sh) continue;
      shadowed(() => { ctx.fillStyle = lin(0, by0, 0, by0 + bh, [[0, T['case-hi']], [1, T.case]]); ctx.beginPath(); ctx.roundRect(bx0, by0, bw, bh, 5); ctx.fill(); }, 3, 2, 1, 0.45);
      ctx.strokeStyle = T.spec; ctx.globalAlpha = 0.18; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(bx0 + 4, by0 + 1); ctx.lineTo(bx0 + bw - 4, by0 + 1); ctx.stroke(); ctx.globalAlpha = 1;
    }
  }
}

/* ---------- 측정값 카드 ---------- */
let lastRO = '';
function readout() {
  let h;
  const fmtCm = v => `${v < -0.0005 ? '−' : ''}${Math.abs(v * 100).toFixed(1)}`;
  if (S.mode === 'rope') {
    const c = coef(), sp = split(), none = Math.abs(c.R) < 0.003;
    const n2 = S.r2 in ROPES ? ROPES[S.r2].name : ENDS[S.r2];
    const st = !sp || none ? '' : c.R < 0 ? 'minus' : 'plus';
    h = `<div class="ro ${ROPES[S.r1].c}"><span>${ROPES[S.r1].name}</span><b>${v1()} m/s</b></div>
      <div class="ro ${S.r2 in ROPES ? ROPES[S.r2].c : ''}"><span>${n2}</span><b>${c.v2 ? `${c.v2} m/s` : S.r2 === 'wall' ? '고정' : '자유'}</b></div>
      <div class="ro opt"><span>입사파</span><b>20.0 cm</b></div>
      <div class="ro-sep"></div>
      <div class="ro-cap">반사파</div>
      <div class="ro-db"><b>${!sp ? '?' : none ? '0' : fmtCm(c.R * AMP)}</b><small>${sp && !none ? 'cm' : ''}</small><span class="state" data-s="${st}" ${st ? '' : 'hidden'}>${st === 'minus' ? '뒤집힘' : '그대로'}</span></div>
      <div class="ro opt"><span>위상 변화</span><b>${!sp ? '?' : none ? '—' : c.R < 0 ? '180°' : '0°'}</b></div>
      <div class="ro"><span>투과파</span><b>${!c.v2 ? '—' : sp ? `${fmtCm(c.tau * AMP)} cm` : '?'}</b></div>`;
  } else {
    const r = S.last, e = r && (r.echoes.find(q => q.type === 'flaw') || r.echoes[0]);
    h = `<div class="ro"><span>탐촉자 위치</span><b>${S.probeX} mm</b></div>
      <div class="ro opt"><span>강철 속 음속 v</span><b>6000 m/s</b></div>
      <div class="ro"><span>반사파 시간 t</span><b>${e ? e.t.toFixed(1) + ' μs' : '—'}</b></div>
      <div class="ro-sep"></div>
      <div class="ro-cap">깊이 d = vt ÷ 2</div>
      <div class="ro-db"><b>${e ? (K.v * e.t / 2).toFixed(1) : '—'}</b><small>mm</small><span class="state" data-s="${e && e.type === 'flaw' ? 'flaw' : 'plus'}" ${e ? '' : 'hidden'}>${e && e.type === 'flaw' ? '결함' : '바닥면'}</span></div>`;
  }
  if (h !== lastRO) {
    $('#ro').innerHTML = h; lastRO = h;
    measureOverlays();
  }
}

/* ---------- 동기화 ---------- */
function sync() {
  $$('.chip').forEach((b, i) => b.setAttribute('aria-pressed', String(i === S.preset)));
  $$('[data-for]').forEach(el => { el.hidden = el.dataset.for !== S.mode; });
  $$('[data-seg]').forEach(sg => sg.querySelectorAll('button').forEach(b => {
    const k = sg.dataset.seg, on = k === 'rate' ? Math.abs(S.rate - +b.dataset.v) < 1e-6 : S[k] === b.dataset.v;
    b.setAttribute('aria-pressed', String(on));
  }));
  $$('[data-tg]').forEach(b => b.setAttribute('aria-pressed', String(!!S[b.dataset.tg])));
  $('#capBtn').setAttribute('aria-pressed', String(S.cap));
  $('#sndBtn').setAttribute('aria-pressed', String(S.sound));
  $('#tline').max = String(tEnd());
  $('#probeX').value = S.probeX; $('#pxOut').textContent = `${S.probeX} mm`;
  const p = S.preset >= 0 ? PRESETS[S.preset] : null;
  $('#caption').textContent = p ? p.cap : ''; $('#caption').hidden = !S.cap || !p;
  measureOverlays();
  lastRO = ''; readout();
  stage.setAttribute('aria-label', S.mode === 'rope' ? `${ROPES[S.r1].name}에서 ${S.r2 in ROPES ? ROPES[S.r2].name : ENDS[S.r2]}(으)로 가는 펄스. 손을 누르거나 Enter 키로 튕깁니다.` : '강철 블록과 초음파 탐상기. 블록 위를 누르거나 화살표 키로 탐촉자를 옮깁니다.');
  lastRO = '';
}
function stopPreset() { if (S.preset !== -1) { S.preset = -1; sync(); } }
const fmtSlow = n => n >= 1e4 ? `${+(n / 1e4).toFixed(1)}만` : String(Math.round(n));
function updateBars() {
  const pb = $('#playBtn');
  let t;
  if (S.mode === 'scan') t = S.run ? '❚❚' : '▶';
  else t = S.t < 0 || S.t >= tEnd() - 1e-6 ? '↺' : S.paused ? '▶' : '❚❚';
  if (pb.textContent !== t) pb.textContent = t;
  const note = S.mode === 'rope' ? `t = ${Math.max(0, S.t).toFixed(2)} s${S.rate < 1 ? ` · ${Math.round(1 / S.rate)}배 느리게` : ''}`
    : SW.on ? `t = ${(SW.p * K.tMax).toFixed(1)} μs · ${fmtSlow(SLOW)} 배 느리게` : (S.run ? '자동 반복' : '멈춤');
  const tn = $('#timenote'); if (tn.textContent !== note) tn.textContent = note;
  $('#tOut').textContent = `${Math.max(0, S.t).toFixed(2)} s`;
  const tl = $('#tline'); if (document.activeElement !== tl) tl.value = Math.max(0, S.t);
}

/* ---------- 이벤트 ---------- */
$('#presets').innerHTML = PRESETS.map((p, i) => `<button class="chip" data-p="${i}" title="${i + 1}"><b>${i + 1}</b>${p.label}</button>`).join('');
$('#presets').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (b) applyPreset(+b.dataset.p); });
$('#flickBtn').addEventListener('click', flick);
$('#pingBtn').addEventListener('click', () => ping());
$('#playBtn').addEventListener('click', togglePlay);
function toggleSound() { S.sound = !S.sound; if (S.sound) { if (!audioReady()) S.sound = false; } else hush(); sync(); }
$('#sndBtn').addEventListener('click', toggleSound);
$$('[data-seg]').forEach(sg => sg.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; const k = sg.dataset.seg;
  if (k === 'rate') { S.rate = +b.dataset.v; sync(); return; }
  stopPreset(); S[k] = b.dataset.v; S.t = -1; sync(); flick();
}));
$$('[data-tg]').forEach(b => b.addEventListener('click', () => { const k = b.dataset.tg; S[k] = !S[k]; sync(); }));
$('#tline').addEventListener('input', e => { S.t = +e.target.value; S.paused = true; });
$('#probeX').addEventListener('input', e => moveProbe(+e.target.value));
$('#newBtn').addEventListener('click', () => { newFlaw(); S.scans = []; S.last = null; ghosts.length = 0; S.flaw = false; SW.on = false; SW.wait = 0.3; sync(); });
$('#capBtn').addEventListener('click', () => { S.cap = !S.cap; sync(); });
$('#fsBtn').addEventListener('click', () => {
  const el = $('#app');
  if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
  else el.requestFullscreen?.().catch(() => {});
});
document.addEventListener('keydown', e => {
  if (e.target.matches?.('input, textarea, select') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'Enter' && !e.target.matches?.('button')) { e.preventDefault(); S.mode === 'rope' ? flick() : ping(); }
  else if (/^[1-9]$/.test(e.key) && +e.key <= PRESETS.length) applyPreset(+e.key - 1);
  else if (e.key === 'f' || e.key === 'F') $('#fsBtn').click();
  else if (e.key === 'c' || e.key === 'C') $('#capBtn').click();
  else if (e.key === 's' || e.key === 'S') toggleSound();
  else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    e.preventDefault(); const d = e.key === 'ArrowRight' ? 1 : -1;
    if (S.mode === 'rope') stepTime(d * (e.shiftKey ? 0.1 : 0.02));
    else moveProbe(S.probeX + d * (e.shiftKey ? 10 : 2));
  }
});

function ping() {
  if (S.mode !== 'scan') return;
  SW.on = true; SW.p = reduce ? 0.999 : 0; SW.x = S.probeX; SW.rec = { x: S.probeX, echoes: echoes(S.probeX) }; SW.fired = 0;
  if (!reduce) sfxPing();
}
function addScan(rec) { S.scans = S.scans.filter(s => Math.abs(s.x - rec.x) > 1).concat(rec); if (S.scans.length > 300) S.scans.shift(); }
function finishSweep() {
  SW.on = false;
  if (S.last && S.last.x !== SW.rec.x) { ghosts.push(S.last); if (ghosts.length > 3) ghosts.shift(); }
  S.last = SW.rec; addScan(SW.rec);
}
// 탐촉자를 옮기면 실제 장비처럼 곧바로 A-스캔과 깊이 지도가 갱신된다 (초당 수백 번 쏨). 멈추면 느린 화면 반복이 다시 시작된다.
function moveProbe(x) {
  x = clamp(Math.round(x), 0, K.W);
  if (x === S.probeX && S.last && S.last.x === x) return;
  S.probeX = x; SW.on = false; ghosts.length = 0;
  const rec = { x, echoes: echoes(x) }; S.last = rec; addScan(rec); SW.wait = 0.9;
  $('#probeX').value = x; $('#pxOut').textContent = `${x} mm`;
}
const posOf = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
let dragging = false;
const onBlock = (G, px, py) => px >= G.bx - 24 && px <= G.bx + G.bw + 24 && py >= G.by - 140 && py <= G.by + G.bh + 24;
cv.addEventListener('pointerdown', e => {
  const [px, py] = posOf(e);
  if (S.mode === 'scan') {
    const G = ngeo();
    if (onBlock(G, px, py)) { dragging = true; try { cv.setPointerCapture(e.pointerId); } catch (err) {} moveProbe((px - G.bx) / G.bw * K.W); }
    return;
  }
  const G = rgeo(); if (Math.hypot(px - G.X(0), py - G.Y(yAt(0, S.t))) < 80 || px < G.X(0) + 24) flick();
});
cv.addEventListener('pointermove', e => {
  const [px, py] = posOf(e);
  if (dragging) { const G = ngeo(); moveProbe((px - G.bx) / G.bw * K.W); return; }
  if (S.mode === 'rope') { const G = rgeo(); cv.style.cursor = Math.hypot(px - G.X(0), py - G.Y(yAt(0, S.t))) < 80 ? 'pointer' : 'default'; }
  else cv.style.cursor = onBlock(ngeo(), px, py) ? 'ew-resize' : 'default';
});
cv.addEventListener('pointerup', () => { dragging = false; });
cv.addEventListener('pointercancel', () => { dragging = false; });

/* ---------- 시작 ---------- */
newFlaw(); readTheme(); resize();
let start = 1;
try { const v = parseInt(localStorage.getItem('reflect-demo-preset'), 10); if (v >= 0 && v < PRESETS.length) start = v; } catch (err) {}
applyPreset(start);
document.fonts?.ready.then(() => { lastRO = ''; });
let last = performance.now(), tick = 0;
function loop(now) {
  const dt = Math.min(0.25, (now - last) / 1000); last = now;
  if (S.mode === 'rope') {
    if (!S.paused && S.t >= 0 && S.t < tEnd()) S.t = Math.min(tEnd(), S.t + dt * S.rate);
    drawRope();
  } else {
    if (SW.on) {
      SW.p += dt / K.sweep;
      const es = SW.rec.echoes;
      while (SW.fired < es.length && SW.p * K.tMax >= es[SW.fired].t) { const e = es[SW.fired++]; if (e.amp > 0.1) sfxPing(0.2 * e.amp, 0.07); }
      if (SW.p >= 1) { SW.p = 1; finishSweep(); SW.wait = K.gap; }
    }
    else if (S.run) { SW.wait -= dt; if (SW.wait <= 0) ping(); }
    else if (SW.wait > 0) { SW.wait -= dt; if (SW.wait <= 0) ping(); }
    drawScan();
  }
  updateBars();
  if ((tick = (tick + 1) % 4) === 0) readout();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
