<title>소음 제거 실험실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 교사용 시연 도구 (TEACHER-DEMO v3 형식): 상단 장면 칩 · 화면을 채우는 무대 + 유리 카드 · 아래 조작 독 */
:root {
  --bg: #e9edf1;
  --surface: #ffffff;
  --surface-2: #f3f5f8;
  --ink: #141c25;
  --muted: #5a6573;
  --line: #d3dae2;
  --accent: #0b6b70;
  --accent-ink: #ffffff;
  --on-strong: #ffffff;
  --noise: #e0484f;
  --anti: #2f74e0;
  --sum: #1f9d63;
  --music: #d08a12;
  --s1: #0a7f86;
  --s2: #d06a14;
  --stage: #e3e8ec;
  --skin: #e8c3a0;
  --skin-2: #c99a76;
  --shell: #3a4048;
  --shell-2: #1f2328;
  --pad: #50565e;
  --cavity: #f1f3f5;
  --metal: #d5dade;
  --metal-2: #8d969f;
  --pcb: #1f7a4a;
  --bus: #2f8f62;
  --bus-2: #1f6646;
  --glass: #1d2933;
  --glass-hi: #6f8ea5;
  --wood: #caa77a;
  --wood-2: #a9845a;
  --water: #bfe0ee;
  --stone: #d8b45a;
  --scope: #0a1410;
  --scope-grid: #173226;
  --road: #5b6066;
  --flesh: #c0675a;
  --fat: #efd49e;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1116; --surface: #161c23; --surface-2: #1d252e; --ink: #e6ebf0; --muted: #98a4b0; --line: #2b3540;
    --accent: #3fc0b5; --accent-ink: #0d1116; --on-strong: #ffffff; --noise: #ff6b70; --anti: #6aa2ff; --sum: #4fd389; --music: #f2b440; --s1: #3fc6c4; --s2: #f5a04c;
    --stage: #12171d; --skin: #c9a07c; --skin-2: #9c7656; --shell: #2a2f35; --shell-2: #121518; --pad: #3a4047; --cavity: #232a32;
    --metal: #a6aeb6; --metal-2: #5b646d; --pcb: #1b6a41; --bus: #2a7a55; --bus-2: #1a5139; --glass: #0b1116; --glass-hi: #46607a;
    --wood: #6e5639; --wood-2: #4f3d28; --water: #18394a; --stone: #c9a24c;
    --road: #30353b; --flesh: #8e4a40; --fat: #a88d5e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1116; --surface: #161c23; --surface-2: #1d252e; --ink: #e6ebf0; --muted: #98a4b0; --line: #2b3540;
  --accent: #3fc0b5; --accent-ink: #0d1116; --on-strong: #ffffff; --noise: #ff6b70; --anti: #6aa2ff; --sum: #4fd389; --music: #f2b440; --s1: #3fc6c4; --s2: #f5a04c;
  --stage: #12171d; --skin: #c9a07c; --skin-2: #9c7656; --shell: #2a2f35; --shell-2: #121518; --pad: #3a4047; --cavity: #232a32;
  --metal: #a6aeb6; --metal-2: #5b646d; --pcb: #1b6a41; --bus: #2a7a55; --bus-2: #1a5139; --glass: #0b1116; --glass-hi: #46607a;
  --wood: #6e5639; --wood-2: #4f3d28; --water: #18394a; --stone: #c9a24c;
  --road: #30353b; --flesh: #8e4a40; --fat: #a88d5e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  min-height: 100vh; display: flex; flex-direction: column; gap: 10px;
  padding-block: 10px 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bg);
}
.app:fullscreen { padding-block: 12px; }

/* 상단 바 */
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.tag { font: 500 12px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; white-space: nowrap; }
h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 520px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px 4px 4px; cursor: pointer; font-size: 13.5px; font-weight: 500; white-space: nowrap; transition: background .15s, border-color .15s; }
.chip b { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font: 600 12px var(--mono); }
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.chip[aria-pressed="true"] b { background: var(--accent); color: var(--accent-ink); }
.tools { display: flex; gap: 6px; margin-left: auto; }
.tbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 6px 12px; cursor: pointer; font-size: 14px; font-weight: 500; white-space: nowrap; }
.tbtn:hover { border-color: var(--muted); }
.tbtn[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

/* 무대 */
.stage { position: relative; flex: 1 1 auto; height: clamp(420px, calc(100vh - 200px), 1100px); border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: var(--stage); }
.app:fullscreen .stage { height: auto; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.glass { background: color-mix(in srgb, var(--surface) 86%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border: 1px solid color-mix(in srgb, var(--line) 85%, transparent); border-radius: 14px; box-shadow: 0 8px 28px rgb(10 20 30 / .10); }
.readout { position: absolute; top: 12px; right: 12px; width: 236px; padding: 12px 14px 12px; display: flex; flex-direction: column; gap: 3px; }
.ro { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 14px; color: var(--muted); }
.ro b { font: 500 18px var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ro b small { font: 500 13px var(--font); color: var(--muted); margin-left: 3px; }
.ro-k { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: var(--muted); margin-top: 2px; }
.ro-k i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.ro-sub { text-align: right; font: 500 14px var(--mono); color: var(--muted); margin-top: -2px; white-space: nowrap; }
.ro-f { text-align: right; font: 500 13px var(--mono); color: var(--ink); background: var(--surface-2); border-radius: 7px; padding: 3px 7px; margin-top: 2px; white-space: normal; overflow-wrap: anywhere; line-height: 1.35; }
.ro-sep { height: 1px; background: var(--line); margin: 6px 0; }
.ro-db { display: flex; align-items: baseline; justify-content: flex-end; gap: 6px; }
.ro-db b { font: 600 36px var(--mono); line-height: 1.05; font-variant-numeric: tabular-nums; letter-spacing: -.02em; white-space: nowrap; }
.ro-db small { color: var(--muted); font-size: 14px; }

.playbar { position: absolute; top: 12px; left: 12px; display: flex; align-items: center; gap: 6px; padding: 6px; flex-wrap: wrap; max-width: calc(100% - 272px); }
.timenote { font-size: 12px; color: var(--muted); padding: 0 8px 0 4px; white-space: nowrap; }
@media (min-width: 900px) and (min-height: 560px) {
  html, body { height: 100%; }
  .app { height: 100%; min-height: 0; }
  .stage { height: auto; flex: 1 1 0; min-height: 360px; }
}
.bottom { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; flex-wrap: wrap-reverse; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none; }   /* wrap-reverse에서는 flex-start가 아래쪽: 설명 칸이 늘 무대 바닥에 붙음 */
.bottom > * { pointer-events: auto; }
.caption { padding: 9px 16px; font-size: 18px; font-weight: 500; max-width: 720px; text-wrap: balance; }
.graph-card { width: min(400px, 100%); padding: 8px 10px 4px; margin-left: auto; }
.graph-card .gt { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); padding: 0 2px 2px; }
#gcv { display: block; width: 100%; height: 118px; }

/* 조작 독 */
.dock { display: flex; flex-wrap: wrap; gap: 8px; }
.dg { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 7px 12px; display: flex; align-items: center; gap: 10px; min-width: 0; }
.dg > span { font-size: 12px; color: var(--muted); white-space: nowrap; }
.dg.slider { flex: 1 1 170px; }
.dg.slider label { font-size: 12px; color: var(--muted); white-space: nowrap; display: flex; flex-direction: column; line-height: 1.2; }
.dg.slider output { font: 600 17px var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.dg.slider output small { font: 500 12px var(--font); color: var(--muted); margin-left: 3px; }
.dg input[type="range"] { flex: 1; min-width: 90px; accent-color: var(--accent); height: 28px; }
.seg { display: flex; gap: 3px; background: var(--surface-2); border-radius: 9px; padding: 3px; flex-wrap: wrap; }
.seg button, .tg { border: 0; background: transparent; border-radius: 7px; padding: 5px 10px; cursor: pointer; font-size: 14px; font-weight: 500; white-space: nowrap; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / .14); }
.tgs { display: flex; flex-wrap: wrap; gap: 4px; }
.tg { border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }
.tg[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.tg .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.pbtn { border: 0; border-radius: 9px; padding: 7px 14px; font-weight: 700; cursor: pointer; background: var(--accent); color: var(--accent-ink); white-space: nowrap; }
.pbtn.alt { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
.pbtn.snd[aria-pressed="true"] { background: var(--noise); color: var(--on-strong); }
.pbtn.big { font-size: 15px; padding: 7px 16px 7px 13px; background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
.pbtn.big::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: 0; background: var(--muted); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--surface) 60%, transparent); }
.pbtn.big[aria-pressed="true"] { background: var(--anti); color: var(--on-strong); border-color: var(--anti); }
.pbtn.big[aria-pressed="true"]::before { background: var(--on-strong); }

@media (max-width: 720px) {
  h1 { font-size: 18px; }
  .readout { width: 150px; padding: 8px 10px; }
  .ro-opt, .ro-f { display: none !important; }
  .ro b { font-size: 15px; } .ro-db b { font-size: 24px; }
  .caption { font-size: 15px; }
  .graph-card { display: none; }
  .stage { height: clamp(440px, 76vh, 720px); }
  .playbar { max-width: calc(100% - 186px); }
  .playbar .seg.speed, .timenote { display: none; }
}
@media (max-width: 600px) {
  .playbar { max-width: calc(100% - 24px); }
  .pbtn, .pbtn.big { font-size: 14px; padding: 6px 11px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
/* 출처 (신체 그림이 보이는 장면에서만) */
.credit { position: absolute; right: 14px; bottom: 0; z-index: 1; font-size: 10px; line-height: 12px; color: var(--muted); pointer-events: none; text-align: right; padding: 0 4px; border-radius: 4px; background: color-mix(in srgb, var(--stage) 72%, transparent); }
.credit span { white-space: nowrap; }

/* ---------- PHONE v1: 휴대폰 세로·가로 ---------- */
.presets, .dock { scrollbar-width: none; }
.presets::-webkit-scrollbar, .dock::-webkit-scrollbar { display: none; }
@media (max-width: 600px) and (orientation: portrait), (max-height: 500px) and (orientation: landscape) {
  html, body { height: 100%; }
  body { overscroll-behavior: none; }
  .app { height: 100vh; height: 100dvh; min-height: 0; gap: 6px;
         padding: max(6px, env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-right, 0px)) max(6px, env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  .topbar { flex: 0 0 auto; gap: 6px 8px; }
  .brand { gap: 6px; }
  .tag { font-size: 11px; padding: 1px 6px; }
  h1 { font-size: 16px; }
  .presets { flex-wrap: nowrap; overflow-x: auto; overscroll-behavior-x: contain; gap: 4px; padding: 1px 0;
             -webkit-mask-image: linear-gradient(90deg, #000 90%, transparent); mask-image: linear-gradient(90deg, #000 90%, transparent); }
  .chip { flex: 0 0 auto; font-size: 13px; padding: 3px 9px 3px 3px; min-height: 30px; }
  .chip b { width: 22px; height: 22px; font-size: 11px; }
  .tools { gap: 4px; }
  .tbtn { padding: 5px 9px; font-size: 13px; min-height: 30px; }
  .stage { height: auto; flex: 1 1 0; min-height: 0; border-radius: 12px; }
  .glass { border-radius: 11px; }
  .playbar { top: 6px; left: 6px; padding: 4px; gap: 4px; max-width: calc(100% - 12px); }
  .pbtn, .pbtn.big { padding: 6px 11px; font-size: 14px; min-height: 34px; }
  .playbar .seg, .timenote { display: none; }
  .readout { top: 6px; right: 6px; width: auto; min-width: 118px; max-width: 46%; padding: 6px 9px; gap: 1px; }
  .ro { font-size: 12px; gap: 6px; } .ro b { font-size: 14px; }
  .ro-db b { font-size: 24px; } .ro-db small, .ro-sub { font-size: 11px; }
  .ro-k { font-size: 12px; margin-top: 0; }
  .ro-sep { margin: 3px 0; }
  .ro-opt, .ro-f { display: none !important; }
  .bottom { left: 6px; right: 6px; bottom: 6px; gap: 6px; }
  .caption { font-size: 13.5px; padding: 6px 11px; line-height: 1.35; }
  .graph-card { display: none; }
  .dock { flex: 0 0 auto; flex-wrap: nowrap; overflow-x: auto; overscroll-behavior-x: contain; gap: 6px; }
  .dg { flex: 0 0 auto; padding: 4px 9px; gap: 7px; border-radius: 10px; }
  .dg.slider { flex: 0 0 auto; width: min(76vw, 300px); }
  .seg button, .tg { padding: 7px 10px; font-size: 13px; }
  /* 이 파일: 재생 막대 글씨 줄이기, 출처 글씨 자리 */
  .pbtn .pl-x { display: none; }
  .pbtn.big { padding-left: 10px; }
  .pbtn.big::before { margin-right: 6px; }
  .stage.cred .bottom { bottom: calc(var(--credh, 12px) + 4px); }   /* 출처 글씨(한두 줄) 위로 */
  .credit { right: 8px; bottom: 2px; max-width: calc(100% - 16px); }
}
@media (max-width: 600px) and (orientation: portrait) {
  .brand { flex: 1 1 auto; min-width: 0; }
  .presets { order: 3; flex: 1 0 100%; }          /* 장면 버튼: 둘째 줄, 옆으로 밀기 */
}
@media (max-height: 500px) and (orientation: landscape) {
  .topbar { flex-wrap: nowrap; }                   /* 한 줄: 제목 · 장면 버튼(옆으로 밀기) · 도구 */
  .presets { flex: 1 1 0; min-width: 0; }
  .caption { font-size: 13px; max-width: 64%; }   /* 한 줄에 들어가게 (설명이 두 줄이면 그림 자리가 줄어듦) */
  .readout { max-width: 32%; }
  .playbar { flex-direction: column; align-items: stretch; flex-wrap: nowrap; }   /* 세로로 세움: 무대 높이를 그림에 씀 */
}
</style>

<div class="app" id="app">
  <header class="topbar">
    <div class="brand"><span class="tag">Ⅲ-04 음파의 간섭</span><h1>소음 제거</h1></div>
    <nav class="presets" id="chips" aria-label="수업 장면"></nav>
    <div class="tools">
      <button class="tbtn" id="capBtn" aria-pressed="true" title="C">설명</button>
      <button class="tbtn" id="fsBtn" title="F">전체 화면</button>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="소음 제거 장면">
    <canvas id="scene" tabindex="0"></canvas>
    <div class="glass playbar" id="playbar"></div>
    <div class="glass readout" id="readout" aria-live="polite"></div>
    <div class="bottom">
      <div class="glass caption" id="caption"></div>
      <div class="glass graph-card" id="gpanel" hidden><div class="gt"><span id="gTitle"></span><span id="gUnit"></span></div><canvas id="gcv"></canvas></div>
    </div>
    <div class="credit" id="credit" hidden></div>
  </section>

  <div class="dock" id="dock"></div>

  ctx.fillStyle = lg(cx - r, cy - r, cx + r, cy + r, [[0, '#eef1f3'], [0.5, T.metal], [1, T['metal-2']]]); ctx.beginPath(); ctx.arc(cx, cy, r * 0.56, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = Math.max(1, r * 0.06); ctx.beginPath(); ctx.arc(cx, cy, r * 0.56, 0, TAU); ctx.stroke();
  ctx.fillStyle = '#5b636b'; for (let k = 0; k < 6; k++) { const a = k * TAU / 6; ctx.beginPath(); ctx.arc(cx + Math.cos(a) * r * 0.32, cy + Math.sin(a) * r * 0.32, r * 0.06, 0, TAU); ctx.fill(); }
  ctx.fillStyle = lg(cx - r * 0.2, cy - r * 0.2, cx + r * 0.2, cy + r * 0.2, [[0, '#ffffff'], [1, T['metal-2']]]); ctx.beginPath(); ctx.arc(cx, cy, r * 0.17, 0, TAU); ctx.fill();
}
function bus(x, y, u) {            // 옆에서 본 시내버스 (오른쪽이 앞, 길이:높이 ≈ 3.3:1)
  const X = v => x + v * u, Y = v => y + v * u;
  ellipseShadow(X(20), Y(13.3), 22 * u, 1.6 * u, 0.4);
  // 지붕 냉방기
  ctx.fillStyle = lg(0, Y(-1), 0, Y(0.8), [[0, mix(T.metal, '#ffffff', 0.3)], [1, T['metal-2']]]); rr(X(12), Y(-0.9), 15 * u, 1.8 * u, 0.7 * u); ctx.fill();
  // 차체
  shadow(10, 3, 6, 0.25);
  ctx.fillStyle = lg(0, Y(0.6), 0, Y(11.4), [[0, mix(T.bus, '#ffffff', 0.22)], [0.12, T.bus], [0.7, T.bus], [1, T['bus-2']]]);
  ctx.beginPath(); ctx.moveTo(X(1.2), Y(0.6)); ctx.lineTo(X(37), Y(0.6)); ctx.quadraticCurveTo(X(39.6), Y(0.7), X(39.85), Y(3.2)); ctx.lineTo(X(40), Y(10.5));
  ctx.quadraticCurveTo(X(40), Y(11.4), X(39.1), Y(11.4)); ctx.lineTo(X(0.8), Y(11.4)); ctx.quadraticCurveTo(X(0), Y(11.4), X(0), Y(10.5)); ctx.lineTo(X(0), Y(1.7)); ctx.quadraticCurveTo(X(0), Y(0.6), X(1.2), Y(0.6)); ctx.closePath(); ctx.fill(); noShadow();
  ctx.save(); ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.fillRect(X(0), Y(0.8), 40 * u, 0.35 * u);                                   // 지붕 모서리 빛
  ctx.fillStyle = rgba(T['bus-2'], 0.9); ctx.fillRect(X(0), Y(9.3), 40 * u, 2.2 * u);                                     // 아랫단
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fillRect(X(0), Y(8.15), 40 * u, 0.55 * u);                                  // 도색 띠
  ctx.fillStyle = 'rgba(0,0,0,.35)'; for (let i = 0; i < 4; i++) ctx.fillRect(X(1), Y(9.7 + i * 0.38), 3.2 * u, 0.16 * u);   // 뒤쪽 엔진 통풍구
  ctx.restore();
  // 옆 창문 (기둥으로 나뉜 짙은 유리)
  const glass = (x0, y0, w, h, r = 0.5) => { ctx.fillStyle = lg(0, Y(y0), 0, Y(y0 + h), [[0, T['glass-hi']], [0.45, T.glass], [1, mix(T.glass, '#000000', 0.2)]]); rr(X(x0), Y(y0), w * u, h * u, r * u); ctx.fill(); };
  glass(1.6, 2.1, 16.6, 4.9); glass(22.6, 2.1, 11.2, 4.9);
  ctx.fillStyle = mix(T.bus, '#000000', 0.15); for (const px of [6.6, 11.8, 16.6, 27.6, 32.4]) ctx.fillRect(X(px), Y(2.1), 0.55 * u, 4.9 * u);
  // 문 (가운데, 앞)
  for (const dx of [18.8, 34.4]) {
    ctx.fillStyle = rgba(T['bus-2'], 1); rr(X(dx - 0.3), Y(1.8), 3.8 * u, 9.4 * u, 0.4 * u); ctx.fill();
    glass(dx, 2.1, 1.55, 8.7, 0.3); glass(dx + 1.65, 2.1, 1.55, 8.7, 0.3);
  }
  // 앞 유리, 행선 표시판, 등, 거울
  ctx.fillStyle = lg(X(38.2), 0, X(40), 0, [[0, T.glass], [1, T['glass-hi']]]);
  ctx.beginPath(); ctx.moveTo(X(38.3), Y(1.9)); ctx.lineTo(X(39.55), Y(2.0)); ctx.lineTo(X(39.8), Y(7.6)); ctx.lineTo(X(38.3), Y(7.6)); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#121518'; rr(X(36.6), Y(0.95), 3.1 * u, 0.85 * u, 0.2 * u); ctx.fill();
  ctx.fillStyle = '#ffb547'; ctx.fillRect(X(36.9), Y(1.22), 2.4 * u, 0.3 * u);
  ctx.fillStyle = rg(X(39.6), Y(9.1), 0, 1.2 * u, [[0, '#fffbe6'], [1, '#e8d58a']]); rr(X(39.15), Y(8.7), 0.8 * u, 0.85 * u, 0.25 * u); ctx.fill();
  ctx.fillStyle = '#d23a2e'; rr(X(0), Y(7.2), 0.55 * u, 1.9 * u, 0.2 * u); ctx.fill();
  ctx.strokeStyle = '#1b1e22'; ctx.lineWidth = Math.max(1.2, 0.3 * u); ctx.beginPath(); ctx.moveTo(X(39.8), Y(2.6)); ctx.lineTo(X(41.2), Y(2.2)); ctx.stroke();
  ctx.fillStyle = '#1b1e22'; rr(X(40.8), Y(2.0), 0.75 * u, 2.4 * u, 0.25 * u); ctx.fill();
  // 바퀴와 바퀴집
  for (const wx of [9.2, 30.6]) {
    ctx.fillStyle = '#121417'; ctx.beginPath(); ctx.arc(X(wx), Y(11.3), 2.85 * u, Math.PI, 0); ctx.fill();
    wheel(X(wx), Y(11.3), 2.3 * u);
  }
}

/* ---------- 헤드폰 장면: 헤드폰을 쓴 학생(정면) + 귀와 이어컵 단면 확대 ----------
   신체는 직접 그리지 않고 인터넷 그림을 씀 — 얼굴·헤드폰: Microsoft Fluent Emoji (MIT),
   귀 단면: Chittka L. & Brockmann A., Wikimedia Commons "Anatomy of the Human Ear blank.svg" (CC BY 2.5).
   그림 위에 그리는 것은 물건(이어컵 · 스피커 · 마이크 · 회로)과 소리뿐. */
const IMG = {};
try {
  const uris = JSON.parse(document.getElementById('nc-img').textContent);
  for (const key in uris) { const im = new Image(); im.decoding = 'async'; im.onload = () => { IMG[key] = im; }; im.src = uris[key]; }
} catch (e) {}
const P2 = {};
const p2d = (k, d) => P2[k] || (P2[k] = new Path2D(typeof d === 'function' ? d() : d));

// 학생: 얼굴 그림(32 × 32 단위) 위에 헤드폰 그림을 씌움. 머리띠는 머리카락 위, 이어컵은 귀 위.
// 헤드폰 그림 → 얼굴 좌표: x' = 16 + (x − 16)·sx, y' = y0 + (y − ey0)·sy  (머리띠 안쪽 꼭대기가 머리카락 꼭대기에, 이어컵 가운데가 귀에 오게)
const HP = { sx: 1.16, sy: 0.848, y0: 1.8, ey0: 4.9 };
const hpX = x => 16 + (x - 16) * HP.sx, hpY = y => HP.y0 + (y - HP.ey0) * HP.sy;
// 얼굴(살갗) 테두리 — 이어컵 중 얼굴 앞으로 오는 부분(쿠션 안쪽 면)은 가림
const FACE_D = 'M 6.45 9 L 6.45 24 C 6.7 26.6 8.7 28.9 11.6 29.8 C 13.4 30.3 18.6 30.3 20.4 29.8 C 23.3 28.9 25.3 26.6 25.55 24 L 25.55 9 Z';
const STU = { key: '', c: null };
function studentSprite(s) {   // s = 장치 픽셀 / 얼굴 단위. 그림 영역 x −3 … 35, y −3 … 34
  if (!IMG.head) return null;
  const key = `${Math.round(s * 16)}|${!!IMG.phones}`;
  if (STU.key === key) return STU.c;
  const c = STU.c || (STU.c = document.createElement('canvas'));
  c.width = Math.ceil(38 * s); c.height = Math.ceil(37 * s);
  const g = c.getContext('2d'); g.setTransform(s, 0, 0, s, 3 * s, 3 * s); g.clearRect(-3, -3, 38, 37);
  g.drawImage(IMG.head, 0, 0, 32, 32);
  if (IMG.phones) {
    g.save();
    const clip = new Path2D('M -3 -3 L 35 -3 L 35 34 L -3 34 Z'); clip.addPath(new Path2D(FACE_D)); g.clip(clip, 'evenodd');
    g.translate(16, HP.y0); g.scale(HP.sx, HP.sy); g.translate(-16, -HP.ey0);
    g.shadowColor = 'rgba(30,20,40,.3)'; g.shadowBlur = 0.6 * s; g.shadowOffsetY = 0.25 * s;
    g.drawImage(IMG.phones, 0, 0, 32, 32);
    g.restore();
  }
  STU.key = key; return c;
}
// 학생 그리기: (x, y) = 얼굴 그림 왼쪽 위, hs = 화면 px / 단위
function student(x, y, hs, anc) {
  const c = studentSprite(hs * D.dpr); if (!c) return false;
  shadow(16, 2, 7, T.dark ? 0.32 : 0.16); ctx.drawImage(c, x - 3 * hs, y - 3 * hs, 38 * hs, 37 * hs); noShadow();
  if (IMG.phones) {   // 소음 제거 표시등 (왼쪽 이어컵 바깥 껍데기 아래쪽)
    const lx = x + hpX(5.2) * hs, ly = y + hpY(26.6) * hs, lw = Math.max(2.2, 0.42 * hs), lh = Math.max(4.5, 1.15 * hs);
    ctx.save(); ctx.translate(lx, ly); ctx.rotate(-0.38);
    if (anc) { ctx.fillStyle = rg(0, 0, 0, lh * 1.6, [[0, rgba(T.anti, 0.55)], [1, rgba(T.anti, 0)]]); ctx.beginPath(); ctx.arc(0, 0, lh * 1.6, 0, TAU); ctx.fill(); }
    ctx.fillStyle = anc ? mix(T.anti, '#ffffff', 0.25) : '#5d636b'; rr(-lw / 2, -lh / 2, lw, lh, lw / 2); ctx.fill();
    ctx.restore();
  }
  return true;
}

// 귀 단면 그림의 좌표(u) = ear-anatomy.svg 좌표 (658.6 × 517.7). 외이도 길이 2.5 cm ≈ 243 u → 1 cm ≈ 95 u.
// 그림에서 잰 자리: 외이도 입구 (138, 311), 고막(초록 막) 가운데 (379, 307) · 긴 반지름 41 · 짧은 반지름 21 · 기울기 60°, 달팽이관 (493, 297),
// 머리 옆면(피부): 귓바퀴 위 x ≈ 140, 아래 x ≈ 154. 그림 위·아래 끝은 가장자리 한 줄을 늘려 이어 붙임 (이어컵 쿠션이 닿는 머리 옆면)
const EA = { W: 658.57141, H: 517.71429, cx: 170, cy: 260, r: 378,
  mouth: [138, 311], drum: [379, 307], drumA: 60 * DEG, drumRa: 41, drumRb: 21, cochlea: [493, 297],
  S: [-2902, 1641], lam: 150, cone: [-60, 311] };
const CANAL_T = [[134, 281], [160, 279.8], [180, 280.2], [200, 280.8], [220, 279.8], [240, 278], [260, 275.5], [280, 272.8], [300, 269.8], [320, 270], [340, 272.8], [352, 274], [363, 271]];
const CANAL_B = [[134, 343.5], [160, 343.2], [180, 344.2], [200, 342.8], [220, 339], [240, 334.2], [260, 329], [280, 325.5], [300, 324.5], [320, 326], [340, 330.2], [352, 333.5], [368, 337], [394, 343]];
const canalAxis = x => { const f = pts => { let i = 0; while (i < pts.length - 2 && pts[i + 1][0] < x) i++; const [x0, y0] = pts[i], [x1, y1] = pts[i + 1]; return y0 + (y1 - y0) * clamp((x - x0) / (x1 - x0), 0, 1); }; return (f(CANAL_T) + f(CANAL_B)) / 2; };
// 이어컵 (단면, u): 스피커 판 앞면 bf · 뒷면 bb, 껍데기 안쪽 뒷벽 back (두께 sh), 쿠션 위 [ct0, ct1] · 아래 [cb0, cb1], 쿠션이 닿는 머리 옆면 x (위 sT, 아래 sB), 스피커 축 ax
const CUP = { bf: -12, bb: -22, back: -104, sh: 12, ct0: -128, ct1: 8, cb0: 508, cb1: 644, sT: 140, sB: 154, ax: 311, cone: 186 };
const FRONT_D = `M ${CUP.bf} ${CUP.ct1} L ${CUP.sT} ${CUP.ct1} L 138.5 21 L 139.3 30 L 142.3 60 L 144.8 100 L 146 130 L 138 150 L 137 300 L 138 430 L 147.5 442 L 150.8 480 L ${CUP.sB} ${CUP.cb0} L ${CUP.bf} ${CUP.cb0} Z`;

// 귀 단면 판: 그림을 확대 원 크기로 한 번만 그려 둠 (반투명한 살 부분은 원래처럼 흰 바탕 위에) + 고막 조각(떨림용)
const PLATE = { key: '', c: null, drum: null };
function earPlate(k) {   // k = 장치 픽셀 / u
  if (!IMG.ear) return null;
  const key = `${Math.round(k * 500)}|${T.dark}`;
  if (PLATE.key === key) return PLATE;
  const x0 = EA.cx - EA.r, y0 = EA.cy - EA.r, n = 2 * EA.r;
  // 1) 그림을 따로 그리고, 반투명한 칠은 흰 바탕과 합쳐 불투명하게 (안 되면 머리 쪽만 흰 바탕을 깖)
  const t = document.createElement('canvas'); t.width = Math.ceil(EA.W * k); t.height = Math.ceil(EA.H * k);
  const h = t.getContext('2d');
  try {
    h.drawImage(IMG.ear, 0, 0, t.width, t.height);
    const id = h.getImageData(0, 0, t.width, t.height), d = id.data;
    for (let i = 0; i < d.length; i += 4) { const a = d[i + 3]; if (a >= 96 && a < 255) { const f = a / 255; d[i] = d[i] * f + 255 * (1 - f); d[i + 1] = d[i + 1] * f + 255 * (1 - f); d[i + 2] = d[i + 2] * f + 255 * (1 - f); d[i + 3] = 255; } }
    h.putImageData(id, 0, 0);
  } catch (e) {
    h.setTransform(1, 0, 0, 1, 0, 0); h.clearRect(0, 0, t.width, t.height);
    h.setTransform(k, 0, 0, k, 0, 0); h.fillStyle = '#ffffff'; h.fill(new Path2D('M 138.5 18 L 636 17 L 636 330 L 466 492 L 152 494 L 147.5 442 L 146 130 Z'));
    h.setTransform(1, 0, 0, 1, 0, 0); h.drawImage(IMG.ear, 0, 0, t.width, t.height);
  }
  const c = PLATE.c || (PLATE.c = document.createElement('canvas'));
  c.width = c.height = Math.ceil(n * k);
  const g = c.getContext('2d'); g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, c.width, c.height);
  g.setTransform(k, 0, 0, k, -x0 * k, -y0 * k);
  // 2) 위 · 아래로 이어 붙이기 (가장자리 한 줄을 늘림): 머리 옆면 · 뼈 · 뇌가 원 끝까지 이어짐
  const rowT = Math.round(22 * k), rowB = Math.round(488 * k);
  g.drawImage(t, Math.round(137 * k), rowT, t.width - Math.round(137 * k), 1, 137, y0, EA.W - 137, 22.6 - y0);
  g.drawImage(t, Math.round(149 * k), rowB, Math.round(321 * k), 1, 149, 488, 321, y0 + n - 488);
  g.drawImage(t, 0, 0, EA.W, EA.H);
  if (T.dark) { g.globalCompositeOperation = 'source-atop'; g.fillStyle = 'rgba(8,12,18,.2)'; g.fillRect(x0, y0, n, n); g.globalCompositeOperation = 'source-over'; }
  // 3) 고막 조각: 고막(타원)과 둘레를 오려 가장자리를 흐리게 → 앞뒤로 옮겨 그리면 막이 떨림
  const [dx, dy] = EA.drum, m = 62, dc = PLATE.drum || (PLATE.drum = document.createElement('canvas'));
  dc.width = dc.height = Math.ceil(2 * m * k);
  const q = dc.getContext('2d'); q.setTransform(1, 0, 0, 1, 0, 0); q.globalCompositeOperation = 'source-over'; q.clearRect(0, 0, dc.width, dc.height);
  q.drawImage(c, (dx - m - x0) * k, (dy - m - y0) * k, 2 * m * k, 2 * m * k, 0, 0, dc.width, dc.height);
  q.globalCompositeOperation = 'destination-in';
  q.setTransform(k, 0, 0, k, m * k, m * k); q.rotate(EA.drumA);
  const ra = EA.drumRa + 17; q.scale(1, (EA.drumRb + 17) / ra);
  const gr = q.createRadialGradient(0, 0, 0, 0, 0, ra); gr.addColorStop(0, '#000'); gr.addColorStop((EA.drumRa + 10) / ra, '#000'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  q.fillStyle = gr; q.beginPath(); q.arc(0, 0, ra, 0, TAU); q.fill();
  q.setTransform(1, 0, 0, 1, 0, 0); q.globalCompositeOperation = 'source-over';
  PLATE.key = key; return PLATE;
}

// 확대 원 안 (그림 좌표 u로 그림). o: { ph, anc, g, lag, ear, wob, cd, k(장치 px / u), px(화면 1 px의 u), music }
function earCut(o) {
  const { ph, px } = o, lam = EA.lam, S = EA.S, M = EA.mouth, C = CUP;
  const air = T.cavity, airB = mix(T.cavity, '#000000', T.dark ? 0.3 : 0.12);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.save(); ctx.beginPath(); ctx.arc(EA.cx, EA.cy, EA.r, 0, TAU); ctx.clip();
  // 1. 바깥 공기 + 버스 쪽(왼쪽 아래)에서 오는 소음 파면
  ctx.fillStyle = lg(EA.cx - EA.r, 0, EA.cx + EA.r, 0, [[0, mix(T.surface, T.stage, 0.15)], [1, mix(T.surface, T.stage, 0.55)]]); ctx.fillRect(EA.cx - EA.r, EA.cy - EA.r, 2 * EA.r, 2 * EA.r);
  const thC = Math.atan2(EA.cy - S[1], EA.cx - S[0]), dC = Math.hypot(EA.cx - S[0], EA.cy - S[1]);
  const noiseArcs = (alpha, lw) => {
    ctx.strokeStyle = T.noise; ctx.lineWidth = lw; ctx.globalAlpha = alpha;
    for (let k = Math.floor((dC - EA.r) / lam) - 1; k <= Math.ceil((dC + EA.r) / lam); k++) { const r = (k + ph) * lam; if (r <= 0) continue; ctx.beginPath(); ctx.arc(S[0], S[1], r, thC - 0.15, thC + 0.15); ctx.stroke(); }
    ctx.globalAlpha = 1;
  };
  const lw = 3.2 * px;
  noiseArcs(0.92, lw);
  // 2. 이어컵 뒤 공간(스피커 뒤) · 앞 공간(귀 쪽)의 공기
  const backP = p2d('cupBack', `M ${C.bb} ${C.ct0} L ${C.back + 18} ${C.ct0} Q ${C.back} ${C.ct0} ${C.back} ${C.ct0 + 18} L ${C.back} ${C.cb1 - 18} Q ${C.back} ${C.cb1} ${C.back + 18} ${C.cb1} L ${C.bb} ${C.cb1} Z`);
  const frontP = p2d('cupFront', FRONT_D);
  ctx.fillStyle = airB; ctx.fill(backP);
  ctx.save(); ctx.clip(backP); noiseArcs(0.22, lw * 0.8); ctx.restore();
  ctx.fillStyle = air; ctx.fill(frontP);
  // 3. 귀 단면 그림 (귓바퀴 · 외이도 · 고막 · 귓속뼈 · 달팽이관)
  const pl = earPlate(o.k);
  if (pl) ctx.drawImage(pl.c, EA.cx - EA.r, EA.cy - EA.r, 2 * EA.r, 2 * EA.r);
  // 4. 덮개 안의 파동: 껍데기를 지나 약해진 소음(빨강) + 스피커 진동판이 낸 상쇄음(파랑). 외이도 입구에서 반대 위상이 되게 맞춤
  const cone = EA.cone, De = Math.hypot(M[0] - S[0], M[1] - S[1]), Da = Math.hypot(M[0] - cone[0], M[1] - cone[1]);
  const off = (((Da - De - 0.5 * lam - o.lag * lam) % lam) + lam) % lam;
  ctx.save(); ctx.clip(frontP);
  noiseArcs(0.62, lw * 0.9);
  if (o.anc) {
    ctx.strokeStyle = T.anti; ctx.lineWidth = lw;
    for (let k = -1; k < 6; k++) { const r = (k + ph) * lam + off; if (r < 52) continue; ctx.globalAlpha = Math.min(1, clamp(o.g, 0, 1.2)) * clamp(1.1 - r / 330, 0, 1) * 0.9; ctx.beginPath(); ctx.arc(cone[0], cone[1], r, -1.25, 1.25); ctx.stroke(); }
    ctx.globalAlpha = 1;
  }

/* =====================================================================
   장면 (수업 순서)
   ===================================================================== */
function ancScene(cfg) {
  return Object.assign({
    kind: 'anc',
    enter() { this.p = Object.assign({}, this.p0); },
    parts() { return noiseParts(this.p.noise, this.p.f); },
    vals() {
      const ps = this.parts(), g = this.p.anc ? this.p.ratio : 0;
      const r = this.p.anc ? rmsRatio(ps, g, this.p.err, this.p.tau) : 1;
      return { ps, g, r, db: dbOf(r) };
    },
    fn() {   // 화면용 신호 (시간 단위: 초, 실제 진동수)
      const v = this.vals(), tau = this.p.tau / 1000, e = this.p.err * DEG, g = v.g;
      const noise = t => v.ps.reduce((s, p) => s + p.a * Math.sin(TAU * p.f * t + p.ph), 0);
      const anti = t => -g * v.ps.reduce((s, p) => s + p.a * Math.sin(TAU * p.f * (t - tau) + p.ph - e), 0);
      const mus = t => this.p.music ? 0.55 * Math.sin(TAU * 523.25 * t) : 0;
      return { noise, anti, ear: t => noise(t) + anti(t) + mus(t), mus };
    },
    draw() {
      stageBG();
      const v = this.vals(), L = layout({ graph: !!this.graph, hp: true, appFrac: 0.6 }), fb = this.parts()[0].f;
      const lagFrac = this.p.err / 360 + this.p.f * this.p.tau / 1000;
      headphone(L.app, { anc: this.p.anc, g: v.g, lagFrac, ear: Math.max(v.r, this.p.music ? 0.5 : 0), fv: 0.8, comp: L.comp, noiseName: this.p.noise === 'engine' ? '버스 엔진 소리' : `소음 ${this.p.f} Hz`, music: this.p.music, ui: L.ui });
      const F = this.fn(), win = 3 / fb, amp = this.p.noise === 'engine' ? 2.2 : 1.2;
      const rows = [{ label: '소음 (마이크)', col: T.noise, fn: F.noise }];
      if (this.p.anc) rows.push({ label: '상쇄음 (스피커)', col: T.anti, fn: F.anti });
      rows.push({ label: this.p.music ? '귀에 들리는 소리 (음악 + 남은 소음)' : '귀에 들리는 소리', col: T.sum, fn: F.ear, right: this.p.anc ? `${pct(v.r)} %` : '' });
      scope(L.scope, rows, { t0: tv * 0.25 / fb, win, amp, note: `${(win * 1000).toFixed(1)} ms` });
    },
    audio() {
      const v = this.vals(), res = f => this.p.anc ? residual(f, v.g, this.p.err, this.p.tau) : 1;
      if (this.p.noise === 'engine') return { engine: { F: 110, harm: ENG.map(([m, a]) => 0.11 * a * res(110 * m)), rumble: 0.17 * res(110), clatter: 0.07 * res(1500) } };
      return { tones: [{ f: this.p.f, a: 0.15 * res(this.p.f) }] };
    },
    music() { return this.p.music; },
    onParam() { setVoices(this.audio()); }
  }, cfg);
}
const noiseHud = (sc, extra = []) => {
  const v = sc.vals(), on = sc.p.anc;

      // 콩팥: 인터넷 그림(NIH BioArt "Human Kidney", 퍼블릭 도메인)을 좌우로 뒤집어 놓음 — 콩팥 문(혈관 · 요관)은 몸 안쪽(오른쪽),
      // 볼록한 바깥 면은 피부 쪽(근육 층 안). 그림의 콩팥 깔때기 자리(195, 232 px)가 초점 F₂(결석)에 오고, 1 px = 0.037 cm (콩팥 길이 ≈ 13 cm)
      if (IMG.kidney) {
        const ks = 0.037 * u, [kx0, ky0] = P(c, 0);
        ctx.save(); ctx.translate(kx0, ky0);
        if (rot) ctx.transform(0, ks, ks, 0, 0, 0); else ctx.scale(-ks, ks);
        shadow(12, 3, 6, T.dark ? 0.4 : 0.28); ctx.drawImage(IMG.kidney, -195, -232); noShadow();
        ctx.restore();
      }
      // 반사판 (두꺼운 금속 그릇, 안쪽 면이 반짝임)
      shadow(14, 4, 7, 0.3);
      ctx.beginPath(); for (let i = 0; i <= 80; i++) { const th = th0 + (th1 - th0) * i / 80; ctx[i ? 'lineTo' : 'moveTo'](...P(...E(th, 1.13))); }
      for (let i = 80; i >= 0; i--) { const th = th0 + (th1 - th0) * i / 80; ctx.lineTo(...P(...E(th))); } ctx.closePath();
      ctx.fillStyle = lg(...P(-a * 1.13, -b), ...P(-4, b), [[0, mix(T.metal, '#ffffff', 0.3)], [0.5, T['metal-2']], [1, mix(T['metal-2'], '#000000', 0.3)]]); ctx.fill(); noShadow();
      ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = Math.max(1.5, 0.28 * u); ctx.beginPath(); for (let i = 0; i <= 80; i++) { const th = th0 + (th1 - th0) * i / 80; ctx[i ? 'lineTo' : 'moveTo'](...P(...E(th))); } ctx.stroke();
      // 발생기 전극 (반사판 바닥에서 초점 F₁까지)
      ctx.fillStyle = lg(...P(0, -0.5), ...P(0, 0.5), [[0, '#eef1f3'], [1, T['metal-2']]]); RR(-a * 1.13 - 1, -0.55, a * 1.13 + 1 - c - 0.5, 1.1, 0.4); ctx.fill();
      ctx.fillStyle = '#f2efe6'; RR(-c - 3.4, -0.8, 2.4, 1.6, 0.5); ctx.fill();
      ctx.fillStyle = T['metal-2']; ctx.beginPath(); ctx.moveTo(...P(-c - 1, -0.45)); ctx.lineTo(...P(-c - 0.18, 0)); ctx.lineTo(...P(-c - 1, 0.45)); ctx.fill();
      // 같은 길이의 경로 3개
      const s = this.s, path = th => { const p = E(th); return Math.hypot(p[0] - F1[0], p[1] - F1[1]) + Math.hypot(p[0] - F2[0], p[1] - F2[1]); };
      const RAYS = [0.8, 1.0, 1.22], RC = [T.s1, T.anti, T.s2];
      if (this.p.rays) {
        RAYS.forEach((q, i) => {
          const p = E(q * Math.PI);
          ctx.strokeStyle = RC[i]; ctx.lineWidth = 2.2; ctx.setLineDash([7, 5]);
          ctx.beginPath(); ctx.moveTo(...P(...F1)); ctx.lineTo(...P(...p)); ctx.lineTo(...P(...F2)); ctx.stroke(); ctx.setLineDash([]);
        });
      }
      // 파면: 발생기에서 퍼져 반사판에 반사된 뒤 결석으로 모임
      ctx.lineWidth = Math.max(3, 0.55 * u); ctx.lineCap = 'round'; ctx.save(); ctx.shadowColor = T.noise; ctx.shadowBlur = 10 * D.dpr;
      for (const off of [0, -6, -12]) {
        const ss = s + off; if (ss <= 0 || ss > 2 * a + 2) continue;
        ctx.strokeStyle = rgba(T.noise, off === 0 ? 1 : 0.35); ctx.beginPath(); let pen = false;
        for (let i = 0; i <= 120; i++) {
          const th = th0 + (th1 - th0) * i / 120, p = E(th), d1 = Math.hypot(p[0] - F1[0], p[1] - F1[1]);
          let q;
          if (ss < d1) { const ux = (p[0] - F1[0]) / d1, uy = (p[1] - F1[1]) / d1; q = [F1[0] + ux * ss, F1[1] + uy * ss]; }
          else { const d2 = Math.hypot(F2[0] - p[0], F2[1] - p[1]), r = Math.min(ss - d1, d2); q = [p[0] + (F2[0] - p[0]) / d2 * r, p[1] + (F2[1] - p[1]) / d2 * r]; }
          pen ? ctx.lineTo(...P(...q)) : ctx.moveTo(...P(...q)); pen = true;
        }
        ctx.stroke();
      }
      ctx.restore(); ctx.lineCap = 'butt';
      // 방전 불꽃, 결석과 초점의 빛
      const [g1x, g1y] = P(...F1);
      if (s < 1.6) { const k = 1 - s / 1.6; ctx.fillStyle = rg(g1x, g1y, 0, (1.2 + s * 1.5) * u, [[0, `rgba(255,250,220,${0.95 * k})`], [0.4, `rgba(255,200,110,${0.6 * k})`], [1, 'rgba(255,160,80,0)']]); ctx.beginPath(); ctx.arc(g1x, g1y, (1.2 + s * 1.5) * u, 0, TAU); ctx.fill(); }
      const [sx, sy] = P(...F2), focus = Math.max(0, 1 - Math.abs(s - 2 * a) / 1.6);
      if (focus > 0) { ctx.fillStyle = rg(sx, sy, 0, 4.5 * u, [[0, rgba('#fff0c0', 0.95 * focus)], [1, rgba(T.noise, 0)]]); ctx.beginPath(); ctx.arc(sx, sy, 4.5 * u, 0, TAU); ctx.fill(); }
      ctx.fillStyle = rg(sx, sy, 0, 1.7 * u, [[0, 'rgba(70,12,14,.42)'], [0.6, 'rgba(70,12,14,.18)'], [1, 'rgba(70,12,14,0)']]); ctx.beginPath(); ctx.arc(sx, sy, 1.7 * u, 0, TAU); ctx.fill();   // 결석이 든 콩팥 깔때기 (그림자)
      shadow(4, 1, 2, 0.35); ctx.fillStyle = lg(sx - 6, sy - 6, sx + 6, sy + 6, [[0, mix(T.stone, '#ffffff', 0.45)], [1, T.stone]]);
      ctx.beginPath(); for (let i = 0; i < 9; i++) { const ang = i / 9 * TAU, r0 = (0.9 + (i % 3) * 0.18) * Math.max(6, u * 0.9); ctx[i ? 'lineTo' : 'moveTo'](sx + Math.cos(ang) * r0, sy + Math.sin(ang) * r0); } ctx.closePath(); ctx.fill(); noShadow();
      ctx.strokeStyle = 'rgba(80,60,10,.45)'; ctx.lineWidth = 1; ctx.stroke();
      // 경로 번호 (반사되는 곳)
      if (this.p.rays) RAYS.forEach((q, i) => { const [qx, qy] = P(...E(q * Math.PI)); ctx.fillStyle = RC[i]; ctx.beginPath(); ctx.arc(qx, qy, 11, 0, TAU); ctx.fill(); ctx.fillStyle = '#fff'; ctx.font = `700 13px ${T.font}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(i + 1), qx, qy + 0.5); });
      if (rot) { pill('충격파 발생기', ox, oy + 19.8 * u, T.ink); pill('결석', sx + 1.6 * u, sy, T.ink, 'left'); }
      else { pill('충격파 발생기', g1x, g1y + Math.max(28, 2.8 * u), T.ink); pill('결석', sx, sy - Math.max(28, 2.8 * u), T.ink); }
      pill('반사판', ...P(-a + 0.4, -b * 0.82), T.ink, 'left');
      pill('콩팥', ...P(c - 2.6, 7.7), T.ink); pill('물', ...P(-1.8, -9.2), T.anti);
      this.len = RAYS.map(q => path(q * Math.PI));
    },
    hud() {
      const L = this.len || [30, 30, 30];
      return { M: L.map((l, i) => ({ k: `경로 ${['①', '②', '③'][i]}`, v: l.toFixed(1), u: 'cm' })), R: [{ k: '결석에서', dot: T.noise, v: '보강', u: '간섭', s: '세 경로 길이가 같음', f: '같은 위상으로 도착' }] };
    },
    dock() { return [{ t: 'play' }, { t: 'snd', label: '방전 소리' }, { t: 'toggle', key: 'rays', label: '경로 보기' }]; },
    audio() { return {}; },
    onParam() {}
  }
];

/* =====================================================================
   화면 구성과 조작
   ===================================================================== */
let cur = SCENES[0], PB = [], DK = [];
function renderChips() { $('#chips').innerHTML = SCENES.map((s, i) => `<button class="chip" data-i="${i}" aria-pressed="${i === S.i}" title="${i + 1}"><b>${i + 1}</b>${s.chip}</button>`).join(''); }
function go(i) {
  S.i = clamp(i, 0, SCENES.length - 1); S.playing = !reduce;
  cur = SCENES[S.i]; cur.enter();
  document.querySelectorAll('.chip').forEach((b, j) => b.setAttribute('aria-pressed', String(j === S.i)));
  renderBars(); txt($('#caption'), cur.cap); $('#caption').hidden = !S.caption;
  $('#gpanel').hidden = !cur.graph; hudKey = '';
  const cred = cur.credit || (cur.kind === 'anc' ? CREDIT_ANC : '');   // 신체 그림 출처 (그 그림이 보이는 장면에서만)
  html($('#credit'), cred); $('#credit').hidden = !cred; $('#stage').classList.toggle('cred', !!cred); credH();
  setVoices(cur.audio ? cur.audio() : null);
  renderHud();
  try { localStorage.setItem('anc3-scene', String(S.i)); } catch (e) {}
}
const CREDIT_ANC = '<span>그림: Microsoft Fluent Emoji (MIT)</span> · <span>귀 단면: Chittka &amp; Brockmann, Wikimedia Commons (CC BY 2.5)</span>';
function credH() { const c = $('#credit'); $('#stage').style.setProperty('--credh', `${c.hidden ? 0 : c.offsetHeight}px`); }   // 휴대폰: 설명 칸을 출처 글씨 높이만큼 올림
function renderBars() {
  const items = cur.dock();
  PB = items.filter(d => ['play', 'anc', 'snd'].includes(d.t));
  DK = items.filter(d => ['slider', 'seg'].includes(d.t));
  const tg = items.filter(d => d.t === 'toggle' || d.t === 'formula');
  let pb = PB.map((d, i) => {
    if (d.t === 'play') return `<button class="pbtn alt" data-pb="${i}" title="Space"></button>` + (d.noSpeed ? '' : '<div class="seg speed"><button data-speed="1">보통</button><button data-speed="0.3">느리게</button></div>');
    if (d.t === 'anc') return `<button class="pbtn big" data-pb="${i}" title="A"></button>`;
    return '';
  }).join('');
  if (cur.audio) pb += `<button class="pbtn snd" id="sndBtn" aria-pressed="false" title="S">${cur.dock().find(d => d.t === 'snd')?.label || '소리 켜기'}</button>`;
  pb += '<span class="timenote" id="timenote"></span>';
  $('#playbar').innerHTML = pb;
  let dk = DK.map((d, i) => {
    if (d.t === 'slider') return `<div class="dg slider" data-row="${i}"${d.narrow ? ' style="flex-grow:.6"' : ''}><label for="sl${i}">${d.label}<output id="so${i}"></output></label><input type="range" id="sl${i}" data-dk="${i}" min="${d.min}" max="${d.max}" step="${d.step}"></div>`;
    return `<div class="dg" data-row="${i}"><span>${d.label}</span><div class="seg">${d.opts.map(([v, l]) => `<button data-dk="${i}" data-v="${v}">${l}</button>`).join('')}</div></div>`;
  }).join('');
  const tg2 = PHONE.matches ? tg.filter(d => d.t !== 'formula') : tg;   // 휴대폰: 식은 측정값 카드에 넣지 않으므로 단추도 뺌
  if (tg2.length) dk += `<div class="dg"><div class="tgs">${tg2.map(d => d.t === 'formula' ? '<button class="tg" data-tg="formula">식</button>' : `<button class="tg" data-tg="${d.key}">${d.label}</button>`).join('')}</div></div>`;
  $('#dock').innerHTML = dk;
  syncBars();
}
function syncBars() {
  PB.forEach((d, i) => {
    const el = document.querySelector(`#playbar [data-pb="${i}"]`); if (!el) return;
    if (d.t === 'play') { txt(el, S.playing ? '❚❚' : '▶'); el.setAttribute('aria-label', S.playing ? '멈춤' : '재생'); }
    if (d.t === 'anc') { html(el, `소음 제거<span class="pl-x"> ${cur.p.anc ? '켜짐' : '꺼짐'}</span>`); el.setAttribute('aria-pressed', String(!!cur.p.anc)); }
  });
  document.querySelectorAll('#playbar [data-speed]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.speed === S.speed)));
  const sb = $('#sndBtn'); if (sb) { sb.setAttribute('aria-pressed', String(AU.on)); const lab = cur.dock().find(d => d.t === 'snd')?.label; html(sb, AU.on ? '소리<span class="pl-x"> 끄기</span>' : (lab || '소리<span class="pl-x"> 켜기</span>')); sb.setAttribute('aria-label', AU.on ? '소리 끄기' : (lab || '소리 켜기')); }
  const tn = $('#timenote'); if (tn) txt(tn, !S.playing ? '일시정지' : cur.realTime ? '실제 빠르기 · 소리와 같음' : '파형은 느리게 그림 · 소리는 실제');
  DK.forEach((d, i) => {
    const row = document.querySelector(`#dock [data-row="${i}"]`); if (row) row.hidden = !!(d.show && !d.show());
    if (d.t === 'slider') { const el = $('#sl' + i); if (!el) return; if (document.activeElement !== el) el.value = cur.p[d.key]; html($('#so' + i), d.fmt(cur.p[d.key])); }
    else document.querySelectorAll(`#dock [data-dk="${i}"]`).forEach(b => b.setAttribute('aria-pressed', String(d.on ? d.on(+b.dataset.v) : d.key === 'df' ? +b.dataset.v === cur.p.f2 - cur.p.f1 : b.dataset.v === String(cur.p[d.key]))));
  });
  document.querySelectorAll('#dock [data-tg]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tg === 'formula' ? S.formula : !!cur.p[b.dataset.tg])));
}
function roHTML(o, compact) {
  const dot = o.dot ? `<i style="background:${o.dot}"></i>` : '';
  let h = compact
    ? `<div class="ro${o.opt ? ' ro-opt' : ''}"><span>${o.k}</span><b>${o.v}${o.u ? `<small>${o.u}</small>` : ''}</b></div>`
    : `<div class="ro-k">${dot}${o.k}</div><div class="ro-db"><b>${o.v}</b>${o.u ? `<small>${o.u}</small>` : ''}</div>`;
  if (o.s) h += `<div class="ro-sub${compact ? ' ro-opt' : ''}">${o.s}</div>`;
  if (o.f && S.formula) h += `<div class="ro-f">${o.f}</div>`;
  return h;
}
let hudKey = '';
function renderHud() {
  const h = cur.hud(), parts = [];
  if (h.M && h.M.length) parts.push(h.M.map(o => roHTML(o, true)).join(''));
  if (h.R && h.R.length) parts.push(h.R.map(o => roHTML(o, false)).join('<div class="ro-sep"></div>'));
  const s = parts.join(`<div class="ro-sep${h.M && h.M.every(o => o.opt) ? ' ro-opt' : ''}"></div>`);   // 휴대폰에서 위 칸이 모두 숨으면 구분선도
  if (s !== hudKey) { $('#readout').innerHTML = s; hudKey = s; }
  if (cur.graph) { const g = cur.graph(); txt($('#gTitle'), g[0]); txt($('#gUnit'), g[1]); }
}
function setP(key, val) { cur.p[key] = val; cur.onParam(key); syncBars(); renderHud(); }

$('#chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) go(+b.dataset.i); });
$('#playbar').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'sndBtn') { soundToggle(); return; }
  if (b.dataset.pb != null) { const d = PB[+b.dataset.pb]; if (d.t === 'play') S.playing = !S.playing; if (d.t === 'anc') { setP('anc', !cur.p.anc); return; } }
  else if (b.dataset.speed) S.speed = +b.dataset.speed;
  syncBars(); renderHud();
});
$('#dock').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.dk != null) { const d = DK[+b.dataset.dk], v = b.dataset.v; setP(d.key, isNaN(+v) ? v : +v); return; }
  if (b.dataset.tg) { if (b.dataset.tg === 'formula') { S.formula = !S.formula; try { localStorage.setItem('anc3-formula', S.formula ? '1' : '0'); } catch (err) {} syncBars(); renderHud(); } else setP(b.dataset.tg, !cur.p[b.dataset.tg]); }
});
$('#dock').addEventListener('input', e => { const r = e.target.closest('input[data-dk]'); if (!r) return; setP(DK[+r.dataset.dk].key, +r.value); });
$('#capBtn').addEventListener('click', () => { S.caption = !S.caption; $('#caption').hidden = !S.caption; $('#capBtn').setAttribute('aria-pressed', String(S.caption)); try { localStorage.setItem('anc3-cap', S.caption ? '1' : '0'); } catch (e) {} });
function toggleFS() {
  try {
    if (document.fullscreenElement) { const p = document.exitFullscreen(); if (p && p.catch) p.catch(() => {}); }
    else { const el = $('#app'), fn = el.requestFullscreen || el.webkitRequestFullscreen; if (fn) { const p = fn.call(el); if (p && p.catch) p.catch(() => {}); } }
  } catch (e) {}
}
$('#fsBtn').addEventListener('click', toggleFS);
document.addEventListener('fullscreenchange', () => { txt($('#fsBtn'), document.fullscreenElement ? '전체 화면 끝' : '전체 화면'); resize(); });
document.addEventListener('keydown', e => {
  // 슬라이더를 만진 뒤에도 단축키가 듣도록 range는 막지 않는다 (글자 입력 칸만 제외)
  if (e.target.matches?.('input:not([type="range"]), textarea, select') || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (e.key === ' ') { e.preventDefault(); S.playing = !S.playing; syncBars(); return; }
  if (/^[1-9]$/.test(e.key) && +e.key <= SCENES.length) { go(+e.key - 1); return; }
  if (k === 'f') { toggleFS(); return; }
  if (k === 'c') { $('#capBtn').click(); return; }
  if (k === 's' && cur.audio) { soundToggle(); return; }
  if (k === 'a' && cur.kind === 'anc') setP('anc', !cur.p.anc);
});

/* ---------- 시작과 반복 (시간 기반) ---------- */
readTheme(); resize();
new ResizeObserver(resize).observe($('#stage'));
renderChips();
try {
  if (localStorage.getItem('anc3-cap') === '0') S.caption = false;
  if (localStorage.getItem('anc3-formula') === '1') S.formula = true;
  const i = +(localStorage.getItem('anc3-scene') || 0); if (i >= 0 && i < SCENES.length) S.i = i;
} catch (e) {}
$('#capBtn').setAttribute('aria-pressed', String(S.caption));
go(S.i);
PHONE.addEventListener('change', () => { renderBars(); hudKey = ''; renderHud(); });   // 휴대폰 ↔ 큰 화면 (회전 등)
let last = performance.now(), tick = 0, pending = false;
function loop(now) { pending = false; frame(now); request(); }
function request() { if (!pending) { pending = true; requestAnimationFrame(loop); } }
setInterval(() => { if (performance.now() - last > 300) frame(performance.now()); }, 100);
function frame(now) {
  const dt = Math.min(0.5, Math.max(0, (now - last) / 1000)); last = now;
  if (S.playing) { tv += dt * S.speed; if (cur.step) cur.step(dt * S.speed, dt); }
  ctx.setTransform(D.dpr, 0, 0, D.dpr, 0, 0); ctx.globalAlpha = 1; ctx.setLineDash([]); noShadow();
  cur.draw();
  musicTick();
  if ((tick = (tick + 1) % 4) === 0) { renderHud(); syncBars(); }
}
request();
})();
</script>
